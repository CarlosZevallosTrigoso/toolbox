<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORJA - MD Merger</title>
    <style>
        :root {
            --bg-color: #f4f4f5;
            --surface: #ffffff;
            --primary: #18181b;
            --primary-hover: #3f3f46;
            --border: #e4e4e7;
            --border-highlight: #3b82f6;
            --text-main: #27272a;
            --text-muted: #71717a;
            --bg-highlight: #eff6ff;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        .container {
            background: var(--surface);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: var(--primary); }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .upload-zone {
            border: 2px dashed var(--border);
            background-color: var(--surface);
            border-radius: 6px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
            display: block;
        }
        /* Estado visual al arrastrar por encima */
        .upload-zone.highlight {
            border-color: var(--border-highlight);
            background-color: var(--bg-highlight);
            color: var(--border-highlight);
        }
        .upload-zone input[type="file"] { display: none; }
        
        #file-list {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem 0;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            display: none;
        }
        #file-list li {
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }
        #file-list li:last-child { border-bottom: none; }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, opacity 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ensamblador de Archivos Markdown</h1>
        <p>Arrastra los archivos .md aquí o haz clic para seleccionarlos. Se unirán en orden alfabético.</p>
        
        <label class="upload-zone" id="drop-zone">
            <span>Haz clic para seleccionar o arrastra archivos aquí</span>
            <input type="file" id="file-input" multiple accept=".md,.txt">
        </label>

        <ul id="file-list"></ul>

        <button id="merge-btn" disabled>Unir y Descargar Documento</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const fileList = document.getElementById('file-list');
        const mergeBtn = document.getElementById('merge-btn');
        let selectedFiles = [];

        // 1. BLOQUEAR EL COMPORTAMIENTO POR DEFECTO DEL NAVEGADOR
        // Previene que soltar un archivo fuera de la zona abra el documento y arruine la sesión
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 2. EFECTOS VISUALES PARA LA ZONA DE DRAG & DROP
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('highlight');
        }

        function unhighlight(e) {
            dropZone.classList.remove('highlight');
        }

        // 3. CAPTURAR LOS ARCHIVOS AL SOLTAR (DROP)
        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            processFiles(files);
        }

        // 4. CAPTURAR ARCHIVOS AL HACER CLIC
        fileInput.addEventListener('change', function(e) {
            processFiles(this.files);
        });

        // 5. LÓGICA CENTRAL DE PROCESAMIENTO
        function processFiles(files) {
            // Convertimos a Array, filtramos (opcionalmente) por extensión y ordenamos
            selectedFiles = Array.from(files)
                .sort((a, b) => a.name.localeCompare(b.name));
            
            renderFileList();
            mergeBtn.disabled = selectedFiles.length === 0;
        }

        function renderFileList() {
            fileList.innerHTML = '';
            if (selectedFiles.length > 0) {
                fileList.style.display = 'block';
                selectedFiles.forEach((file, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${index + 1}. ${file.name}</span> <span>${(file.size / 1024).toFixed(1)} KB</span>`;
                    fileList.appendChild(li);
                });
            } else {
                fileList.style.display = 'none';
            }
        }

        // Lógica de lectura y concatenación
        mergeBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;
            
            mergeBtn.textContent = "Procesando...";
            mergeBtn.disabled = true;

            try {
                const fileContents = await Promise.all(selectedFiles.map(readFileAsync));
                const mergedText = fileContents.join('\n\n---\n\n');
                downloadBlob(mergedText, 'documento_unificado.md');
            } catch (error) {
                alert("Error crítico leyendo los archivos: " + error.message);
            } finally {
                mergeBtn.textContent = "Unir y Descargar Documento";
                mergeBtn.disabled = false;
            }
        });

        function readFileAsync(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => resolve(event.target.result);
                reader.onerror = (error) => reject(error);
                reader.readAsText(file, 'UTF-8'); 
            });
        }

        function downloadBlob(content, filename) {
            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
