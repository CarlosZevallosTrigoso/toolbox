<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pdf-splitter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0b;
    color: #999;
    min-height: 100vh;
    padding: 3rem 2.5rem;
    font-size: 0.88rem;
    line-height: 1.7;
  }

  code, .mono {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  .back-link {
    display: inline-block;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #444;
    text-decoration: none;
    margin-bottom: 1.2rem;
    font-size: 0.82rem;
  }
  .back-link:hover { color: #888; }

  h1 {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.88rem;
    font-weight: normal;
    color: #555;
    margin-bottom: 2rem;
  }

  /* Drop zone */
  .dropzone {
    border: 1px dashed #2a2a2e;
    background: #111113;
    padding: 2.5rem 2rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 1.5rem;
    border-radius: 4px;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #5a7a3a;
    background: rgba(90, 140, 60, 0.04);
  }
  .dropzone input { display: none; }
  .dropzone-label { color: #666; }
  .dropzone-label strong { color: #aaa; font-weight: 500; }

  /* File info */
  .file-info {
    display: none;
    background: #111113;
    border: 1px solid #222225;
    border-radius: 4px;
    padding: 0.9rem 1.2rem;
    margin-bottom: 2rem;
    align-items: center;
    gap: 1rem;
  }
  .file-info.visible { display: flex; }
  .file-name {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #ccc;
    font-size: 0.85rem;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-pages {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #5a7a3a;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .btn-clear {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.88rem;
    padding: 0.2rem 0.5rem;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .btn-clear:hover { color: #ccc; background: #1a1a1e; }

  /* Mode tabs */
  .mode-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
    border: 1px solid #222225;
    border-radius: 4px;
    overflow: hidden;
    max-width: 360px;
  }
  .mode-tab {
    flex: 1;
    background: #111113;
    border: none;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    color: #555;
    cursor: pointer;
    padding: 0.6rem 1rem;
    transition: all 0.15s;
  }
  .mode-tab + .mode-tab { border-left: 1px solid #222225; }
  .mode-tab.active {
    color: #ccc;
    background: #18181c;
  }
  .mode-tab:hover:not(.active) { color: #888; background: #141416; }

  /* Panels */
  .panel { display: none; margin-bottom: 2rem; }
  .panel.active { display: block; }

  .field-label {
    display: block;
    color: #666;
    font-size: 0.8rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.4rem;
  }

  .field-hint {
    color: #444;
    margin-bottom: 0.7rem;
    font-size: 0.84rem;
  }
  .field-hint code {
    color: #777;
    font-size: 0.82rem;
  }

  input[type="text"], input[type="number"] {
    background: #111113;
    border: 1px solid #222225;
    border-radius: 4px;
    color: #ccc;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.85rem;
    padding: 0.6rem 0.8rem;
    outline: none;
    width: 100%;
    max-width: 400px;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #5a7a3a; }
  input::placeholder { color: #333; }

  .chunk-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .chunk-row input { width: 100px; }
  .chunk-row span { color: #555; }

  /* Actions */
  .btn-split {
    background: #5a7a3a;
    border: none;
    color: #e8e8ec;
    font-family: inherit;
    font-size: 0.84rem;
    font-weight: 500;
    padding: 0.65rem 1.8rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 2rem;
    border-radius: 4px;
  }
  .btn-split:hover { background: #6a8e46; }
  .btn-split:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Results */
  .results { display: none; }
  .results.visible { display: block; }

  .results-header {
    color: #555;
    font-size: 0.8rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.75rem;
  }

  .result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1rem;
    background: #111113;
    border: 1px solid #1a1a1e;
    border-radius: 4px;
    margin-bottom: 0.4rem;
    max-width: 500px;
    transition: border-color 0.15s;
  }
  .result-item:hover { border-color: #2a2a2e; }

  .result-name {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #aaa;
    font-size: 0.82rem;
  }
  .result-pages { color: #555; margin-left: 0.75rem; font-size: 0.82rem; }

  .btn-download {
    background: none;
    border: 1px solid #222225;
    color: #777;
    font-family: inherit;
    font-size: 0.8rem;
    padding: 0.3rem 0.8rem;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .btn-download:hover { border-color: #5a7a3a; color: #5a7a3a; }

  .btn-download-all {
    background: none;
    border: 1px solid #222225;
    color: #777;
    font-family: inherit;
    font-size: 0.84rem;
    cursor: pointer;
    margin-top: 0.75rem;
    padding: 0.55rem 1.2rem;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .btn-download-all:hover { border-color: #5a7a3a; color: #5a7a3a; }

  .error-msg {
    color: #c45;
    display: none;
    margin-bottom: 0.75rem;
    font-size: 0.84rem;
  }
  .error-msg.visible { display: block; }
</style>
</head>
<body>

<a href="../index.html" class="back-link">← toolbox/</a>
<h1>pdf-splitter</h1>

<div class="dropzone" id="dropzone">
  <div class="dropzone-label">arrastra un pdf aquí o <strong>haz clic</strong></div>
  <input type="file" id="fileInput" accept=".pdf">
</div>

<div class="file-info" id="fileInfo">
  <span class="file-name" id="fileName"></span>
  <span class="file-pages" id="filePages"></span>
  <button class="btn-clear" id="btnClear">✕</button>
</div>

<div class="mode-tabs" id="modeTabs">
  <button class="mode-tab active" data-mode="ranges">por rangos</button>
  <button class="mode-tab" data-mode="chunks">partes iguales</button>
</div>

<div class="panel active" id="panelRanges">
  <div class="field-label">rangos de páginas</div>
  <div class="field-hint">separar con comas: <code>1-5, 8, 12-20</code></div>
  <input type="text" id="inputRanges" placeholder="1-5, 6-10, 11-15">
</div>

<div class="panel" id="panelChunks">
  <div class="field-label">páginas por fragmento</div>
  <div class="chunk-row">
    <input type="number" id="inputChunks" min="1" value="5" placeholder="5">
    <span>páginas por parte</span>
  </div>
</div>

<div class="error-msg" id="errorMsg"></div>

<button class="btn-split" id="btnSplit" disabled>fragmentar</button>

<div class="results" id="results">
  <div class="results-header">fragmentos generados</div>
  <div id="resultsList"></div>
  <button class="btn-download-all" id="btnDownloadAll">descargar todos</button>
</div>

<script>
const { PDFDocument } = PDFLib;

let pdfBytes = null;
let pdfDoc = null;
let totalPages = 0;
let generatedFiles = [];
let currentMode = 'ranges';

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const fileName = document.getElementById('fileName');
const filePages = document.getElementById('filePages');
const btnClear = document.getElementById('btnClear');
const modeTabs = document.getElementById('modeTabs');
const panelRanges = document.getElementById('panelRanges');
const panelChunks = document.getElementById('panelChunks');
const inputRanges = document.getElementById('inputRanges');
const inputChunks = document.getElementById('inputChunks');
const btnSplit = document.getElementById('btnSplit');
const results = document.getElementById('results');
const resultsList = document.getElementById('resultsList');
const btnDownloadAll = document.getElementById('btnDownloadAll');
const errorMsg = document.getElementById('errorMsg');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

async function loadFile(file) {
  if (file.type !== 'application/pdf') { showError('solo se aceptan archivos pdf.'); return; }
  try {
    pdfBytes = await file.arrayBuffer();
    pdfDoc = await PDFDocument.load(pdfBytes);
    totalPages = pdfDoc.getPageCount();
    fileName.textContent = file.name;
    filePages.textContent = totalPages + ' pág.';
    fileInfo.classList.add('visible');
    btnSplit.disabled = false;
    results.classList.remove('visible');
    hideError();
  } catch (err) {
    showError('no se pudo leer el pdf.');
  }
}

btnClear.addEventListener('click', () => {
  pdfBytes = null; pdfDoc = null; totalPages = 0;
  fileInput.value = '';
  fileInfo.classList.remove('visible');
  btnSplit.disabled = true;
  results.classList.remove('visible');
  generatedFiles = [];
  hideError();
});

modeTabs.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    modeTabs.querySelector('.active').classList.remove('active');
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    panelRanges.classList.toggle('active', currentMode === 'ranges');
    panelChunks.classList.toggle('active', currentMode === 'chunks');
    hideError();
  });
});

function parseRanges(str) {
  const ranges = [];
  const parts = str.split(',').map(s => s.trim()).filter(Boolean);
  for (const part of parts) {
    const match = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if (match) {
      const start = parseInt(match[1]);
      const end = parseInt(match[2]);
      if (start < 1 || end < start || end > totalPages) {
        throw new Error(`rango inválido: ${part}. páginas válidas: 1-${totalPages}`);
      }
      ranges.push({ start, end });
    } else if (/^\d+$/.test(part)) {
      const p = parseInt(part);
      if (p < 1 || p > totalPages) throw new Error(`página ${p} fuera de rango (1-${totalPages}).`);
      ranges.push({ start: p, end: p });
    } else {
      throw new Error(`no entiendo "${part}". usa formato: 1-5 o 8`);
    }
  }
  if (ranges.length === 0) throw new Error('escribe al menos un rango.');
  return ranges;
}

function chunkRanges(chunkSize) {
  if (chunkSize < 1) throw new Error('el tamaño debe ser al menos 1.');
  const ranges = [];
  for (let i = 1; i <= totalPages; i += chunkSize) {
    ranges.push({ start: i, end: Math.min(i + chunkSize - 1, totalPages) });
  }
  return ranges;
}

btnSplit.addEventListener('click', async () => {
  if (!pdfBytes) return;
  hideError();
  let ranges;
  try {
    if (currentMode === 'ranges') {
      ranges = parseRanges(inputRanges.value);
    } else {
      ranges = chunkRanges(parseInt(inputChunks.value) || 0);
    }
  } catch (err) {
    showError(err.message);
    return;
  }

  btnSplit.disabled = true;
  btnSplit.textContent = 'procesando...';
  generatedFiles = [];
  resultsList.innerHTML = '';

  try {
    const srcDoc = await PDFDocument.load(pdfBytes);
    const baseName = fileName.textContent.replace(/\.pdf$/i, '');

    for (let i = 0; i < ranges.length; i++) {
      const r = ranges[i];
      const newDoc = await PDFDocument.create();
      const indices = [];
      for (let p = r.start - 1; p <= r.end - 1; p++) indices.push(p);
      const copied = await newDoc.copyPages(srcDoc, indices);
      copied.forEach(page => newDoc.addPage(page));
      const bytes = await newDoc.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const name = `${baseName}_p${r.start}-${r.end}.pdf`;
      generatedFiles.push({ name, url, blob, start: r.start, end: r.end });
    }

    renderResults();
  } catch (err) {
    showError('error al procesar: ' + err.message);
  }

  btnSplit.disabled = false;
  btnSplit.textContent = 'fragmentar';
});

function renderResults() {
  resultsList.innerHTML = '';
  generatedFiles.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'result-item';
    const pageCount = f.end - f.start + 1;
    div.innerHTML = `
      <div>
        <span class="result-name">${f.name}</span>
        <span class="result-pages">${pageCount} pág.</span>
      </div>
      <button class="btn-download" data-idx="${i}">descargar</button>
    `;
    resultsList.appendChild(div);
  });
  resultsList.querySelectorAll('.btn-download').forEach(btn => {
    btn.addEventListener('click', () => download(generatedFiles[btn.dataset.idx]));
  });
  results.classList.add('visible');
}

function download(f) {
  const a = document.createElement('a');
  a.href = f.url;
  a.download = f.name;
  a.click();
}

btnDownloadAll.addEventListener('click', () => {
  generatedFiles.forEach((f, i) => setTimeout(() => download(f), i * 300));
});

function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('visible'); }
function hideError() { errorMsg.textContent = ''; errorMsg.classList.remove('visible'); }
</script>

</body>
</html>
