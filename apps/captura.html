<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAPTURA · momento en JSON</title>
<style>
  :root{
    --bg:#16170f;
    --panel:#1f2017;
    --line:#33352a;
    --ink:#d8d6c4;
    --ink-dim:#8a8c78;
    --accent:#8fa676;
    --accent-dim:#5c6b4b;
    --warn:#c08a5a;
    --mono: ui-monospace, "SF Mono", "Fira Code", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--mono); font-size:13px; line-height:1.5;
    min-height:100vh; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    padding:16px 18px 12px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:10px;
  }
  header h1{
    margin:0; font-size:13px; font-weight:600; letter-spacing:.22em; cursor:pointer;
    color:var(--ink); user-select:none;
  }
  header p{margin:0; color:var(--ink-dim); font-size:11px}

  main{flex:1; max-width:560px; width:100%; margin:0 auto; padding-bottom:24px}

  section{border-bottom:1px solid var(--line); padding:14px 18px}
  .sec-t{
    color:var(--ink-dim); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    margin-bottom:10px;
  }
  .sw{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:7px 0; cursor:pointer;
  }
  .sw > span{color:var(--ink)}
  .sw small{display:block; color:var(--ink-dim); font-size:10px; margin-top:1px}
  .tog{
    flex:none; width:38px; height:20px; border:1px solid var(--line); border-radius:2px;
    background:#12130c; position:relative; transition:border-color .12s;
  }
  .tog::after{
    content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
    background:var(--ink-dim); border-radius:2px; transition:left .12s, background .12s;
  }
  .sw input{display:none}
  .sw input:checked + .tog{border-color:var(--accent-dim)}
  .sw input:checked + .tog::after{left:20px; background:var(--accent)}

  .sub{padding:4px 0 6px 0}
  .inline{display:flex; align-items:center; gap:10px}
  .inline input[type=range]{flex:1; accent-color:var(--accent)}
  .val{color:var(--accent); font-variant-numeric:tabular-nums; min-width:3ch; text-align:right}
  .selrow{display:flex; gap:8px; align-items:center; padding:4px 0}
  select{
    flex:1; background:#12130c; color:var(--ink); border:1px solid var(--line);
    border-radius:2px; padding:6px; font-family:var(--mono); font-size:12px;
  }
  .hide{display:none !important}

  /* previsualización de cámara */
  #prev-wrap{position:relative; margin-top:8px; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:#000}
  #prev{display:block; width:100%; max-height:38vh; object-fit:cover}

  /* botón de captura */
  #cap-zone{padding:18px}
  #cap{
    width:100%; padding:16px; font-family:var(--mono); font-size:14px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
    background:var(--accent-dim); color:#0e0f08; border:1px solid var(--accent-dim); border-radius:2px;
    transition:background .12s;
  }
  #cap:active{background:var(--accent)}
  #cap:disabled{opacity:.4}
  #cap.rec{background:var(--warn); border-color:var(--warn)}
  #estado-linea{
    text-align:center; color:var(--ink-dim); font-size:11px; min-height:17px; margin-top:8px;
    font-variant-numeric:tabular-nums;
  }

  /* resultado */
  #resultado{display:none}
  #resultado.on{display:block}
  .ficha{padding:14px 18px}
  .ficha img{width:100%; border:1px solid var(--line); border-radius:2px; display:block}
  .ficha audio{width:100%; margin-top:8px}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:11px}
  td{padding:3px 0; vertical-align:top}
  td:first-child{color:var(--ink-dim); width:38%}
  td:last-child{color:var(--ink); word-break:break-word}
  td .ok{color:var(--accent)}
  td .no{color:var(--warn)}
  .btnrow{display:flex; gap:8px; padding:0 18px 18px}
  .btnrow button{
    flex:1; font-family:var(--mono); font-size:12px; letter-spacing:.04em; cursor:pointer;
    border-radius:2px; padding:10px; border:1px solid var(--line);
    background:#12130c; color:var(--ink); transition:border-color .12s, color .12s;
  }
  .btnrow button:hover{border-color:var(--accent); color:var(--accent)}
  .btnrow button.primary{background:var(--accent-dim); border-color:var(--accent-dim); color:#0e0f08; font-weight:600}

  /* navegación de vistas */
  nav{display:flex; border-bottom:1px solid var(--line)}
  nav button{
    flex:1; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    padding:10px; background:none; border:none; color:var(--ink-dim); cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav button.act{color:var(--accent); border-bottom-color:var(--accent)}

  /* visor / archivo */
  #visor{display:none}
  #visor.on{display:block}
  #drop-json{
    margin:14px 18px 0; border:1px dashed var(--line); border-radius:2px; padding:16px;
    text-align:center; color:var(--ink-dim); cursor:pointer; font-size:11px;
    transition:border-color .12s, color .12s;
  }
  #drop-json.hot, #drop-json:active{border-color:var(--accent); color:var(--ink)}
  #lista{padding:6px 0}
  .item{
    display:flex; align-items:center; gap:12px; padding:10px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .item:hover{background:#1a1b12}
  .item .cuando{color:var(--ink); font-variant-numeric:tabular-nums}
  .item .que{color:var(--ink-dim); font-size:10px; margin-top:1px}
  .item .peso{margin-left:auto; color:var(--ink-dim); font-size:10px; font-variant-numeric:tabular-nums; flex:none}
  .vacio{padding:24px 18px; color:var(--ink-dim); text-align:center; font-size:11px}
</style>
</head>
<body>
  <header>
    <h1 id="titulo">CAPTURA</h1>
    <p>congela un momento · exporta JSON</p>
  </header>

  <nav>
    <button id="nav-cap" class="act">capturar</button>
    <button id="nav-arc">archivo</button>
  </nav>

  <main>
    <!-- composición del momento -->
    <div id="config">
      <section>
        <div class="sec-t">Sensores · siempre que el dispositivo los dé</div>
        <label class="sw"><span>movimiento y orientación<small>acelerómetro · giroscopio · brújula · 1 s de muestras</small></span>
          <input type="checkbox" id="t-mov" checked><span class="tog"></span></label>
        <label class="sw"><span>posición<small>GPS · lat/lon/altitud/precisión</small></span>
          <input type="checkbox" id="t-pos" checked><span class="tog"></span></label>
      </section>

      <section>
        <div class="sec-t">Media · qué incluye el momento</div>
        <label class="sw"><span>foto<small>un cuadro de la cámara, JPEG embebido</small></span>
          <input type="checkbox" id="t-foto"><span class="tog"></span></label>
        <div id="foto-opts" class="sub hide">
          <div class="selrow">
            <select id="camara">
              <option value="environment">cámara trasera</option>
              <option value="user">cámara frontal</option>
            </select>
          </div>
          <div id="prev-wrap"><video id="prev" autoplay playsinline muted></video></div>
        </div>
        <label class="sw"><span>audio<small>clip embebido, AAC en Safari</small></span>
          <input type="checkbox" id="t-audio"><span class="tog"></span></label>
        <div id="audio-opts" class="sub hide">
          <div class="inline"><span style="color:var(--ink-dim);font-size:11px">duración</span>
            <input type="range" id="dur" min="2" max="15" value="5"><span class="val"><span id="dur-v">5</span>s</span>
          </div>
        </div>
      </section>

      <div id="cap-zone">
        <button id="cap">● capturar momento</button>
        <div id="estado-linea"></div>
      </div>
    </div>

    <!-- resultado -->
    <div id="resultado">
      <div class="ficha">
        <div class="sec-t">Momento capturado</div>
        <img id="r-foto" class="hide" alt="Foto del momento">
        <audio id="r-audio" class="hide" controls></audio>
        <table id="r-tabla"></table>
      </div>
      <div class="btnrow">
        <button id="exportar" class="primary">exportar JSON</button>
        <button id="otra">nueva captura</button>
      </div>
      <div class="btnrow" id="extraer" style="padding-top:0">
        <button id="sacar-foto" class="hide">guardar foto</button>
        <button id="sacar-sello" class="hide">foto+datos</button>
        <button id="sacar-audio" class="hide">guardar audio</button>
        <button id="borrar" class="hide">borrar de memoria</button>
      </div>
    </div>

    <!-- archivo / visor -->
    <div id="visor">
      <div id="drop-json">suelta un captura_*.json aquí, o toca para elegir</div>
      <input type="file" id="file-json" accept="application/json,.json" class="hide">
      <div class="sec-t" style="padding:14px 18px 0">Memoria corta · este navegador</div>
      <div id="lista"></div>
    </div>
  </main>

<script>
'use strict';
// ============================================================
// CAPTURA — núcleo puro (sin DOM). Testeado en Node.
// ============================================================
function resumenEje(valores) {
  const v = valores.filter((x) => typeof x === 'number' && isFinite(x));
  if (!v.length) return null;
  let min = Infinity, max = -Infinity, sum = 0;
  for (const x of v) { if (x < min) min = x; if (x > max) max = x; sum += x; }
  const media = sum / v.length;
  let sq = 0;
  for (const x of v) sq += (x - media) * (x - media);
  const r = (n) => Math.round(n * 1000) / 1000;
  return { min: r(min), max: r(max), media: r(media), desv: r(Math.sqrt(sq / v.length)) };
}

function resumenMovimiento(muestras) {
  if (!muestras || !muestras.length) return null;
  const ejes = ['ax', 'ay', 'az', 'agx', 'agy', 'agz', 'rx', 'ry', 'rz'];
  const out = { n: muestras.length, duracionMs: null, ejes: {} };
  const t0 = muestras[0].t, t1 = muestras[muestras.length - 1].t;
  if (typeof t0 === 'number' && typeof t1 === 'number') out.duracionMs = Math.round(t1 - t0);
  for (const e of ejes) {
    const s = resumenEje(muestras.map((m) => m[e]));
    if (s) out.ejes[e] = s;
  }
  const mags = muestras
    .filter((m) => [m.ax, m.ay, m.az].every((x) => typeof x === 'number' && isFinite(x)))
    .map((m) => Math.sqrt(m.ax * m.ax + m.ay * m.ay + m.az * m.az));
  const sm = resumenEje(mags);
  if (sm) out.magnitud = sm;
  return out;
}

function ensamblarMomento(partes) {
  const m = { formato: 'captura/1', creado: partes.creadoISO || null };
  const secciones = ['meta', 'posicion', 'orientacion', 'movimiento', 'pantalla', 'media'];
  for (const s of secciones) {
    if (partes[s] !== null && partes[s] !== undefined) m[s] = partes[s];
  }
  if (partes.estado) m.estado = partes.estado;
  return m;
}

function nombreArchivo(fecha) {
  const p = (n) => String(n).padStart(2, '0');
  return 'captura_' + fecha.getFullYear() + p(fecha.getMonth() + 1) + p(fecha.getDate()) +
    '_' + p(fecha.getHours()) + p(fecha.getMinutes()) + p(fecha.getSeconds()) + '.json';
}

function tamanoLegible(bytes) {
  if (!isFinite(bytes) || bytes < 0) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function escalarDimensiones(w, h, maxLado) {
  if (!(w > 0) || !(h > 0)) return { w: 0, h: 0 };
  const mayor = Math.max(w, h);
  if (mayor <= maxLado) return { w: w, h: h };
  const f = maxLado / mayor;
  return { w: Math.round(w * f), h: Math.round(h * f) };
}

function extensionDeMime(mime) {
  if (!mime) return 'bin';
  const base = String(mime).split(';')[0].trim();
  const mapa = {
    'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp',
    'audio/mp4': 'm4a', 'audio/aac': 'aac', 'audio/webm': 'weba',
    'audio/ogg': 'ogg', 'audio/wav': 'wav', 'application/json': 'json',
  };
  return mapa[base] || (base.split('/')[1] || 'bin');
}

function cardinalDe(deg) {
  if (typeof deg !== 'number' || !isFinite(deg)) return null;
  const pts = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
  return pts[Math.round((((deg % 360) + 360) % 360) / 45) % 8];
}

function fechaSello(iso, tz) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  try {
    const fmt = new Intl.DateTimeFormat('es', {
      timeZone: tz || undefined,
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    });
    const p = {};
    for (const parte of fmt.formatToParts(d)) p[parte.type] = parte.value;
    return p.day + '.' + p.month + '.' + p.year + ' ' + p.hour + ':' + p.minute + ':' + p.second;
  } catch (_) { return d.toISOString(); }
}

function lineasSello(mo) {
  const L = [];
  const f = fechaSello(mo.creado, mo.meta && mo.meta.zonaHoraria);
  let l1 = f || '';
  if (mo.meta && mo.meta.zonaHoraria) l1 += (l1 ? ' · ' : '') + mo.meta.zonaHoraria;
  if (l1) L.push(l1);
  if (mo.posicion) {
    const p = mo.posicion;
    let l2 = p.lat.toFixed(5) + ', ' + p.lon.toFixed(5);
    if (typeof p.precisionM === 'number') l2 += ' ±' + Math.round(p.precisionM) + ' m';
    if (typeof p.altitudM === 'number') l2 += ' · alt ' + Math.round(p.altitudM) + ' m';
    L.push(l2);
  }
  const partes3 = [];
  if (mo.orientacion && typeof mo.orientacion.brujula === 'number') {
    partes3.push(Math.round(mo.orientacion.brujula) + '° ' + cardinalDe(mo.orientacion.brujula));
  }
  if (mo.movimiento && mo.movimiento.resumen && mo.movimiento.resumen.magnitud) {
    partes3.push('agitación máx ' + mo.movimiento.resumen.magnitud.max + ' m/s²');
  }
  if (partes3.length) L.push(partes3.join(' · '));
  return L;
}

// ============================================================
// HILO PRINCIPAL — DOM, permisos, sensores
// ============================================================
(function(){
  const $ = (id) => document.getElementById(id);
  const linea = $('estado-linea');
  const VENTANA_MOV_MS = 1000;

  $('titulo').addEventListener('click', () => location.reload());

  // ---------- estado de UI ----------
  let streamCam = null;      // MediaStream de cámara (previsualización)
  let momento = null;        // último momento ensamblado
  let capturando = false;

  $('dur').addEventListener('input', () => { $('dur-v').textContent = $('dur').value; });

  // ---------- cámara: encender/apagar con el toggle ----------
  async function encenderCamara(){
    apagarCamara();
    try{
      // se pide resolución alta como "ideal": la cámara da lo máximo que pueda
      // sin fallar si no llega (ideal no es exact).
      streamCam = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: $('camara').value,
          width: { ideal: 4032 }, height: { ideal: 3024 },
        }, audio: false
      });
      $('prev').srcObject = streamCam;
      return true;
    }catch(err){
      linea.textContent = 'cámara: ' + traducirError(err);
      $('t-foto').checked = false; $('foto-opts').classList.add('hide');
      return false;
    }
  }
  function apagarCamara(){
    if(streamCam){ streamCam.getTracks().forEach(t => t.stop()); streamCam = null; }
    $('prev').srcObject = null;
  }
  $('t-foto').addEventListener('change', async (e) => {
    $('foto-opts').classList.toggle('hide', !e.target.checked);
    if(e.target.checked) await encenderCamara(); else apagarCamara();
  });
  $('camara').addEventListener('change', () => { if($('t-foto').checked) encenderCamara(); });
  $('t-audio').addEventListener('change', (e) => {
    $('audio-opts').classList.toggle('hide', !e.target.checked);
  });

  function traducirError(err){
    const n = err && err.name;
    if(n === 'NotAllowedError') return 'permiso denegado';
    if(n === 'NotFoundError') return 'no disponible';
    if(n === 'NotReadableError') return 'en uso por otra app';
    return String(n || err);
  }

  // ---------- fuentes de datos ----------
  // Cada fuente devuelve {dato, estado}. Nunca lanza: el momento se ensambla con lo que haya.

  async function pedirPermisoMovimiento(){
    // iOS 13+: requestPermission debe llamarse dentro del gesto del usuario
    try{
      if(typeof DeviceMotionEvent !== 'undefined' &&
         typeof DeviceMotionEvent.requestPermission === 'function'){
        const r = await DeviceMotionEvent.requestPermission();
        return r === 'granted';
      }
      return typeof DeviceMotionEvent !== 'undefined';
    }catch(_){ return false; }
  }

  function capturarMovimiento(ms){
    return new Promise((resolve) => {
      const muestras = [];
      let ultimaOri = null;
      const t0 = performance.now();
      const onMov = (e) => {
        const a = e.acceleration || {}, ag = e.accelerationIncludingGravity || {}, r = e.rotationRate || {};
        muestras.push({
          t: Math.round(performance.now() - t0),
          ax: a.x, ay: a.y, az: a.z,
          agx: ag.x, agy: ag.y, agz: ag.z,
          rx: r.alpha, ry: r.beta, rz: r.gamma,
        });
      };
      const onOri = (e) => {
        ultimaOri = {
          alpha: red(e.alpha), beta: red(e.beta), gamma: red(e.gamma),
          absoluta: !!e.absolute,
        };
        // brújula: solo iOS/WebKit. Fuera de ahí queda ausente, no inventada.
        if(typeof e.webkitCompassHeading === 'number'){
          ultimaOri.brujula = red(e.webkitCompassHeading);
          if(typeof e.webkitCompassAccuracy === 'number') ultimaOri.brujulaPrecision = red(e.webkitCompassAccuracy);
        }
      };
      window.addEventListener('devicemotion', onMov);
      window.addEventListener('deviceorientation', onOri);
      setTimeout(() => {
        window.removeEventListener('devicemotion', onMov);
        window.removeEventListener('deviceorientation', onOri);
        resolve({ muestras, orientacion: ultimaOri });
      }, ms);
    });
  }
  function red(n){ return typeof n === 'number' ? Math.round(n * 100) / 100 : n; }

  function capturarPosicion(){
    return new Promise((resolve) => {
      if(!navigator.geolocation) return resolve({ dato: null, estado: 'no disponible' });
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ dato: {
          lat: p.coords.latitude, lon: p.coords.longitude,
          precisionM: red(p.coords.accuracy),
          altitudM: p.coords.altitude === null ? null : red(p.coords.altitude),
          rumbo: p.coords.heading === null ? null : red(p.coords.heading),
          velocidadMs: p.coords.speed === null ? null : red(p.coords.speed),
        }, estado: 'ok' }),
        (err) => resolve({ dato: null, estado: err.code === 1 ? 'permiso denegado' : err.code === 3 ? 'timeout' : 'error' }),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
      );
    });
  }

  const FOTO_MAX_LADO = 2048;
  function capturarFoto(){
    // requiere previsualización ya encendida (el toggle pidió el permiso)
    const v = $('prev');
    if(!streamCam || !v.videoWidth) return { dato: null, estado: 'sin señal de cámara' };
    const dim = escalarDimensiones(v.videoWidth, v.videoHeight, FOTO_MAX_LADO);
    const c = document.createElement('canvas');
    c.width = dim.w; c.height = dim.h;
    c.getContext('2d').drawImage(v, 0, 0, dim.w, dim.h);
    try{
      return { dato: c.toDataURL('image/jpeg', 0.82), estado: 'ok',
               ancho: c.width, alto: c.height };
    }catch(err){ return { dato: null, estado: 'error al codificar' }; }
  }

  async function capturarAudio(segundos, onTick){
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    }catch(err){ return { dato: null, estado: traducirError(err) }; }
    return new Promise((resolve) => {
      let rec;
      try{ rec = new MediaRecorder(stream); }
      catch(err){
        stream.getTracks().forEach(t => t.stop());
        return resolve({ dato: null, estado: 'MediaRecorder no disponible' });
      }
      const chunks = [];
      rec.ondataavailable = (e) => { if(e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: rec.mimeType || 'audio/mp4' });
        const fr = new FileReader();
        fr.onload = () => resolve({ dato: fr.result, estado: 'ok', tipo: blob.type, segundos });
        fr.onerror = () => resolve({ dato: null, estado: 'error al leer blob' });
        fr.readAsDataURL(blob);
      };
      rec.start();
      let rest = segundos;
      onTick(rest);
      const iv = setInterval(() => {
        rest--;
        if(rest > 0){ onTick(rest); }
        else{ clearInterval(iv); if(rec.state !== 'inactive') rec.stop(); }
      }, 1000);
    });
  }

  // ---------- captura del momento ----------
  async function capturar(){
    if(capturando) return;
    capturando = true;
    const btn = $('cap');
    btn.disabled = true;
    const estado = {};
    const cfg = {
      mov: $('t-mov').checked, pos: $('t-pos').checked,
      foto: $('t-foto').checked, audio: $('t-audio').checked,
      dur: +$('dur').value,
    };
    const ahora = new Date();

    // metadatos siempre presentes
    const meta = {
      userAgent: navigator.userAgent,
      idioma: navigator.language,
      zonaHoraria: (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || null,
      enLinea: navigator.onLine,
    };
    const pantalla = {
      pantalla: { w: screen.width, h: screen.height },
      viewport: { w: window.innerWidth, h: window.innerHeight },
      densidad: window.devicePixelRatio,
      orientacion: (screen.orientation && screen.orientation.type) || null,
    };

    // permiso de movimiento DENTRO del gesto, antes de cualquier await largo
    let movOK = false;
    if(cfg.mov){
      linea.textContent = 'pidiendo permisos…';
      movOK = await pedirPermisoMovimiento();
      if(!movOK) estado.movimiento = 'permiso denegado o no disponible';
    }

    // foto: cuadro inmediato (la cámara ya está encendida por el toggle)
    let media = {};
    if(cfg.foto){
      const f = capturarFoto();
      estado.foto = f.estado;
      if(f.dato) media.foto = { dataURL: f.dato, ancho: f.ancho, alto: f.alto, formato: 'image/jpeg' };
    }

    // lanzar en paralelo: movimiento, posición, audio
    linea.textContent = 'capturando…';
    if(cfg.audio) btn.classList.add('rec');
    const tareas = [];
    tareas.push(cfg.mov && movOK ? capturarMovimiento(VENTANA_MOV_MS) : Promise.resolve(null));
    tareas.push(cfg.pos ? capturarPosicion() : Promise.resolve(null));
    tareas.push(cfg.audio
      ? capturarAudio(cfg.dur, (s) => { linea.textContent = 'grabando audio… ' + s + 's'; })
      : Promise.resolve(null));

    const [rMov, rPos, rAudio] = await Promise.all(tareas);
    btn.classList.remove('rec');

    let movimiento = null, orientacion = null, posicion = null;
    if(rMov){
      const res = resumenMovimiento(rMov.muestras);
      if(res){ movimiento = { resumen: res, muestras: rMov.muestras }; estado.movimiento = 'ok'; }
      else if(!estado.movimiento) estado.movimiento = 'sin muestras (¿escritorio?)';
      orientacion = rMov.orientacion;
      if(cfg.mov && !orientacion && !estado.orientacion) estado.orientacion = 'sin lecturas';
    }
    if(rPos){ posicion = rPos.dato; estado.posicion = rPos.estado; }
    if(rAudio){
      estado.audio = rAudio.estado;
      if(rAudio.dato) media.audio = { dataURL: rAudio.dato, formato: rAudio.tipo, segundos: rAudio.segundos };
    }

    momento = ensamblarMomento({
      creadoISO: ahora.toISOString(),
      meta, pantalla, posicion, orientacion, movimiento,
      media: Object.keys(media).length ? media : null,
      estado,
    });
    momento._fecha = ahora; // interno, se quita al exportar

    // memoria corta: guardar sin bloquear la UI; si falla, el momento sigue vivo en pantalla
    try{ momento._id = await guardarEnDB(momento); }
    catch(err){ momento._id = null; }

    mostrarResultado(momento);
    linea.textContent = '';
    btn.disabled = false;
    capturando = false;
  }
  $('cap').addEventListener('click', capturar);

  // ---------- memoria corta (IndexedDB) ----------
  const DB_NOMBRE = 'captura', DB_STORE = 'momentos';
  function abrirDB(){
    return new Promise((resolve, reject) => {
      if(!window.indexedDB) return reject(new Error('IndexedDB no disponible'));
      const req = indexedDB.open(DB_NOMBRE, 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore(DB_STORE, { keyPath: 'id', autoIncrement: true });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function guardarEnDB(mo){
    return abrirDB().then((db) => new Promise((resolve, reject) => {
      const copia = JSON.parse(jsonDe(mo)); // sin campos internos
      const tx = db.transaction(DB_STORE, 'readwrite');
      const req = tx.objectStore(DB_STORE).add({ momento: copia });
      req.onsuccess = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    }));
  }
  function listarDB(){
    return abrirDB().then((db) => new Promise((resolve, reject) => {
      const out = [];
      const tx = db.transaction(DB_STORE, 'readonly');
      tx.objectStore(DB_STORE).openCursor(null, 'prev').onsuccess = (e) => {
        const cur = e.target.result;
        if(!cur){ resolve(out); return; }
        const mo = cur.value.momento || {};
        const media = mo.media || {};
        out.push({
          id: cur.value.id,
          creado: mo.creado,
          tiene: [
            mo.posicion ? 'gps' : null,
            mo.movimiento ? 'mov' : null,
            media.foto ? 'foto' : null,
            media.audio ? 'audio' : null,
          ].filter(Boolean),
          bytes: JSON.stringify(mo).length,
        });
        cur.continue();
      };
      tx.onerror = () => reject(tx.error);
    }));
  }
  function leerDeDB(id){
    return abrirDB().then((db) => new Promise((resolve, reject) => {
      const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(id);
      req.onsuccess = () => resolve(req.result ? req.result.momento : null);
      req.onerror = () => reject(req.error);
    }));
  }
  function borrarDeDB(id){
    return abrirDB().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  }

  // ---------- navegación de vistas ----------
  function verVista(cual){
    $('config').style.display = cual === 'cap' ? '' : 'none';
    $('resultado').classList.toggle('on', cual === 'res');
    $('visor').classList.toggle('on', cual === 'arc');
    $('nav-cap').classList.toggle('act', cual === 'cap' || cual === 'res');
    $('nav-arc').classList.toggle('act', cual === 'arc');
    if(cual !== 'cap') apagarCamara();
  }
  $('nav-cap').addEventListener('click', async () => {
    verVista('cap');
    if($('t-foto').checked) await encenderCamara();
  });
  $('nav-arc').addEventListener('click', () => { verVista('arc'); pintarLista(); });

  // ---------- ficha (compartida entre captura fresca y visor) ----------
  function mostrarResultado(mo){
    momento = mo;
    apagarCamara();
    verVista('res');

    const img = $('r-foto'), au = $('r-audio');
    const media = mo.media || {};
    img.classList.toggle('hide', !media.foto);
    if(media.foto) img.src = media.foto.dataURL;
    au.classList.toggle('hide', !media.audio);
    if(media.audio) au.src = media.audio.dataURL;

    $('sacar-foto').classList.toggle('hide', !media.foto);
    $('sacar-sello').classList.toggle('hide', !media.foto);
    $('sacar-audio').classList.toggle('hide', !media.audio);
    $('borrar').classList.toggle('hide', !mo._id);

    const filas = [];
    filas.push(['creado', mo.creado]);
    if(mo.posicion){
      filas.push(['posición', mo.posicion.lat.toFixed(5) + ', ' + mo.posicion.lon.toFixed(5) +
        ' (±' + mo.posicion.precisionM + ' m)']);
    }
    if(mo.orientacion && typeof mo.orientacion.brujula === 'number'){
      filas.push(['brújula', mo.orientacion.brujula + '°']);
    }
    if(mo.movimiento && mo.movimiento.resumen){
      const r = mo.movimiento.resumen;
      filas.push(['movimiento', r.n + ' muestras / ' + r.duracionMs + ' ms' +
        (r.magnitud ? ' · agitación máx ' + r.magnitud.max + ' m/s²' : '')]);
    }
    if(media.foto && media.foto.ancho){
      filas.push(['foto', media.foto.ancho + '×' + media.foto.alto]);
    }
    const est = mo.estado || {};
    for(const k of Object.keys(est)){
      const ok = est[k] === 'ok';
      filas.push([k, '<span class="' + (ok ? 'ok' : 'no') + '">' + est[k] + '</span>']);
    }
    filas.push(['tamaño JSON', tamanoLegible(new Blob([jsonDe(mo)]).size)]);

    $('r-tabla').innerHTML = filas.map(([k, v]) =>
      '<tr><td>' + k + '</td><td>' + v + '</td></tr>').join('');
  }

  function jsonDe(mo){
    const copia = Object.assign({}, mo);
    delete copia._fecha; delete copia._id;
    return JSON.stringify(copia, null, 2);
  }
  function fechaDe(mo){
    if(mo._fecha) return mo._fecha;
    const d = new Date(mo.creado);
    return isNaN(d) ? new Date() : d;
  }

  // ---------- descargas ----------
  function bajarBlob(blob, nombre){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function blobDeDataURL(dataURL){
    const coma = dataURL.indexOf(',');
    const cabecera = dataURL.slice(0, coma);
    const mime = (cabecera.match(/^data:([^;]+)/) || [])[1] || 'application/octet-stream';
    const bin = atob(dataURL.slice(coma + 1));
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  $('exportar').addEventListener('click', () => {
    if(!momento) return;
    bajarBlob(new Blob([jsonDe(momento)], { type: 'application/json' }), nombreArchivo(fechaDe(momento)));
  });
  $('sacar-foto').addEventListener('click', () => {
    const f = momento && momento.media && momento.media.foto;
    if(!f) return;
    const base = nombreArchivo(fechaDe(momento)).replace(/\.json$/, '');
    bajarBlob(blobDeDataURL(f.dataURL), base + '_foto.' + extensionDeMime(f.formato));
  });
  // foto+datos: banda estilo data-back añadida DEBAJO de la foto (no tapa píxeles)
  $('sacar-sello').addEventListener('click', () => {
    const f = momento && momento.media && momento.media.foto;
    if(!f) return;
    const mo = momento;
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      const lineas = lineasSello(mo);
      const fpx = Math.max(13, Math.round(w * 0.024));   // tamaño de texto proporcional
      const lh = Math.round(fpx * 1.7);
      const pad = Math.round(fpx * 1.2);
      const banda = pad * 2 + lh * Math.max(1, lineas.length);
      const c = document.createElement('canvas');
      c.width = w; c.height = h + banda;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0);
      x.fillStyle = '#16170f';
      x.fillRect(0, h, w, banda);
      x.textBaseline = 'middle';
      x.font = '500 ' + fpx + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
      x.fillStyle = '#d8d6c4';
      lineas.forEach((l, i) => x.fillText(l, pad, h + pad + lh * i + lh / 2));
      // marca discreta en musgo, alineada a la derecha de la primera línea
      x.fillStyle = '#8fa676';
      const marca = 'CAPTURA';
      x.fillText(marca, w - pad - x.measureText(marca).width, h + pad + lh / 2);
      const base = nombreArchivo(fechaDe(mo)).replace(/\.json$/, '');
      c.toBlob((blob) => {
        if(blob) bajarBlob(blob, base + '_sello.jpg');
        else linea.textContent = 'no se pudo generar el sello';
      }, 'image/jpeg', 0.9);
    };
    img.onerror = () => { linea.textContent = 'no se pudo decodificar la foto'; };
    img.src = f.dataURL;
  });
  $('sacar-audio').addEventListener('click', () => {
    const a = momento && momento.media && momento.media.audio;
    if(!a) return;
    const base = nombreArchivo(fechaDe(momento)).replace(/\.json$/, '');
    bajarBlob(blobDeDataURL(a.dataURL), base + '_audio.' + extensionDeMime(a.formato));
  });
  $('borrar').addEventListener('click', async () => {
    if(!momento || !momento._id) return;
    await borrarDeDB(momento._id);
    verVista('arc'); pintarLista();
  });

  $('otra').addEventListener('click', async () => {
    momento = null;
    verVista('cap');
    if($('t-foto').checked) await encenderCamara();
  });

  // ---------- visor: lista de memoria corta ----------
  async function pintarLista(){
    const lista = $('lista');
    let items;
    try{ items = await listarDB(); }
    catch(err){
      lista.innerHTML = '<div class="vacio">memoria corta no disponible en este navegador</div>';
      return;
    }
    if(!items.length){
      lista.innerHTML = '<div class="vacio">sin capturas guardadas — cada captura nueva queda aquí</div>';
      return;
    }
    lista.innerHTML = items.map((it) => {
      const d = new Date(it.creado);
      const cuando = isNaN(d) ? String(it.creado) : d.toLocaleString('es', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      return '<div class="item" data-id="' + it.id + '">' +
        '<div><div class="cuando">' + cuando + '</div>' +
        '<div class="que">' + (it.tiene.join(' · ') || 'solo metadatos') + '</div></div>' +
        '<div class="peso">' + tamanoLegible(it.bytes) + '</div></div>';
    }).join('');
    lista.querySelectorAll('.item').forEach((el) => {
      el.addEventListener('click', async () => {
        const mo = await leerDeDB(+el.dataset.id);
        if(!mo){ pintarLista(); return; }
        mo._id = +el.dataset.id;
        mostrarResultado(mo);
      });
    });
  }

  // ---------- visor: abrir JSON externo ----------
  function abrirJSONExterno(file){
    if(!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const mo = JSON.parse(fr.result);
        if(mo.formato !== 'captura/1'){
          $('drop-json').textContent = 'ese JSON no es una captura (falta formato captura/1)';
          return;
        }
        mostrarResultado(mo);
      }catch(err){
        $('drop-json').textContent = 'no se pudo leer: JSON inválido';
      }
    };
    fr.onerror = () => { $('drop-json').textContent = 'no se pudo leer el archivo'; };
    fr.readAsText(file);
  }
  $('drop-json').addEventListener('click', () => $('file-json').click());
  $('file-json').addEventListener('change', (e) => { abrirJSONExterno(e.target.files[0]); e.target.value = ''; });
  ;['dragenter','dragover'].forEach((ev) => $('drop-json').addEventListener(ev, (e) => {
    e.preventDefault(); $('drop-json').classList.add('hot');
  }));
  ;['dragleave','drop'].forEach((ev) => $('drop-json').addEventListener(ev, (e) => {
    e.preventDefault(); $('drop-json').classList.remove('hot');
    if(ev === 'drop') abrirJSONExterno(e.dataTransfer.files[0]);
  }));
})();
</script>
</body>
