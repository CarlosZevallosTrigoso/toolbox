<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ig-diff</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0b;
    color: #999;
    min-height: 100vh;
    padding: 3rem 2.5rem;
    font-size: 0.88rem;
    line-height: 1.7;
  }

  code, .mono {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  .back-link {
    display: inline-block;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #444;
    text-decoration: none;
    margin-bottom: 1.2rem;
    font-size: 0.82rem;
  }
  .back-link:hover { color: #888; }

  h1 {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.88rem;
    font-weight: normal;
    color: #555;
    margin-bottom: 2rem;
  }

  /* Input grid */
  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    max-width: 800px;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 640px) {
    .input-grid { grid-template-columns: 1fr; }
  }

  .input-col label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #555;
    margin-bottom: 0.4rem;
  }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 0.4em;
    vertical-align: middle;
  }
  .dot-old { background: #c45; }
  .dot-new { background: #5a7a3a; }

  textarea {
    width: 100%;
    height: 200px;
    background: #111113;
    border: 1px solid #222225;
    border-radius: 4px;
    color: #ccc;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.82rem;
    padding: 0.8rem 1rem;
    resize: vertical;
    transition: border-color 0.2s;
    line-height: 1.6;
    outline: none;
  }
  textarea:focus { border-color: #5a7a3a; }
  textarea::placeholder { color: #333; }

  /* Actions */
  .actions {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .btn-primary {
    background: #5a7a3a;
    border: none;
    color: #e8e8ec;
    font-family: inherit;
    font-size: 0.84rem;
    font-weight: 500;
    padding: 0.6rem 1.6rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .btn-primary:hover { background: #6a8e46; }

  .btn-secondary {
    background: none;
    border: 1px solid #222225;
    color: #666;
    font-family: inherit;
    font-size: 0.84rem;
    padding: 0.6rem 1.4rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .btn-secondary:hover { border-color: #333; color: #999; }

  /* Results */
  .results {
    max-width: 800px;
    display: none;
  }
  .results.visible { display: block; }

  /* Stats */
  .stats {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .stat {
    background: #111113;
    border: 1px solid #1e1e22;
    border-radius: 4px;
    padding: 0.65rem 1.1rem;
    text-align: center;
    min-width: 100px;
  }
  .stat .num {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 1.3rem;
    font-weight: normal;
  }
  .stat .lbl {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #555;
    margin-top: 0.1rem;
  }
  .stat.gone .num { color: #c45; }
  .stat.new .num { color: #5a7a3a; }
  .stat.stay .num { color: #5580aa; }

  /* Result columns */
  .result-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
  }
  @media (max-width: 640px) {
    .result-columns { grid-template-columns: 1fr; }
  }

  .result-panel {
    background: #111113;
    border: 1px solid #1e1e22;
    border-radius: 4px;
    overflow: hidden;
  }

  .panel-header {
    padding: 0.6rem 1rem;
    font-size: 0.78rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    border-bottom: 1px solid #1a1a1e;
  }

  .panel-header .count {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.75rem;
    padding: 0.1em 0.5em;
    border-radius: 3px;
  }

  .panel-gone .panel-header { color: #c45; }
  .panel-gone .count { color: #c45; background: rgba(204, 68, 85, 0.08); border: 1px solid rgba(204, 68, 85, 0.15); }

  .panel-new .panel-header { color: #5a7a3a; }
  .panel-new .count { color: #5a7a3a; background: rgba(90, 122, 58, 0.08); border: 1px solid rgba(90, 122, 58, 0.15); }

  .copy-btn {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.7rem;
    padding: 0.15em 0.55em;
    background: none;
    border: 1px solid #222225;
    color: #555;
    border-radius: 3px;
    cursor: pointer;
    margin-left: auto;
    transition: all 0.15s;
  }
  .copy-btn:hover { color: #999; border-color: #333; }

  .user-list {
    padding: 0.5rem 0.75rem;
    max-height: 380px;
    overflow-y: auto;
  }
  .user-list::-webkit-scrollbar { width: 4px; }
  .user-list::-webkit-scrollbar-track { background: transparent; }
  .user-list::-webkit-scrollbar-thumb { background: #222225; border-radius: 2px; }

  .user-item {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.8rem;
    padding: 0.3rem 0.5rem;
    border-radius: 3px;
    cursor: default;
    transition: background 0.12s;
    color: #999;
  }
  .user-item::before {
    content: '@';
    color: #444;
    font-size: 0.75em;
  }
  .panel-gone .user-item:hover { background: rgba(204, 68, 85, 0.06); }
  .panel-new .user-item:hover { background: rgba(90, 122, 58, 0.06); }

  .empty-msg {
    text-align: center;
    padding: 1.5rem 1rem;
    color: #444;
    font-size: 0.84rem;
  }

  .hint {
    color: #333;
    font-size: 0.8rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>

<a href="../index.html" class="back-link">← toolbox/</a>
<h1>ig-diff — comparador de listas</h1>

<div class="input-grid">
  <div class="input-col">
    <label><span class="dot dot-old"></span>lista anterior</label>
    <textarea id="oldList" placeholder="pega aquí los usernames de la lista pasada&#10;&#10;usuario1&#10;usuario2&#10;usuario3"></textarea>
  </div>
  <div class="input-col">
    <label><span class="dot dot-new"></span>lista nueva</label>
    <textarea id="newList" placeholder="pega aquí los usernames de la lista nueva&#10;&#10;usuario1&#10;usuario2&#10;usuario4"></textarea>
  </div>
</div>

<div class="actions">
  <button class="btn-primary" onclick="compare()">comparar</button>
  <button class="btn-secondary" onclick="clearAll()">limpiar</button>
</div>

<div class="results" id="results">
  <div class="stats" id="stats"></div>
  <div class="result-columns">
    <div class="result-panel panel-gone">
      <div class="panel-header">
        <span>ya no están</span>
        <span class="count" id="goneCount">0</span>
        <button class="copy-btn" onclick="copyList('gone')">copiar</button>
      </div>
      <div class="user-list" id="goneList"></div>
    </div>
    <div class="result-panel panel-new">
      <div class="panel-header">
        <span>nuevos</span>
        <span class="count" id="newCount">0</span>
        <button class="copy-btn" onclick="copyList('new')">copiar</button>
      </div>
      <div class="user-list" id="newUserList"></div>
    </div>
  </div>
</div>

<p class="hint">un username por línea · se ignoran @, espacios y líneas vacías</p>

<script>
function parseList(raw) {
  return [...new Set(
    raw.split(/[\n,]+/)
      .map(u => u.trim().replace(/^@/, '').toLowerCase())
      .filter(Boolean)
  )];
}

function compare() {
  const oldUsers = parseList(document.getElementById('oldList').value);
  const newUsers = parseList(document.getElementById('newList').value);
  if (!oldUsers.length && !newUsers.length) return;

  const oldSet = new Set(oldUsers);
  const newSet = new Set(newUsers);

  const gone = oldUsers.filter(u => !newSet.has(u)).sort();
  const added = newUsers.filter(u => !oldSet.has(u)).sort();
  const stayed = oldUsers.filter(u => newSet.has(u));

  document.getElementById('stats').innerHTML = `
    <div class="stat gone"><div class="num">${gone.length}</div><div class="lbl">se fueron</div></div>
    <div class="stat new"><div class="num">${added.length}</div><div class="lbl">nuevos</div></div>
    <div class="stat stay"><div class="num">${stayed.length}</div><div class="lbl">permanecen</div></div>
    <div class="stat"><div class="num">${oldUsers.length} → ${newUsers.length}</div><div class="lbl">total</div></div>
  `;

  const goneEl = document.getElementById('goneList');
  goneEl.innerHTML = gone.length
    ? gone.map(u => `<div class="user-item">${u}</div>`).join('')
    : '<div class="empty-msg">nadie se fue</div>';
  document.getElementById('goneCount').textContent = gone.length;

  const newEl = document.getElementById('newUserList');
  newEl.innerHTML = added.length
    ? added.map(u => `<div class="user-item">${u}</div>`).join('')
    : '<div class="empty-msg">no hay nuevos</div>';
  document.getElementById('newCount').textContent = added.length;

  window._gone = gone;
  window._added = added;

  document.getElementById('results').classList.add('visible');
}

function clearAll() {
  document.getElementById('oldList').value = '';
  document.getElementById('newList').value = '';
  document.getElementById('results').classList.remove('visible');
}

function copyList(type) {
  const list = type === 'gone' ? window._gone : window._added;
  if (!list || !list.length) return;
  navigator.clipboard.writeText(list.join('\n')).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = orig, 1200);
  });
}
</script>

</body>
</html>
