<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador de Precisión</title>
    <style>
        :root {
            --color-100: #e8f5e9; --color-75: #f1f8e9; --color-50: #fff9c4; 
            --color-25: #ffe0b2; --color-0: #ffcdd2; --text-color: #2c3e50;
        }

        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; height: 100vh; width: 100vw;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--color-100); color: var(--text-color);
            transition: background-color 1.5s ease; overflow: hidden;
        }

        /* Barra de progreso superior */
        #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 8px; background: rgba(0, 0, 0, 0.05); }
        #progress-bar { height: 100%; width: 100%; background: var(--text-color); transition: width 1s linear; transform-origin: left; }

        .main-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #timer-title {
            font-size: 1rem; font-weight: 500; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 0; outline: none;
            padding: 5px; opacity: 0.8;
        }

        #timer-display {
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 800; line-height: 1.1;
            margin: 10px 0 30px 0;
            font-variant-numeric: tabular-nums;
        }

        /* Controles ajustados de tamaño sin usar scale para evitar errores de centrado */
        .group { margin-bottom: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

        button {
            padding: 6px 12px; font-size: 0.75rem; /* Reducción directa del tamaño */
            text-transform: uppercase; border: 1.5px solid var(--text-color);
            background: rgba(255, 255, 255, 0.2); color: var(--text-color);
            cursor: pointer; border-radius: 4px; font-weight: 700;
            transition: all 0.2s ease;
        }

        button:hover { background: var(--text-color); color: white; }
        
        .playback-controls button {
            background: var(--text-color); color: white; border: none;
            padding: 8px 20px; font-size: 0.8rem;
        }

        /* Animación Final */
        @keyframes pulse-red {
            0% { background-color: var(--color-0); }
            50% { background-color: #ff8a80; }
            100% { background-color: var(--color-0); }
        }
        .finished { animation: pulse-red 1s infinite; }

        .pct-75 { background-color: var(--color-75); }
        .pct-50 { background-color: var(--color-50); }
        .pct-25 { background-color: var(--color-25); }
        .pct-0  { background-color: var(--color-0); }

        /* Unit selector */
        .unit-selector {
            position: fixed; bottom: 16px; right: 16px;
            display: flex; gap: 4px; opacity: 0.4;
            transition: opacity 0.3s;
        }
        .unit-selector:hover { opacity: 1; }
        .unit-selector label {
            font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; padding: 4px 8px;
            border-radius: 3px; border: 1.5px solid var(--text-color);
            user-select: none; transition: all 0.2s;
            color: var(--text-color); background: transparent;
        }
        .unit-selector label.active {
            background: var(--text-color); color: white;
        }
        .unit-selector input { display: none; }
    </style>
</head>
<body>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <div class="main-container">
        <div id="timer-title" contenteditable="true">MI SESIÓN</div>
        <div id="timer-display">00:00</div>

        <div class="group">
            <button onclick="setTime(600)">10 Min</button>
            <button onclick="setTime(1800)">30 Min</button>
            <button onclick="setTime(3600)">1 Hora</button>
            <button onclick="setCustomTime()" style="border-style: dashed;">Personalizado</button>
            <button onclick="setEndTimeMode()" style="border-style: double;">Hora Fin</button>
        </div>

        <div class="group playback-controls">
            <button id="btn-start" onclick="toggleTimer()">Iniciar</button>
            <button onclick="resetTimer()">Finalizar</button>
        </div>
    </div>

    <div class="unit-selector">
        <label class="active" onclick="toggleUnit(this,'h')"><input type="checkbox" checked>h</label>
        <label class="active" onclick="toggleUnit(this,'m')"><input type="checkbox" checked>m</label>
        <label class="active" onclick="toggleUnit(this,'s')"><input type="checkbox" checked>s</label>
        <label onclick="toggleUnit(this,'ms')"><input type="checkbox">ms</label>
    </div>

    <script>
        let countdown;
        let timeLeftMs = 0; // now in milliseconds
        let totalTimeAtStart = 0; // in ms
        let isPaused = true;
        let targetTime = null;
        let lastTick = null;

        const showUnits = { h: true, m: true, s: true, ms: false };

        const display = document.querySelector('#timer-display');
        const progressBar = document.querySelector('#progress-bar');
        const btnStart = document.querySelector('#btn-start');
        const body = document.body;

        function toggleUnit(label, unit) {
            const cb = label.querySelector('input');
            cb.checked = !cb.checked;
            showUnits[unit] = cb.checked;
            label.classList.toggle('active', cb.checked);
            updateUI();
            // Switch interval rate based on ms visibility
            if (!isPaused) { runTimer(); }
        }

        function setTime(seconds) {
            resetTimer();
            targetTime = null;
            timeLeftMs = seconds * 1000;
            totalTimeAtStart = timeLeftMs;
            updateUI();
        }

        function setCustomTime() {
            const type = prompt("¿Minutos (m) u Horas (h)?").toLowerCase();
            const value = parseInt(prompt("Cantidad:"));
            if (!isNaN(value) && value > 0) setTime(type === 'h' ? value * 3600 : value * 60);
        }

        function setEndTimeMode() {
            const timeStr = prompt("¿Hora de fin? (ej: 15:45)");
            if (!timeStr || !timeStr.includes(':')) return;

            const [h, m] = timeStr.split(':').map(Number);
            targetTime = new Date();
            targetTime.setHours(h, m, 0, 0);
            if (targetTime < new Date()) targetTime.setDate(targetTime.getDate() + 1);

            timeLeftMs = targetTime - new Date();
            totalTimeAtStart = timeLeftMs;
            updateUI();
        }

        function toggleTimer() {
            if (timeLeftMs <= 0 && !targetTime) return;
            isPaused = !isPaused;
            btnStart.textContent = isPaused ? "Continuar" : "Pausar";
            if (!isPaused) {
                lastTick = performance.now();
                runTimer();
            } else {
                cancelAnimationFrame(countdown);
                clearInterval(countdown);
            }
        }

        function runTimer() {
            cancelAnimationFrame(countdown);
            clearInterval(countdown);

            if (showUnits.ms) {
                // Use requestAnimationFrame for smooth ms display
                function tick() {
                    const now = performance.now();
                    if (targetTime) {
                        timeLeftMs = targetTime - new Date();
                    } else {
                        timeLeftMs -= (now - lastTick);
                    }
                    lastTick = now;

                    if (timeLeftMs <= 0) {
                        timeLeftMs = 0;
                        isPaused = true;
                        btnStart.textContent = "Iniciar";
                        body.classList.add('finished');
                        updateUI();
                        return;
                    }
                    updateUI();
                    countdown = requestAnimationFrame(tick);
                }
                lastTick = performance.now();
                countdown = requestAnimationFrame(tick);
            } else {
                // 1-second interval when ms not shown
                countdown = setInterval(() => {
                    if (targetTime) {
                        timeLeftMs = targetTime - new Date();
                    } else {
                        timeLeftMs -= 1000;
                    }

                    if (timeLeftMs <= 0) {
                        timeLeftMs = 0;
                        clearInterval(countdown);
                        isPaused = true;
                        btnStart.textContent = "Iniciar";
                        body.classList.add('finished');
                    }
                    updateUI();
                }, 1000);
            }
        }

        function resetTimer() {
            cancelAnimationFrame(countdown);
            clearInterval(countdown);
            timeLeftMs = 0;
            totalTimeAtStart = 0;
            targetTime = null;
            isPaused = true;
            btnStart.textContent = "Iniciar";
            body.className = '';
            updateUI();
        }

        function updateUI() {
            const totalSec = Math.max(0, timeLeftMs) / 1000;
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = Math.floor(totalSec % 60);
            const ms = Math.floor((totalSec % 1) * 100); // centiseconds

            const parts = [];
            if (showUnits.h) parts.push(parts.length ? String(h).padStart(2, '0') : String(h));
            if (showUnits.m) parts.push(parts.length ? String(m).padStart(2, '0') : String(m).padStart(2, '0'));
            if (showUnits.s) parts.push(String(s).padStart(2, '0'));

            let text = parts.join(':') || '00';
            if (showUnits.ms) text += '.' + String(ms).padStart(2, '0');

            display.textContent = text;

            const pct = totalTimeAtStart > 0 ? (Math.max(0, timeLeftMs) / totalTimeAtStart) * 100 : 0;
            progressBar.style.width = `${pct}%`;

            if (!body.classList.contains('finished')) {
                body.className = '';
                if (timeLeftMs <= 0 && totalTimeAtStart > 0) body.classList.add('pct-0');
                else if (pct <= 25) body.classList.add('pct-25');
                else if (pct <= 50) body.classList.add('pct-50');
                else if (pct <= 75) body.classList.add('pct-75');
            }
        }
    </script>
</body>
</html>
