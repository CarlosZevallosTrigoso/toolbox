<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imageforge</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/utif/3.1.0/UTIF.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    background: #0a0a0b;
    color: #888;
    min-height: 100vh;
    padding: 3rem 2.5rem;
    font-size: 0.85rem;
    line-height: 1.8;
  }

  h1 {
    font-size: 0.85rem;
    font-weight: normal;
    color: #444;
    margin-bottom: 1.5rem;
  }

  .back-link {
    display: inline-block;
    color: #333;
    text-decoration: none;
    margin-bottom: 1rem;
    font-size: 0.85rem;
  }
  .back-link:hover { color: #555; }

  /* Drop zone */
  .dropzone {
    border: 1px dashed #333;
    padding: 2rem 1.5rem;
    cursor: pointer;
    transition: border-color 0.2s;
    margin-bottom: 1.5rem;
  }
  .dropzone:hover, .dropzone.dragover { border-color: #ccc; }
  .dropzone-label { color: #555; }
  .dropzone-label strong { color: #ccc; font-weight: normal; }
  #fileInput { display: none; }

  /* Image list */
  .image-list {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .image-card {
    border-bottom: 1px solid #1a1a1d;
    padding-bottom: 1.5rem;
  }

  .image-card-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 0.75rem;
  }

  .thumb-container {
    width: 48px;
    height: 48px;
    overflow: hidden;
    flex-shrink: 0;
    background: #141416;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-in;
  }
  .thumb-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .image-meta { flex: 1; min-width: 0; }
  .image-meta h3 {
    font-size: 0.85rem;
    font-weight: normal;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta-tags { color: #444; font-size: 0.85rem; }

  .btn-remove {
    background: none;
    border: none;
    color: #333;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
  }
  .btn-remove:hover { color: #ff6b6b; }

  /* Controls */
  .image-card-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: flex-end;
    margin-bottom: 0.5rem;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .control-group label {
    font-size: 0.85rem;
    color: #444;
  }

  select, input[type="number"] {
    background: none;
    border: none;
    border-bottom: 1px solid #333;
    color: #ccc;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.3rem 0;
    outline: none;
    transition: border-color 0.2s;
    width: 120px;
  }
  select:focus, input[type="number"]:focus { border-color: #ccc; }
  select option { background: #0a0a0b; color: #ccc; }

  .quality-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .quality-value { color: #ccc; }

  input[type="range"] {
    -webkit-appearance: none;
    width: 120px;
    height: 2px;
    background: #333;
    outline: none;
    cursor: pointer;
    margin-top: 0.4rem;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ccc;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ccc;
    cursor: pointer;
    border: none;
  }

  /* Resize row */
  .resize-row {
    display: flex;
    align-items: flex-end;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 0.5rem;
  }
  .resize-row input[type="number"] { width: 90px; }

  .resize-link {
    background: none;
    border: none;
    color: #333;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
    padding: 0.3rem 0;
  }
  .resize-link.linked { color: #888; }

  .resize-pct { width: 80px; }

  .btn-export {
    background: none;
    border: 1px solid #333;
    color: #888;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.4rem 1rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-export:hover { border-color: #ccc; color: #ccc; }

  /* Batch bar */
  .batch-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 0;
    border-top: 1px solid #1a1a1d;
    margin-top: 1rem;
  }
  .batch-info { color: #444; }
  .batch-actions { display: flex; gap: 1.5rem; }

  .btn-batch {
    background: none;
    border: none;
    color: #555;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .btn-batch:hover { color: #ccc; }
  .btn-batch.danger:hover { color: #ff6b6b; }

  /* Preview overlay */
  .preview-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: pointer;
    padding: 2rem;
  }
  .preview-overlay img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
  }
  .preview-info {
    position: fixed;
    bottom: 2rem;
    color: #555;
    font-size: 0.85rem;
  }

  /* Toast */
  .status-toast {
    position: fixed;
    bottom: 2rem;
    right: 2.5rem;
    color: #ccc;
    font-size: 0.85rem;
    animation: fadeOut 0.3s ease 2.5s forwards;
  }
  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }
</style>
</head>
<body>

<a href="../index.html" class="back-link">← toolbox/</a>
<h1>imageforge — conversor y compresor</h1>

<div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
  <div class="dropzone-label">arrastra imágenes aquí o <strong>haz clic</strong> — .tiff .jpg .png .webp</div>
  <input type="file" id="fileInput" multiple accept=".tiff,.tif,.jpg,.jpeg,.png,.webp,image/tiff,image/jpeg,image/png,image/webp">
</div>

<div id="imageList" class="image-list"></div>
<div id="batchBar" style="display:none"></div>

<div id="previewOverlay" class="preview-overlay" style="display:none" onclick="this.style.display='none'"></div>

<script>
const images = [];
let idCounter = 0;

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const imageList = document.getElementById('imageList');
const batchBar = document.getElementById('batchBar');

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
  fileInput.value = '';
});

function handleFiles(files) {
  for (const file of files) {
    if (!file.type.match(/image\/(tiff|jpeg|png|webp)/) && !file.name.match(/\.(tiff|tif|jpg|jpeg|png|webp)$/i)) continue;
    const id = ++idCounter;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const arrayBuf = ev.target.result;
      processImage(file, arrayBuf, id);
    };
    reader.readAsArrayBuffer(file);
  }
}

function processImage(file, arrayBuf, id) {
  const isTiff = file.name.match(/\.(tiff|tif)$/i) || file.type === 'image/tiff';
  if (isTiff) {
    try {
      const ifds = UTIF.decode(arrayBuf);
      UTIF.decodeImage(arrayBuf, ifds[0]);
      const rgba = UTIF.toRGBA8(ifds[0]);
      const w = ifds[0].width;
      const h = ifds[0].height;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(w, h);
      imgData.data.set(new Uint8Array(rgba));
      ctx.putImageData(imgData, 0, 0);
      addImage(id, file, canvas.toDataURL('image/png'), w, h);
    } catch (err) {
      showToast('error al leer tiff: ' + err.message);
    }
  } else {
    const blob = new Blob([arrayBuf], { type: file.type });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      addImage(id, file, canvas.toDataURL('image/png'), img.naturalWidth, img.naturalHeight);
    };
    img.onerror = () => showToast('error al leer: ' + file.name);
    img.src = url;
  }
}

function addImage(id, file, dataUrl, origW, origH) {
  images.push({
    id, file, dataUrl, origW, origH,
    format: 'jpeg', quality: 80,
    newW: origW, newH: origH,
    linked: true, pct: 100
  });
  renderList();
}

function removeImage(id) {
  const idx = images.findIndex(i => i.id === id);
  if (idx > -1) images.splice(idx, 1);
  renderList();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function getExtFromFormat(fmt) {
  return { jpeg: 'jpg', png: 'png', webp: 'webp' }[fmt] || fmt;
}

function getMime(fmt) { return 'image/' + fmt; }

function renderList() {
  imageList.innerHTML = '';
  images.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'image-card';
    card.innerHTML = `
      <div class="image-card-header">
        <div class="thumb-container" onclick="previewImage(${entry.id})">
          <img src="${entry.dataUrl}" alt="">
        </div>
        <div class="image-meta">
          <h3>${entry.file.name}</h3>
          <div class="meta-tags">${entry.origW}×${entry.origH} — ${formatSize(entry.file.size)} — ${entry.file.name.split('.').pop().toUpperCase()}</div>
        </div>
        <button class="btn-remove" onclick="removeImage(${entry.id})">[x]</button>
      </div>
      <div class="image-card-controls">
        <div class="control-group">
          <label>formato</label>
          <select onchange="updateEntry(${entry.id},'format',this.value)">
            <option value="jpeg" ${entry.format==='jpeg'?'selected':''}>JPEG</option>
            <option value="png" ${entry.format==='png'?'selected':''}>PNG</option>
            <option value="webp" ${entry.format==='webp'?'selected':''}>WebP</option>
          </select>
        </div>
        <div class="control-group">
          <div class="quality-header">
            <label>calidad</label>
            <span class="quality-value" id="qval-${entry.id}">${entry.quality}%</span>
          </div>
          <input type="range" min="5" max="100" step="1" value="${entry.quality}"
            oninput="updateQuality(${entry.id}, this.value)"
            id="qslider-${entry.id}"
            ${entry.format === 'png' ? 'disabled style="opacity:0.2"' : ''}>
        </div>
        <div class="control-group" style="justify-content:end">
          <button class="btn-export" onclick="exportImage(${entry.id})">exportar</button>
        </div>
      </div>
      <div class="resize-row">
        <div class="control-group">
          <label>ancho</label>
          <input type="number" value="${entry.newW}" min="1" max="20000"
            onchange="updateWidth(${entry.id}, this.value)" id="w-${entry.id}">
        </div>
        <button class="resize-link ${entry.linked ? 'linked' : ''}" onclick="toggleLink(${entry.id})" id="link-${entry.id}">
          ${entry.linked ? '[=]' : '[≠]'}
        </button>
        <div class="control-group">
          <label>alto</label>
          <input type="number" value="${entry.newH}" min="1" max="20000"
            onchange="updateHeight(${entry.id}, this.value)" id="h-${entry.id}">
        </div>
        <div class="control-group resize-pct">
          <label>%</label>
          <input type="number" value="${entry.pct}" min="1" max="1000"
            onchange="updatePct(${entry.id}, this.value)" id="pct-${entry.id}">
        </div>
      </div>
    `;
    imageList.appendChild(card);
  });

  if (images.length > 1) {
    batchBar.style.display = 'flex';
    batchBar.className = 'batch-bar';
    batchBar.innerHTML = `
      <span class="batch-info">${images.length} imágenes</span>
      <div class="batch-actions">
        <button class="btn-batch danger" onclick="clearAll()">[limpiar]</button>
        <button class="btn-batch" onclick="exportAll()">[exportar todo]</button>
      </div>
    `;
  } else {
    batchBar.style.display = 'none';
  }
}

function getEntry(id) { return images.find(i => i.id === id); }

function updateEntry(id, key, val) {
  const e = getEntry(id);
  if (!e) return;
  e[key] = val;
  if (key === 'format') {
    const slider = document.getElementById('qslider-' + id);
    slider.disabled = val === 'png';
    slider.style.opacity = val === 'png' ? '0.2' : '1';
  }
}

function updateQuality(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.quality = parseInt(val);
  document.getElementById('qval-' + id).textContent = val + '%';
}

function updateWidth(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.newW = parseInt(val);
  if (e.linked) {
    e.newH = Math.round(e.origH * (e.newW / e.origW));
    document.getElementById('h-' + id).value = e.newH;
  }
  e.pct = Math.round((e.newW / e.origW) * 100);
  document.getElementById('pct-' + id).value = e.pct;
}

function updateHeight(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.newH = parseInt(val);
  if (e.linked) {
    e.newW = Math.round(e.origW * (e.newH / e.origH));
    document.getElementById('w-' + id).value = e.newW;
  }
  e.pct = Math.round((e.newH / e.origH) * 100);
  document.getElementById('pct-' + id).value = e.pct;
}

function updatePct(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.pct = parseInt(val);
  e.newW = Math.round(e.origW * e.pct / 100);
  e.newH = Math.round(e.origH * e.pct / 100);
  document.getElementById('w-' + id).value = e.newW;
  document.getElementById('h-' + id).value = e.newH;
}

function toggleLink(id) {
  const e = getEntry(id);
  if (!e) return;
  e.linked = !e.linked;
  const btn = document.getElementById('link-' + id);
  btn.className = 'resize-link ' + (e.linked ? 'linked' : '');
  btn.innerHTML = e.linked ? '[=]' : '[≠]';
}

function exportImage(id) {
  const e = getEntry(id);
  if (!e) return;
  const canvas = document.createElement('canvas');
  canvas.width = e.newW;
  canvas.height = e.newH;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, e.newW, e.newH);
    const quality = e.quality / 100;
    const mime = getMime(e.format);
    const dataUrl = e.format === 'png' ? canvas.toDataURL(mime) : canvas.toDataURL(mime, quality);
    const baseName = e.file.name.replace(/\.[^.]+$/, '');
    const ext = getExtFromFormat(e.format);
    downloadDataUrl(dataUrl, `${baseName}.${ext}`);
    showToast(`exportado: ${baseName}.${ext}`);
  };
  img.src = e.dataUrl;
}

function exportAll() {
  images.forEach((e, i) => setTimeout(() => exportImage(e.id), i * 300));
}

function clearAll() {
  images.length = 0;
  renderList();
}

function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function previewImage(id) {
  const e = getEntry(id);
  if (!e) return;
  const overlay = document.getElementById('previewOverlay');
  overlay.innerHTML = `
    <img src="${e.dataUrl}" alt="">
    <div class="preview-info">${e.file.name} — ${e.origW}×${e.origH} — ${formatSize(e.file.size)} — clic para cerrar</div>
  `;
  overlay.style.display = 'flex';
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'status-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
