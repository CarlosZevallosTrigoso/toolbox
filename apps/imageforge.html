<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imageforge</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/utif/3.1.0/UTIF.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0b;
    color: #999;
    min-height: 100vh;
    padding: 3rem 2.5rem;
    font-size: 0.88rem;
    line-height: 1.7;
  }

  code, .mono {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  .back-link {
    display: inline-block;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #444;
    text-decoration: none;
    margin-bottom: 1.2rem;
    font-size: 0.82rem;
  }
  .back-link:hover { color: #888; }

  h1 {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.88rem;
    font-weight: normal;
    color: #555;
    margin-bottom: 2rem;
  }

  /* Drop zone */
  .dropzone {
    border: 1px dashed #2a2a2e;
    background: #111113;
    padding: 2.5rem 2rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 2rem;
    border-radius: 4px;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #5a7a3a;
    background: rgba(90, 140, 60, 0.04);
  }
  .dropzone-label { color: #666; }
  .dropzone-label strong { color: #aaa; font-weight: 500; }
  #fileInput { display: none; }

  /* Image list */
  .image-list {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .image-card {
    background: #111113;
    border: 1px solid #1e1e22;
    border-radius: 4px;
    padding: 1.25rem 1.5rem;
    transition: border-color 0.15s;
  }
  .image-card:hover { border-color: #2a2a2e; }

  .image-card-header {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    margin-bottom: 1.2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #1a1a1e;
  }

  .thumb-container {
    width: 56px;
    height: 56px;
    overflow: hidden;
    flex-shrink: 0;
    background: #18181c;
    border: 1px solid #222225;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-in;
  }
  .thumb-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .image-meta { flex: 1; min-width: 0; }
  .image-meta h3 {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.85rem;
    font-weight: normal;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 0.25rem;
  }
  .meta-tags {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #555;
    font-size: 0.8rem;
  }
  .meta-tags .accent { color: #5a7a3a; }

  .btn-remove {
    background: none;
    border: 1px solid transparent;
    color: #444;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.88rem;
    padding: 0.25rem 0.5rem;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .btn-remove:hover { color: #c45; border-color: #c45; }

  /* Controls */
  .image-card-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: flex-end;
    margin-bottom: 1rem;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .control-group label {
    font-size: 0.78rem;
    color: #555;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  select, input[type="number"] {
    background: #0e0e10;
    border: 1px solid #222225;
    border-radius: 4px;
    color: #ccc;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.84rem;
    padding: 0.5rem 0.7rem;
    outline: none;
    transition: border-color 0.2s;
    width: 130px;
  }
  select:focus, input[type="number"]:focus { border-color: #5a7a3a; }
  select option { background: #111113; color: #ccc; }

  .quality-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .quality-value {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #5a7a3a;
    font-size: 0.82rem;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 130px;
    height: 3px;
    background: #222225;
    outline: none;
    cursor: pointer;
    border-radius: 2px;
    margin-top: 0.3rem;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #5a7a3a;
    cursor: pointer;
    border: 2px solid #0a0a0b;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #5a7a3a;
    cursor: pointer;
    border: 2px solid #0a0a0b;
  }

  /* Resize row */
  .resize-row {
    display: flex;
    align-items: flex-end;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .resize-row input[type="number"] { width: 100px; }

  .resize-link {
    background: none;
    border: 1px solid #222225;
    color: #444;
    cursor: pointer;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.8rem;
    padding: 0.45rem 0.6rem;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .resize-link.linked { color: #5a7a3a; border-color: #3a4a2a; background: rgba(90, 140, 60, 0.06); }

  .resize-pct { width: 80px; }

  .btn-export {
    background: #5a7a3a;
    border: none;
    color: #e8e8ec;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 0.55rem 1.4rem;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 4px;
  }
  .btn-export:hover { background: #6a8e46; }

  /* Batch bar */
  .batch-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    background: #111113;
    border: 1px solid #1e1e22;
    border-radius: 4px;
    margin-top: 1.25rem;
  }
  .batch-info {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #555;
    font-size: 0.82rem;
  }
  .batch-actions { display: flex; gap: 0.75rem; }

  .btn-batch {
    background: none;
    border: 1px solid #222225;
    color: #777;
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.45rem 1rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .btn-batch:hover { border-color: #5a7a3a; color: #5a7a3a; }
  .btn-batch.danger:hover { border-color: #c45; color: #c45; }
  .btn-batch.primary {
    background: #5a7a3a;
    border-color: #5a7a3a;
    color: #e8e8ec;
    font-weight: 500;
  }
  .btn-batch.primary:hover { background: #6a8e46; }

  /* Preview overlay */
  .preview-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: pointer;
    padding: 2rem;
  }
  .preview-overlay img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 4px;
  }
  .preview-info {
    position: fixed;
    bottom: 2rem;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #555;
    font-size: 0.82rem;
    background: #111113;
    border: 1px solid #222225;
    padding: 0.5rem 1rem;
    border-radius: 4px;
  }

  /* Toast */
  .status-toast {
    position: fixed;
    bottom: 2rem;
    right: 2.5rem;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    color: #5a7a3a;
    font-size: 0.82rem;
    background: #111113;
    border: 1px solid #3a4a2a;
    padding: 0.6rem 1rem;
    border-radius: 4px;
    animation: fadeOut 0.3s ease 2.5s forwards;
  }
  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  @media (max-width: 600px) {
    body { padding: 2rem 1.25rem; }
    .image-card-controls { gap: 1rem; }
    .resize-row { gap: 0.75rem; }
  }
</style>
</head>
<body>

<a href="../index.html" class="back-link">← toolbox/</a>
<h1>imageforge — conversor y compresor</h1>

<div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
  <div class="dropzone-label">arrastra imágenes aquí o <strong>haz clic</strong> — .tiff .jpg .png .webp</div>
  <input type="file" id="fileInput" multiple accept=".tiff,.tif,.jpg,.jpeg,.png,.webp,image/tiff,image/jpeg,image/png,image/webp">
</div>

<div id="imageList" class="image-list"></div>
<div id="batchBar" style="display:none"></div>

<div id="previewOverlay" class="preview-overlay" style="display:none" onclick="this.style.display='none'"></div>

<script>
const images = [];
let idCounter = 0;

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const imageList = document.getElementById('imageList');
const batchBar = document.getElementById('batchBar');

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
  fileInput.value = '';
});

function handleFiles(files) {
  for (const file of files) {
    if (!file.type.match(/image\/(tiff|jpeg|png|webp)/) && !file.name.match(/\.(tiff|tif|jpg|jpeg|png|webp)$/i)) continue;
    const id = ++idCounter;
    const reader = new FileReader();
    reader.onload = (ev) => {
      processImage(file, ev.target.result, id);
    };
    reader.readAsArrayBuffer(file);
  }
}

function processImage(file, arrayBuf, id) {
  const isTiff = file.name.match(/\.(tiff|tif)$/i) || file.type === 'image/tiff';
  if (isTiff) {
    try {
      const ifds = UTIF.decode(arrayBuf);
      UTIF.decodeImage(arrayBuf, ifds[0]);
      const rgba = UTIF.toRGBA8(ifds[0]);
      const w = ifds[0].width, h = ifds[0].height;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(w, h);
      imgData.data.set(new Uint8Array(rgba));
      ctx.putImageData(imgData, 0, 0);
      addImage(id, file, canvas.toDataURL('image/png'), w, h);
    } catch (err) {
      showToast('error al leer tiff: ' + err.message);
    }
  } else {
    const blob = new Blob([arrayBuf], { type: file.type });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      addImage(id, file, canvas.toDataURL('image/png'), img.naturalWidth, img.naturalHeight);
    };
    img.onerror = () => showToast('error al leer: ' + file.name);
    img.src = url;
  }
}

function addImage(id, file, dataUrl, origW, origH) {
  images.push({
    id, file, dataUrl, origW, origH,
    format: 'jpeg', quality: 80,
    newW: origW, newH: origH,
    linked: true, pct: 100
  });
  renderList();
}

function removeImage(id) {
  const idx = images.findIndex(i => i.id === id);
  if (idx > -1) images.splice(idx, 1);
  renderList();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function getExtFromFormat(fmt) {
  return { jpeg: 'jpg', png: 'png', webp: 'webp' }[fmt] || fmt;
}

function getMime(fmt) { return 'image/' + fmt; }

function renderList() {
  imageList.innerHTML = '';
  images.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'image-card';
    card.innerHTML = `
      <div class="image-card-header">
        <div class="thumb-container" onclick="previewImage(${entry.id})">
          <img src="${entry.dataUrl}" alt="">
        </div>
        <div class="image-meta">
          <h3>${entry.file.name}</h3>
          <div class="meta-tags">${entry.origW}×${entry.origH} · ${formatSize(entry.file.size)} · <span class="accent">${entry.file.name.split('.').pop().toUpperCase()}</span></div>
        </div>
        <button class="btn-remove" onclick="removeImage(${entry.id})">✕</button>
      </div>
      <div class="image-card-controls">
        <div class="control-group">
          <label>formato</label>
          <select onchange="updateEntry(${entry.id},'format',this.value)">
            <option value="jpeg" ${entry.format==='jpeg'?'selected':''}>JPEG</option>
            <option value="png" ${entry.format==='png'?'selected':''}>PNG</option>
            <option value="webp" ${entry.format==='webp'?'selected':''}>WebP</option>
          </select>
        </div>
        <div class="control-group">
          <div class="quality-header">
            <label>calidad</label>
            <span class="quality-value" id="qval-${entry.id}">${entry.quality}%</span>
          </div>
          <input type="range" min="5" max="100" step="1" value="${entry.quality}"
            oninput="updateQuality(${entry.id}, this.value)"
            id="qslider-${entry.id}"
            ${entry.format === 'png' ? 'disabled style="opacity:0.2"' : ''}>
        </div>
        <div class="control-group" style="justify-content:end">
          <button class="btn-export" onclick="exportImage(${entry.id})">exportar</button>
        </div>
      </div>
      <div class="resize-row">
        <div class="control-group">
          <label>ancho</label>
          <input type="number" value="${entry.newW}" min="1" max="20000"
            onchange="updateWidth(${entry.id}, this.value)" id="w-${entry.id}">
        </div>
        <button class="resize-link ${entry.linked ? 'linked' : ''}" onclick="toggleLink(${entry.id})" id="link-${entry.id}">
          ${entry.linked ? '⛓' : '⛓‍💥'}
        </button>
        <div class="control-group">
          <label>alto</label>
          <input type="number" value="${entry.newH}" min="1" max="20000"
            onchange="updateHeight(${entry.id}, this.value)" id="h-${entry.id}">
        </div>
        <div class="control-group resize-pct">
          <label>%</label>
          <input type="number" value="${entry.pct}" min="1" max="1000"
            onchange="updatePct(${entry.id}, this.value)" id="pct-${entry.id}">
        </div>
      </div>
    `;
    imageList.appendChild(card);
  });

  if (images.length > 1) {
    batchBar.style.display = 'flex';
    batchBar.className = 'batch-bar';
    batchBar.innerHTML = `
      <span class="batch-info">${images.length} imágenes</span>
      <div class="batch-actions">
        <button class="btn-batch danger" onclick="clearAll()">limpiar</button>
        <button class="btn-batch primary" onclick="exportAll()">exportar todo</button>
      </div>
    `;
  } else {
    batchBar.style.display = 'none';
  }
}

function getEntry(id) { return images.find(i => i.id === id); }

function updateEntry(id, key, val) {
  const e = getEntry(id);
  if (!e) return;
  e[key] = val;
  if (key === 'format') {
    const slider = document.getElementById('qslider-' + id);
    slider.disabled = val === 'png';
    slider.style.opacity = val === 'png' ? '0.2' : '1';
  }
}

function updateQuality(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.quality = parseInt(val);
  document.getElementById('qval-' + id).textContent = val + '%';
}

function updateWidth(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.newW = parseInt(val);
  if (e.linked) {
    e.newH = Math.round(e.origH * (e.newW / e.origW));
    document.getElementById('h-' + id).value = e.newH;
  }
  e.pct = Math.round((e.newW / e.origW) * 100);
  document.getElementById('pct-' + id).value = e.pct;
}

function updateHeight(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.newH = parseInt(val);
  if (e.linked) {
    e.newW = Math.round(e.origW * (e.newH / e.origH));
    document.getElementById('w-' + id).value = e.newW;
  }
  e.pct = Math.round((e.newH / e.origH) * 100);
  document.getElementById('pct-' + id).value = e.pct;
}

function updatePct(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.pct = parseInt(val);
  e.newW = Math.round(e.origW * e.pct / 100);
  e.newH = Math.round(e.origH * e.pct / 100);
  document.getElementById('w-' + id).value = e.newW;
  document.getElementById('h-' + id).value = e.newH;
}

function toggleLink(id) {
  const e = getEntry(id);
  if (!e) return;
  e.linked = !e.linked;
  const btn = document.getElementById('link-' + id);
  btn.className = 'resize-link ' + (e.linked ? 'linked' : '');
  btn.innerHTML = e.linked ? '⛓' : '⛓‍💥';
}

function exportImage(id) {
  const e = getEntry(id);
  if (!e) return;
  const canvas = document.createElement('canvas');
  canvas.width = e.newW;
  canvas.height = e.newH;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, e.newW, e.newH);
    const quality = e.quality / 100;
    const mime = getMime(e.format);
    const dataUrl = e.format === 'png' ? canvas.toDataURL(mime) : canvas.toDataURL(mime, quality);
    const baseName = e.file.name.replace(/\.[^.]+$/, '');
    const ext = getExtFromFormat(e.format);
    downloadDataUrl(dataUrl, `${baseName}.${ext}`);
    showToast(`exportado: ${baseName}.${ext}`);
  };
  img.src = e.dataUrl;
}

function exportAll() {
  images.forEach((e, i) => setTimeout(() => exportImage(e.id), i * 300));
}

function clearAll() {
  images.length = 0;
  renderList();
}

function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function previewImage(id) {
  const e = getEntry(id);
  if (!e) return;
  const overlay = document.getElementById('previewOverlay');
  overlay.innerHTML = `
    <img src="${e.dataUrl}" alt="">
    <div class="preview-info">${e.file.name} · ${e.origW}×${e.origH} · ${formatSize(e.file.size)} — clic para cerrar</div>
  `;
  overlay.style.display = 'flex';
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'status-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}
</script>
</body>
</html>
