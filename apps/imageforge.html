<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imageforge</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/utif/3.1.0/UTIF.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    background: #ffffff;
    color: #666;
    min-height: 100vh;
    padding: 3rem 2.5rem;
    font-size: 0.88rem;
    line-height: 1.7;
  }

  .back-link {
    display: inline-block;
    font-family: inherit;
    color: #999;
    text-decoration: none;
    margin-bottom: 1.2rem;
    font-size: 0.82rem;
  }
  .back-link:hover { color: #5a7a3a; }

  h1 {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: normal;
    color: #888;
    margin-bottom: 2rem;
  }

  /* Drop zone */
  .dropzone {
    border: 1px dashed #ddd;
    background: #fafafa;
    padding: 2.5rem 2rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 2rem;
    border-radius: 4px;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #5a7a3a;
    background: rgba(90, 140, 60, 0.03);
  }
  .dropzone-label { color: #999; }
  .dropzone-label strong { color: #666; font-weight: 500; }
  #fileInput { display: none; }

  /* Format badges in dropzone */
  .format-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.75rem;
  }
  .format-badge {
    font-size: 0.72rem;
    color: #aaa;
    border: 1px solid #e0e0e0;
    padding: 0.1rem 0.45rem;
    border-radius: 3px;
    letter-spacing: 0.02em;
  }
  .format-badge.unsupported {
    opacity: 0.35;
    text-decoration: line-through;
  }

  /* Image list */
  .image-list {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .image-card {
    background: #fafafa;
    border: 1px solid #eee;
    border-radius: 4px;
    padding: 1.25rem 1.5rem;
    transition: border-color 0.15s;
  }
  .image-card:hover { border-color: #ccc; }

  .image-card-header {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    margin-bottom: 1.2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #eee;
  }

  .thumb-container {
    width: 56px;
    height: 56px;
    overflow: hidden;
    flex-shrink: 0;
    background: #f0f0f0;
    border: 1px solid #e0e0e0;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-in;
  }
  .thumb-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .image-meta { flex: 1; min-width: 0; }
  .image-meta h3 {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: normal;
    color: #444;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 0.25rem;
  }
  .meta-tags {
    font-family: inherit;
    color: #aaa;
    font-size: 0.8rem;
  }
  .meta-tags .accent { color: #5a7a3a; }

  .btn-remove {
    background: none;
    border: 1px solid transparent;
    color: #bbb;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.88rem;
    padding: 0.25rem 0.5rem;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .btn-remove:hover { color: #c45; border-color: #c45; }

  /* Controls */
  .image-card-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: flex-end;
    margin-bottom: 1rem;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .control-group label {
    font-size: 0.78rem;
    color: #aaa;
    font-weight: 500;
    text-transform: lowercase;
    letter-spacing: 0.04em;
  }

  select, input[type="number"] {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    color: #444;
    font-family: inherit;
    font-size: 0.84rem;
    padding: 0.5rem 0.7rem;
    outline: none;
    transition: border-color 0.2s;
    width: 130px;
  }
  select:focus, input[type="number"]:focus { border-color: #5a7a3a; }
  select option { background: #fff; color: #444; }

  .quality-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .quality-value {
    font-family: inherit;
    color: #5a7a3a;
    font-size: 0.82rem;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 130px;
    height: 3px;
    background: #ddd;
    outline: none;
    cursor: pointer;
    border-radius: 2px;
    margin-top: 0.3rem;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #5a7a3a;
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #ddd;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #5a7a3a;
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #ddd;
  }

  /* Resize row */
  .resize-row {
    display: flex;
    align-items: flex-end;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .resize-row input[type="number"] { width: 100px; }

  .resize-link {
    background: none;
    border: 1px solid #ddd;
    color: #bbb;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    padding: 0.45rem 0.6rem;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .resize-link.linked { color: #5a7a3a; border-color: #5a7a3a; background: rgba(90, 140, 60, 0.05); }

  .resize-pct { width: 80px; }

  .btn-export {
    background: #5a7a3a;
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 0.55rem 1.4rem;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 4px;
  }
  .btn-export:hover { background: #6a8e46; }

  /* Batch bar */
  .batch-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    background: #fafafa;
    border: 1px solid #eee;
    border-radius: 4px;
    margin-top: 1.25rem;
  }
  .batch-info {
    font-family: inherit;
    color: #aaa;
    font-size: 0.82rem;
  }
  .batch-actions { display: flex; gap: 0.75rem; }

  .btn-batch {
    background: none;
    border: 1px solid #ddd;
    color: #888;
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.45rem 1rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .btn-batch:hover { border-color: #5a7a3a; color: #5a7a3a; }
  .btn-batch.danger:hover { border-color: #c45; color: #c45; }
  .btn-batch.primary {
    background: #5a7a3a;
    border-color: #5a7a3a;
    color: #fff;
    font-weight: 500;
  }
  .btn-batch.primary:hover { background: #6a8e46; }

  /* Preview overlay */
  .preview-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: pointer;
    padding: 2rem;
  }
  .preview-overlay img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .preview-info {
    position: fixed;
    bottom: 2rem;
    font-family: inherit;
    color: #aaa;
    font-size: 0.82rem;
    background: #fff;
    border: 1px solid #eee;
    padding: 0.5rem 1rem;
    border-radius: 4px;
  }

  /* Toast */
  .status-toast {
    position: fixed;
    bottom: 2rem;
    right: 2.5rem;
    font-family: inherit;
    color: #5a7a3a;
    font-size: 0.82rem;
    background: #fff;
    border: 1px solid #5a7a3a;
    padding: 0.6rem 1rem;
    border-radius: 4px;
    animation: fadeOut 0.3s ease 2.5s forwards;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  /* Warning toast */
  .status-toast.warn {
    color: #b08000;
    border-color: #d4a017;
  }

  @media (max-width: 600px) {
    body { padding: 2rem 1.25rem; }
    .image-card-controls { gap: 1rem; }
    .resize-row { gap: 0.75rem; }
  }
</style>
</head>
<body>

<a href="../index.html" class="back-link">← toolbox/</a>
<h1>imageforge — conversor y compresor</h1>

<div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
  <div class="dropzone-label">arrastra imágenes aquí o <strong>haz clic</strong></div>
  <div class="format-badges" id="formatBadges"></div>
  <input type="file" id="fileInput" multiple accept=".tiff,.tif,.jpg,.jpeg,.png,.webp,.avif,.bmp,.gif,.ico,.svg,.heic,.heif,image/*">
</div>

<div id="imageList" class="image-list"></div>
<div id="batchBar" style="display:none"></div>

<div id="previewOverlay" class="preview-overlay" style="display:none" onclick="this.style.display='none'"></div>

<script>
const images = [];
let idCounter = 0;

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const imageList = document.getElementById('imageList');
const batchBar = document.getElementById('batchBar');

/* ─── Format support detection ─── */
const INPUT_FORMATS = [
  { ext: 'jpg',  label: 'JPG',  mime: 'image/jpeg', supported: true },
  { ext: 'png',  label: 'PNG',  mime: 'image/png',  supported: true },
  { ext: 'webp', label: 'WebP', mime: 'image/webp', supported: true },
  { ext: 'avif', label: 'AVIF', mime: 'image/avif', supported: false },
  { ext: 'gif',  label: 'GIF',  mime: 'image/gif',  supported: true },
  { ext: 'bmp',  label: 'BMP',  mime: 'image/bmp',  supported: true },
  { ext: 'ico',  label: 'ICO',  mime: 'image/x-icon', supported: true },
  { ext: 'svg',  label: 'SVG',  mime: 'image/svg+xml', supported: true },
  { ext: 'tiff', label: 'TIFF', mime: 'image/tiff', supported: true },
  { ext: 'heic', label: 'HEIC', mime: 'image/heic', supported: false },
];

const OUTPUT_FORMATS = [
  { value: 'jpeg', label: 'JPEG', hasQuality: true,  supported: true },
  { value: 'png',  label: 'PNG',  hasQuality: false, supported: true },
  { value: 'webp', label: 'WebP', hasQuality: true,  supported: true },
  { value: 'avif', label: 'AVIF', hasQuality: true,  supported: false },
];

// Detect AVIF decode support
function detectAvifDecode() {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img.width > 0 && img.height > 0);
    img.onerror = () => resolve(false);
    img.src = 'data:image/avif;base64,AAAAIGZ0eXBhdmlmAAAAAGF2aWZtaWYxbWlhZk1BMUIAAADybWV0YQAAAAAAAAAoaGRscgAAAAAAAAAAcGljdAAAAAAAAAAAAAAAAGxpYmF2aWYAAAAADnBpdG0AAAAAAAEAAAAeaWxvYwAAAABEAAABAAEAAAABAAABGgAAAB0AAAAoaWluZgAAAAAAAQAAABppbmZlAgAAAAABAABhdjAxQ29sb3IAAAAAamlwcnAAAABLaXBjbwAAABRpc3BlAAAAAAAAAAIAAAACAAAAEHBpeGkAAAAAAwgICAAAAAxhdjFDgQ0MAAAAABNjb2xybmNseAACAAIAAYAAAAAXaXBtYQAAAAAAAAABAAEEAQKDBAAAACVtZGF0EgAKBzgABhAQ0AIy';
  });
}

// Detect AVIF encode support
function detectAvifEncode() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 1;
    return c.toDataURL('image/avif').startsWith('data:image/avif');
  } catch { return false; }
}

// Detect HEIC decode support
function detectHeicDecode() {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img.width > 0);
    img.onerror = () => resolve(false);
    // Minimal HEIC test — most browsers won't decode this, Safari might
    img.src = 'data:image/heic;base64,AAAAA';
    setTimeout(() => resolve(false), 500);
  });
}

async function initFormatSupport() {
  const avifDecode = await detectAvifDecode();
  const avifEncode = detectAvifEncode();
  const heicDecode = await detectHeicDecode();

  INPUT_FORMATS.find(f => f.ext === 'avif').supported = avifDecode;
  INPUT_FORMATS.find(f => f.ext === 'heic').supported = heicDecode;
  OUTPUT_FORMATS.find(f => f.value === 'avif').supported = avifEncode;

  renderFormatBadges();
}

function renderFormatBadges() {
  const container = document.getElementById('formatBadges');
  container.innerHTML = INPUT_FORMATS.map(f =>
    `<span class="format-badge ${f.supported ? '' : 'unsupported'}" title="${f.supported ? 'soportado' : 'no soportado en este navegador'}">.${f.ext}</span>`
  ).join('');
}

initFormatSupport();

/* ─── Accepted file extensions ─── */
const ACCEPTED_EXT = /\.(tiff|tif|jpg|jpeg|png|webp|avif|bmp|gif|ico|svg|heic|heif)$/i;

/* ─── Drag & drop / file input ─── */
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
  fileInput.value = '';
});

function handleFiles(files) {
  for (const file of files) {
    const isImage = file.type.startsWith('image/') || ACCEPTED_EXT.test(file.name);
    if (!isImage) continue;
    const id = ++idCounter;
    const reader = new FileReader();
    reader.onload = (ev) => {
      processImage(file, ev.target.result, id);
    };
    reader.readAsArrayBuffer(file);
  }
}

function processImage(file, arrayBuf, id) {
  const isTiff = file.name.match(/\.(tiff|tif)$/i) || file.type === 'image/tiff';
  const isSvg = file.name.match(/\.svg$/i) || file.type === 'image/svg+xml';

  if (isTiff) {
    try {
      const ifds = UTIF.decode(arrayBuf);
      UTIF.decodeImage(arrayBuf, ifds[0]);
      const rgba = UTIF.toRGBA8(ifds[0]);
      const w = ifds[0].width, h = ifds[0].height;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(w, h);
      imgData.data.set(new Uint8Array(rgba));
      ctx.putImageData(imgData, 0, 0);
      addImage(id, file, canvas.toDataURL('image/png'), w, h);
    } catch (err) {
      showToast('error al leer tiff: ' + err.message);
    }
  } else if (isSvg) {
    // SVG: render to canvas via blob URL + Image
    const svgBlob = new Blob([arrayBuf], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      // Default SVG to 1024 wide if no intrinsic size
      const w = img.naturalWidth || 1024;
      const h = img.naturalHeight || 1024;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      addImage(id, file, canvas.toDataURL('image/png'), w, h);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      showToast('error al leer svg: ' + file.name);
    };
    img.src = url;
  } else {
    // All other raster formats: let the browser decode
    const blob = new Blob([arrayBuf], { type: file.type || 'image/png' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      addImage(id, file, canvas.toDataURL('image/png'), img.naturalWidth, img.naturalHeight);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      const ext = file.name.split('.').pop().toUpperCase();
      showToast(`formato ${ext} no soportado en este navegador`, true);
    };
    img.src = url;
  }
}

function addImage(id, file, dataUrl, origW, origH) {
  images.push({
    id, file, dataUrl, origW, origH,
    format: 'jpeg', quality: 80,
    newW: origW, newH: origH,
    linked: true, pct: 100
  });
  renderList();
}

function removeImage(id) {
  const idx = images.findIndex(i => i.id === id);
  if (idx > -1) images.splice(idx, 1);
  renderList();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function getExtFromFormat(fmt) {
  return { jpeg: 'jpg', png: 'png', webp: 'webp', avif: 'avif' }[fmt] || fmt;
}

function getMime(fmt) { return 'image/' + fmt; }

function formatHasQuality(fmt) {
  const f = OUTPUT_FORMATS.find(o => o.value === fmt);
  return f ? f.hasQuality : false;
}

function buildFormatOptions(selectedFormat) {
  return OUTPUT_FORMATS
    .filter(f => f.supported)
    .map(f => `<option value="${f.value}" ${selectedFormat === f.value ? 'selected' : ''}>${f.label}</option>`)
    .join('');
}

function renderList() {
  imageList.innerHTML = '';
  images.forEach(entry => {
    const noQuality = !formatHasQuality(entry.format);
    const card = document.createElement('div');
    card.className = 'image-card';
    card.innerHTML = `
      <div class="image-card-header">
        <div class="thumb-container" onclick="previewImage(${entry.id})">
          <img src="${entry.dataUrl}" alt="">
        </div>
        <div class="image-meta">
          <h3>${entry.file.name}</h3>
          <div class="meta-tags">${entry.origW}×${entry.origH} · ${formatSize(entry.file.size)} · <span class="accent">${entry.file.name.split('.').pop().toUpperCase()}</span></div>
        </div>
        <button class="btn-remove" onclick="removeImage(${entry.id})">✕</button>
      </div>
      <div class="image-card-controls">
        <div class="control-group">
          <label>formato</label>
          <select onchange="updateEntry(${entry.id},'format',this.value)">
            ${buildFormatOptions(entry.format)}
          </select>
        </div>
        <div class="control-group">
          <div class="quality-header">
            <label>calidad</label>
            <span class="quality-value" id="qval-${entry.id}">${noQuality ? '—' : entry.quality + '%'}</span>
          </div>
          <input type="range" min="5" max="100" step="1" value="${entry.quality}"
            oninput="updateQuality(${entry.id}, this.value)"
            id="qslider-${entry.id}"
            ${noQuality ? 'disabled style="opacity:0.2"' : ''}>
        </div>
        <div class="control-group" style="justify-content:end">
          <button class="btn-export" onclick="exportImage(${entry.id})">exportar</button>
        </div>
      </div>
      <div class="resize-row">
        <div class="control-group">
          <label>ancho</label>
          <input type="number" value="${entry.newW}" min="1" max="20000"
            onchange="updateWidth(${entry.id}, this.value)" id="w-${entry.id}">
        </div>
        <button class="resize-link ${entry.linked ? 'linked' : ''}" onclick="toggleLink(${entry.id})" id="link-${entry.id}">
          ${entry.linked ? '⛓' : '⛓‍💥'}
        </button>
        <div class="control-group">
          <label>alto</label>
          <input type="number" value="${entry.newH}" min="1" max="20000"
            onchange="updateHeight(${entry.id}, this.value)" id="h-${entry.id}">
        </div>
        <div class="control-group resize-pct">
          <label>%</label>
          <input type="number" value="${entry.pct}" min="1" max="1000"
            onchange="updatePct(${entry.id}, this.value)" id="pct-${entry.id}">
        </div>
      </div>
    `;
    imageList.appendChild(card);
  });

  if (images.length > 1) {
    batchBar.style.display = 'flex';
    batchBar.className = 'batch-bar';
    batchBar.innerHTML = `
      <span class="batch-info">${images.length} imágenes</span>
      <div class="batch-actions">
        <button class="btn-batch danger" onclick="clearAll()">limpiar</button>
        <button class="btn-batch primary" onclick="exportAll()">exportar todo</button>
      </div>
    `;
  } else {
    batchBar.style.display = 'none';
  }
}

function getEntry(id) { return images.find(i => i.id === id); }

function updateEntry(id, key, val) {
  const e = getEntry(id);
  if (!e) return;
  e[key] = val;
  if (key === 'format') {
    const noQuality = !formatHasQuality(val);
    const slider = document.getElementById('qslider-' + id);
    const qval = document.getElementById('qval-' + id);
    slider.disabled = noQuality;
    slider.style.opacity = noQuality ? '0.2' : '1';
    qval.textContent = noQuality ? '—' : e.quality + '%';
  }
}

function updateQuality(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.quality = parseInt(val);
  document.getElementById('qval-' + id).textContent = val + '%';
}

function updateWidth(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.newW = parseInt(val);
  if (e.linked) {
    e.newH = Math.round(e.origH * (e.newW / e.origW));
    document.getElementById('h-' + id).value = e.newH;
  }
  e.pct = Math.round((e.newW / e.origW) * 100);
  document.getElementById('pct-' + id).value = e.pct;
}

function updateHeight(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.newH = parseInt(val);
  if (e.linked) {
    e.newW = Math.round(e.origW * (e.newH / e.origH));
    document.getElementById('w-' + id).value = e.newW;
  }
  e.pct = Math.round((e.newH / e.origH) * 100);
  document.getElementById('pct-' + id).value = e.pct;
}

function updatePct(id, val) {
  const e = getEntry(id);
  if (!e) return;
  e.pct = parseInt(val);
  e.newW = Math.round(e.origW * e.pct / 100);
  e.newH = Math.round(e.origH * e.pct / 100);
  document.getElementById('w-' + id).value = e.newW;
  document.getElementById('h-' + id).value = e.newH;
}

function toggleLink(id) {
  const e = getEntry(id);
  if (!e) return;
  e.linked = !e.linked;
  const btn = document.getElementById('link-' + id);
  btn.className = 'resize-link ' + (e.linked ? 'linked' : '');
  btn.innerHTML = e.linked ? '⛓' : '⛓‍💥';
}

function exportImage(id) {
  const e = getEntry(id);
  if (!e) return;
  const canvas = document.createElement('canvas');
  canvas.width = e.newW;
  canvas.height = e.newH;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, e.newW, e.newH);
    const quality = e.quality / 100;
    const mime = getMime(e.format);
    const dataUrl = formatHasQuality(e.format) ? canvas.toDataURL(mime, quality) : canvas.toDataURL(mime);

    // Check if browser actually encoded in the requested format
    const actualMime = dataUrl.substring(5, dataUrl.indexOf(';'));
    if (actualMime !== mime) {
      showToast(`${e.format.toUpperCase()} no soportado, exportando como PNG`, true);
    }

    const baseName = e.file.name.replace(/\.[^.]+$/, '');
    const ext = actualMime === mime ? getExtFromFormat(e.format) : 'png';
    downloadDataUrl(dataUrl, `${baseName}.${ext}`);
    showToast(`exportado: ${baseName}.${ext}`);
  };
  img.src = e.dataUrl;
}

function exportAll() {
  images.forEach((e, i) => setTimeout(() => exportImage(e.id), i * 300));
}

function clearAll() {
  images.length = 0;
  renderList();
}

function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function previewImage(id) {
  const e = getEntry(id);
  if (!e) return;
  const overlay = document.getElementById('previewOverlay');
  overlay.innerHTML = `
    <img src="${e.dataUrl}" alt="">
    <div class="preview-info">${e.file.name} · ${e.origW}×${e.origH} · ${formatSize(e.file.size)} — clic para cerrar</div>
  `;
  overlay.style.display = 'flex';
}

function showToast(msg, warn) {
  const toast = document.createElement('div');
  toast.className = 'status-toast' + (warn ? ' warn' : '');
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}
</script>
