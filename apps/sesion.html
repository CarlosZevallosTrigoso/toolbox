<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
/* === TOKENS === */
:root {
  --bg: #eaf0f7;
  --surface: #ffffff;
  --text: #1a1a1a;
  --muted: #888888;
  --faint: #bcbcbc;
  --border: #dcdcdc;
  --border-strong: #9a9a9a;
  --active: #c94630;
  --pending: #999999;
  --in-progress: #b58b1e;
  --done: #3a7a42;
  --advanced: #3a5a7a;
  --not-done: #a04040;
  --break: #c8c8c4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Fira Code', ui-monospace, 'SF Mono', 'Menlo', 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 32px 24px 80px;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1080px; margin: 0 auto; }

/* === TYPOGRAPHY === */
h1 {
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase;
}
h2 {
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px;
}

/* === HEADER === */
header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 28px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.title-block { display: flex; flex-direction: column; gap: 4px; }
.header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.session-date { font-size: 11px; color: var(--muted); }

/* === BUTTONS === */
button {
  font-family: inherit; font-size: 12px;
  background: transparent; border: 1px solid var(--border);
  color: var(--text); padding: 5px 10px;
  cursor: pointer;
  transition: background 0.08s, border-color 0.08s;
}
button:hover { background: var(--surface); border-color: var(--border-strong); }
button.primary {
  background: var(--text); color: var(--bg); border-color: var(--text);
}
button.primary:hover { background: #333; border-color: #333; }
button:disabled { opacity: 0.3; cursor: not-allowed; }
button.ghost { border: none; padding: 4px 6px; color: var(--muted); }
button.ghost:hover { color: var(--text); background: transparent; }

/* === SECTIONS === */
section {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px;
  margin-bottom: 20px;
}

/* === TIMERS === */
.timers-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
.timer-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px;
}
.timer-label {
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
.timer-value {
  font-size: 26px; font-weight: 400;
  letter-spacing: 0.03em; font-variant-numeric: tabular-nums;
}
.timer-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
.timer-card.running .timer-value { color: var(--active); }
.timer-card.paused .timer-value { color: var(--muted); }
.timer-card.break .timer-value { color: var(--advanced); }

/* === RHYTHM SELECTOR === */
.rhythm-select {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.rhythm-select select, .rhythm-select input[type="number"] {
  font-family: inherit; font-size: 12px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 5px 8px;
}
.rhythm-custom {
  display: none; gap: 12px; margin-top: 10px;
  flex-wrap: wrap; align-items: center;
  padding-top: 10px; border-top: 1px solid var(--border);
}
.rhythm-custom.show { display: flex; }
.rhythm-custom label {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--muted);
}
.rhythm-custom input[type="number"] {
  width: 52px; text-align: center;
}
.log-cycles-label {
  font-size: 11px; color: var(--muted); margin-left: 8px;
  display: flex; align-items: center; gap: 4px;
}

/* === TASK LIST === */
.task-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 12px; }
.task-row {
  display: grid;
  grid-template-columns: 20px 30px 1fr 80px 120px 80px 90px 28px;
  gap: 8px;
  align-items: center;
  padding: 10px 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: background 0.08s, border-color 0.08s;
}
.task-row.active {
  border-color: var(--active);
  background: #fff6f3;
}
.task-row.done { opacity: 0.6; }
.task-row.dragging { opacity: 0.35; }
.task-row.exceeded .task-timer { color: var(--not-done); }
.drag-handle {
  cursor: grab; color: var(--faint);
  text-align: center; user-select: none;
  font-size: 14px; line-height: 1;
}
.drag-handle:hover { color: var(--muted); }
.task-order { font-size: 11px; color: var(--muted); text-align: center; }
.task-name {
  background: transparent; border: none;
  font-family: inherit; font-size: 13px; color: var(--text);
  padding: 2px 4px; outline: none; width: 100%;
}
.task-name:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
.task-estimate {
  font-family: inherit; font-size: 11px;
  background: transparent; border: 1px solid var(--border);
  color: var(--text); padding: 3px 6px; width: 100%; text-align: center;
}
.task-estimate::placeholder { color: var(--faint); }
.task-status {
  font-family: inherit; font-size: 11px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 3px 6px; cursor: pointer;
  border-left-width: 3px;
}
.task-timer {
  font-size: 11px; color: var(--muted); text-align: right;
  font-variant-numeric: tabular-nums;
}
.task-row.active .task-timer { color: var(--active); }
.task-start-btn { font-size: 11px; padding: 4px 8px; }
.task-start-btn.running {
  background: var(--active); color: white; border-color: var(--active);
}
.task-note-toggle {
  font-size: 18px; color: var(--faint);
  cursor: pointer; text-align: center; user-select: none; line-height: 1;
}
.task-note-toggle:hover { color: var(--muted); }
.task-note-toggle.has-note { color: var(--in-progress); }
.task-note { grid-column: 1 / -1; margin-top: 6px; display: none; }
.task-note.show { display: block; }
.task-note textarea {
  width: 100%; min-height: 60px;
  font-family: inherit; font-size: 12px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 8px; resize: vertical; outline: none;
}
.task-note textarea:focus { border-color: var(--border-strong); }
.task-note .delete-row {
  display: flex; justify-content: flex-end; margin-top: 6px;
}
.task-note .delete-row button {
  color: var(--not-done); font-size: 11px; border-color: var(--border);
}

.add-task-row {
  display: flex; gap: 8px; align-items: center;
  padding: 10px; border: 1px dashed var(--border);
}
.add-task-row input {
  flex: 1;
  font-family: inherit; font-size: 13px;
  background: transparent; border: none; color: var(--text);
  padding: 4px; outline: none;
}
.add-task-row input::placeholder { color: var(--faint); }

/* === SESSION CONTROL === */
.session-control {
  display: flex; justify-content: center; gap: 10px;
  padding: 20px 0;
}
.session-control button {
  font-size: 12px; padding: 10px 28px;
  letter-spacing: 0.15em; text-transform: uppercase;
}

/* === VISUALIZATION === */
.viz-section { padding: 20px; }
.gantt-container { overflow-x: auto; padding: 12px 0; }
.gantt-svg { display: block; min-width: 100%; }
.distribution-bar {
  display: flex; height: 32px;
  border: 1px solid var(--border);
  margin-top: 20px; overflow: hidden;
}
.dist-segment {
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: white; overflow: hidden;
  white-space: nowrap; padding: 0 4px;
}
.dist-legend {
  display: flex; flex-wrap: wrap; gap: 12px;
  margin-top: 10px; font-size: 11px;
}
.dist-legend-item {
  display: flex; align-items: center; gap: 6px; color: var(--muted);
}
.dist-legend-swatch { width: 10px; height: 10px; display: inline-block; }

/* === STATS === */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  padding-top: 16px; border-top: 1px solid var(--border);
  margin-top: 20px;
}
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-label {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted);
}
.stat-value { font-size: 16px; font-variant-numeric: tabular-nums; }

/* === MODALS === */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.3);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border-strong);
  padding: 24px; max-width: 480px; width: 90%;
  max-height: 80vh; overflow-y: auto;
}
.modal h2 { margin-bottom: 16px; color: var(--text); }
.modal p { color: var(--muted); margin-bottom: 16px; }
.modal-actions {
  display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px;
}
.states-editor { display: flex; flex-direction: column; gap: 10px; }
.state-edit-row {
  display: grid; grid-template-columns: 110px 1fr;
  gap: 10px; align-items: center;
}
.state-edit-row label {
  font-size: 11px; color: var(--muted); letter-spacing: 0.05em;
}
.state-edit-row input {
  font-family: inherit; font-size: 13px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 6px 8px;
}

/* === CYCLE OVERLAY === */
.cycle-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center;
  z-index: 200;
}
.cycle-overlay.show { display: flex; }
.cycle-modal {
  background: var(--surface); padding: 32px;
  border: 1px solid var(--border-strong);
  text-align: center; max-width: 380px;
}
.cycle-modal h2 {
  font-size: 14px; color: var(--text); margin-bottom: 8px;
  letter-spacing: 0.1em;
}
.cycle-modal p { color: var(--muted); margin-bottom: 20px; }
.cycle-modal .cycle-actions {
  display: flex; gap: 8px; justify-content: center;
}

.hidden { display: none !important; }
.file-input { display: none; }
</style>
</head>
<body>
<div class="container">

<header>
  <div class="title-block">
    <h1 id="session-title">sesión</h1>
    <div class="session-date" id="session-date">sin iniciar</div>
  </div>
  <div class="header-actions">
    <button id="btn-import" title="cargar JSON">importar</button>
    <button id="btn-export-json">JSON</button>
    <button id="btn-export-txt">TXT</button>
    <button id="btn-settings" title="renombrar estados">estados</button>
    <button id="btn-reset" title="reiniciar sesión">reset</button>
    <input type="file" id="file-input" class="file-input" accept=".json,application/json">
  </div>
</header>

<!-- TIMERS -->
<div class="timers-row hidden" id="timers-row">
  <div class="timer-card" id="session-timer-card">
    <div class="timer-label">sesión</div>
    <div class="timer-value" id="session-timer">00:00:00</div>
    <div class="timer-meta" id="session-status">–</div>
  </div>
  <div class="timer-card" id="task-timer-card">
    <div class="timer-label">tarea activa</div>
    <div class="timer-value" id="task-timer">00:00:00</div>
    <div class="timer-meta" id="task-name-display">ninguna</div>
  </div>
  <div class="timer-card" id="rhythm-timer-card">
    <div class="timer-label">ritmo</div>
    <div class="timer-value" id="rhythm-timer">–</div>
    <div class="timer-meta" id="rhythm-status">libre</div>
  </div>
</div>

<!-- RHYTHM -->
<section id="rhythm-section">
  <h2>modo de ritmo</h2>
  <div class="rhythm-select">
    <select id="rhythm-mode">
      <option value="free">libre · sin ciclos</option>
      <option value="pomodoro">pomodoro clásico · 25 / 5 / 15</option>
      <option value="52-17">52 / 17</option>
      <option value="90-20">90 / 20 · ultradiano</option>
      <option value="custom">personalizado</option>
    </select>
    <label class="log-cycles-label">
      <input type="checkbox" id="log-cycles"> registrar ciclos en el log
    </label>
  </div>
  <div class="rhythm-custom" id="rhythm-custom">
    <label>trabajo <input type="number" id="custom-work" value="25" min="1"> min</label>
    <label>pausa corta <input type="number" id="custom-short" value="5" min="1"> min</label>
    <label>pausa larga <input type="number" id="custom-long" value="15" min="1"> min</label>
    <label>ciclos antes de pausa larga <input type="number" id="custom-cycles" value="4" min="1"></label>
  </div>
</section>

<!-- TASKS -->
<section>
  <h2>tareas</h2>
  <div class="task-list" id="task-list"></div>
  <div class="add-task-row">
    <input type="text" id="new-task-input" placeholder="+ agregar tarea y presionar enter">
  </div>
</section>

<!-- SESSION CONTROL -->
<div class="session-control">
  <button id="btn-start-session" class="primary">iniciar sesión</button>
  <button id="btn-pause-session" class="hidden">pausar sesión</button>
  <button id="btn-resume-session" class="hidden primary">reanudar sesión</button>
  <button id="btn-end-session" class="hidden">terminar sesión</button>
</div>

<!-- VIZ -->
<section class="viz-section hidden" id="viz-section">
  <h2>línea de tiempo</h2>
  <div class="gantt-container">
    <svg class="gantt-svg" id="gantt-svg"></svg>
  </div>
  <h2 style="margin-top: 24px;">distribución</h2>
  <div class="distribution-bar" id="distribution-bar"></div>
  <div class="dist-legend" id="dist-legend"></div>
  <div class="stats-grid" id="stats-grid"></div>
</section>

</div>

<!-- SETTINGS MODAL -->
<div class="modal-backdrop" id="settings-modal">
  <div class="modal">
    <h2>renombrar estados</h2>
    <div class="states-editor" id="states-editor"></div>
    <div class="modal-actions">
      <button id="settings-cancel">cancelar</button>
      <button id="settings-save" class="primary">guardar</button>
    </div>
  </div>
</div>

<!-- CYCLE OVERLAY -->
<div class="cycle-overlay" id="cycle-overlay">
  <div class="cycle-modal">
    <h2 id="cycle-title">ciclo completado</h2>
    <p id="cycle-message">tiempo de pausa</p>
    <div class="cycle-actions">
      <button id="cycle-accept" class="primary">aceptar pausa</button>
      <button id="cycle-skip">continuar</button>
    </div>
  </div>
</div>

<!-- IMPORT MODAL -->
<div class="modal-backdrop" id="import-modal">
  <div class="modal">
    <h2>sesión importada</h2>
    <p id="import-info"></p>
    <div class="modal-actions">
      <button id="import-cancel">cancelar</button>
      <button id="import-template">nueva desde plantilla</button>
      <button id="import-continue" class="primary">continuar sesión</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   STATE
   ========================================================================== */
const STORAGE_KEY = 'czt-session-tracker-v1';

const DEFAULT_STATE_LABELS = {
  pending:    'pendiente',
  inProgress: 'en curso',
  done:       'terminada',
  advanced:   'avanzada',
  notDone:    'no hecha'
};

const STATE_COLORS = {
  pending:    '#999999',
  inProgress: '#b58b1e',
  done:       '#3a7a42',
  advanced:   '#3a5a7a',
  notDone:    '#a04040'
};

const RHYTHM_PRESETS = {
  free:      { work: 0,  short: 0,  long: 0,  cycles: 0 },
  pomodoro:  { work: 25, short: 5,  long: 15, cycles: 4 },
  '52-17':   { work: 52, short: 17, long: 17, cycles: 4 },
  '90-20':   { work: 90, short: 20, long: 30, cycles: 3 },
  custom:    { work: 25, short: 5,  long: 15, cycles: 4 }
};

function freshState() {
  return {
    version: '1.0',
    sessionId: crypto.randomUUID(),
    createdAt: null,
    lastModified: new Date().toISOString(),
    sessionTimer: {
      started: false, ended: false,
      startedAt: null, accumulatedMs: 0,
      isPaused: false, pausedAt: null
    },
    rhythm: {
      type: 'free',
      work: 25, short: 5, long: 15, cycles: 4,
      logCycles: false,
      currentCycle: 0, currentPhase: 'work',
      phaseStartedAt: null,
      cycleLog: []
    },
    stateLabels: { ...DEFAULT_STATE_LABELS },
    tasks: [],
    activeTaskId: null
  };
}

let state = freshState();
let tickInterval = null;
let tickCount = 0;
let cycleOverlayOpen = false;
let pendingImport = null;

/* ==========================================================================
   HELPERS
   ========================================================================== */
function fmtTime(ms) {
  if (ms < 0 || !isFinite(ms)) ms = 0;
  const s = Math.floor(ms / 1000);
  const hh = String(Math.floor(s / 3600)).padStart(2, '0');
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${hh}:${mm}:${ss}`;
}
function fmtShort(ms) {
  if (ms < 1000) return '0s';
  if (ms < 60000) return Math.round(ms / 1000) + 's';
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  if (m < 60) return s ? `${m}m${s}s` : `${m}m`;
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return mm ? `${h}h${mm}m` : `${h}h`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString('es-PE', { dateStyle: 'medium', timeStyle: 'short' });
  } catch { return iso; }
}
function now() { return Date.now(); }
function escapeXml(s) {
  return String(s).replace(/[<>&'"]/g,
    c => ({ '<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;' }[c]));
}

function computeSessionMs() {
  const t = state.sessionTimer;
  if (!t.started) return 0;
  if (t.ended || t.isPaused) return t.accumulatedMs;
  return t.accumulatedMs + (now() - new Date(t.startedAt).getTime());
}

function computeTaskMs(task) {
  return task.intervals.reduce((acc, iv) => {
    const end = iv.end ? new Date(iv.end).getTime() : now();
    return acc + Math.max(0, end - new Date(iv.start).getTime());
  }, 0);
}

/* ==========================================================================
   PERSISTENCE
   ========================================================================== */
function saveState() {
  state.lastModified = new Date().toISOString();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn('no pude guardar', e); }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    state = { ...freshState(), ...p };
    state.sessionTimer = { ...freshState().sessionTimer, ...(p.sessionTimer || {}) };
    state.rhythm = { ...freshState().rhythm, ...(p.rhythm || {}) };
    state.stateLabels = { ...DEFAULT_STATE_LABELS, ...(p.stateLabels || {}) };

    // Recovery: if session was running when tab closed, handle the gap
    if (state.sessionTimer.started && !state.sessionTimer.ended && !state.sessionTimer.isPaused) {
      const lastMod = new Date(state.lastModified).getTime();
      const gap = now() - lastMod;
      if (gap > 60 * 1000) {
        // long gap: close intervals at lastModified, pause session
        if (state.activeTaskId) {
          const t = state.tasks.find(x => x.id === state.activeTaskId);
          if (t && t.intervals.length) {
            const last = t.intervals[t.intervals.length - 1];
            if (!last.end) last.end = state.lastModified;
          }
        }
        const elapsed = lastMod - new Date(state.sessionTimer.startedAt).getTime();
        state.sessionTimer.accumulatedMs += Math.max(0, elapsed);
        state.sessionTimer.isPaused = true;
        state.sessionTimer.pausedAt = state.lastModified;
      }
    }
  } catch (e) { console.warn('no pude cargar', e); }
}

/* ==========================================================================
   TASK MANAGEMENT
   ========================================================================== */
function addTask(name) {
  if (!name || !name.trim()) return;
  state.tasks.push({
    id: crypto.randomUUID(),
    name: name.trim(),
    order: state.tasks.length,
    status: 'pending',
    estimateMin: null,
    note: '',
    accumulatedMs: 0,
    intervals: []
  });
  reorderTasks();
  saveState();
  render();
}

function deleteTask(id) {
  if (state.activeTaskId === id) stopActiveTask();
  state.tasks = state.tasks.filter(t => t.id !== id);
  reorderTasks();
  saveState();
  render();
}

function reorderTasks() { state.tasks.forEach((t, i) => { t.order = i; }); }

function updateTask(id, patch) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  Object.assign(t, patch);
  saveState();
  render();
}

function setTaskStatus(id, status) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (state.activeTaskId === id && status !== 'inProgress') stopActiveTask();
  t.status = status;
  saveState();
  render();
}

function startTask(id) {
  if (!state.sessionTimer.started || state.sessionTimer.isPaused || state.sessionTimer.ended) return;
  if (state.activeTaskId === id) { stopActiveTask(); return; }
  if (state.activeTaskId) stopActiveTask();
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  t.intervals.push({ start: new Date().toISOString(), end: null });
  t.status = 'inProgress';
  state.activeTaskId = id;
  saveState();
  render();
}

function stopActiveTask() {
  if (!state.activeTaskId) return;
  const t = state.tasks.find(x => x.id === state.activeTaskId);
  if (t && t.intervals.length) {
    const last = t.intervals[t.intervals.length - 1];
    if (!last.end) {
      last.end = new Date().toISOString();
      t.accumulatedMs = computeTaskMs(t);
    }
  }
  state.activeTaskId = null;
  saveState();
  render();
}

/* ==========================================================================
   SESSION CONTROL
   ========================================================================== */
function startSession() {
  if (state.tasks.length === 0) {
    alert('agrega al menos una tarea antes de iniciar');
    return;
  }
  applyRhythmFromUI();
  state.sessionTimer.started = true;
  state.sessionTimer.startedAt = new Date().toISOString();
  state.sessionTimer.accumulatedMs = 0;
  state.sessionTimer.isPaused = false;
  state.sessionTimer.ended = false;
  if (!state.createdAt) state.createdAt = state.sessionTimer.startedAt;
  if (state.rhythm.type !== 'free') {
    state.rhythm.currentPhase = 'work';
    state.rhythm.currentCycle = 1;
    state.rhythm.phaseStartedAt = state.sessionTimer.startedAt;
  }
  startTick();
  saveState();
  render();
}

function pauseSession() {
  if (!state.sessionTimer.started || state.sessionTimer.isPaused) return;
  if (state.activeTaskId) {
    const t = state.tasks.find(x => x.id === state.activeTaskId);
    if (t && t.intervals.length) {
      const last = t.intervals[t.intervals.length - 1];
      if (!last.end) {
        last.end = new Date().toISOString();
        t.accumulatedMs = computeTaskMs(t);
      }
    }
  }
  const elapsed = now() - new Date(state.sessionTimer.startedAt).getTime();
  state.sessionTimer.accumulatedMs += Math.max(0, elapsed);
  state.sessionTimer.isPaused = true;
  state.sessionTimer.pausedAt = new Date().toISOString();
  saveState();
  render();
}

function resumeSession() {
  if (!state.sessionTimer.isPaused) return;
  state.sessionTimer.startedAt = new Date().toISOString();
  state.sessionTimer.isPaused = false;
  if (state.activeTaskId) {
    const t = state.tasks.find(x => x.id === state.activeTaskId);
    if (t) t.intervals.push({ start: new Date().toISOString(), end: null });
  }
  saveState();
  render();
}

function endSession() {
  if (!confirm('¿terminar la sesión? podrás seguir exportando el log después.')) return;
  if (state.activeTaskId) stopActiveTask();
  if (!state.sessionTimer.isPaused && state.sessionTimer.started) {
    const elapsed = now() - new Date(state.sessionTimer.startedAt).getTime();
    state.sessionTimer.accumulatedMs += Math.max(0, elapsed);
  }
  state.sessionTimer.ended = true;
  stopTick();
  saveState();
  render();
}

function resetSession() {
  if (!confirm('¿reiniciar? se perderá toda la sesión actual (no se exporta automáticamente).')) return;
  state = freshState();
  stopTick();
  saveState();
  render();
}

/* ==========================================================================
   RHYTHM / POMODORO
   ========================================================================== */
function applyRhythmFromUI() {
  const mode = document.getElementById('rhythm-mode').value;
  const preset = RHYTHM_PRESETS[mode];
  state.rhythm.type = mode;
  if (mode === 'custom') {
    state.rhythm.work   = parseInt(document.getElementById('custom-work').value, 10) || 25;
    state.rhythm.short  = parseInt(document.getElementById('custom-short').value, 10) || 5;
    state.rhythm.long   = parseInt(document.getElementById('custom-long').value, 10) || 15;
    state.rhythm.cycles = parseInt(document.getElementById('custom-cycles').value, 10) || 4;
  } else {
    state.rhythm.work   = preset.work;
    state.rhythm.short  = preset.short;
    state.rhythm.long   = preset.long;
    state.rhythm.cycles = preset.cycles;
  }
  state.rhythm.logCycles = document.getElementById('log-cycles').checked;
}

function computeRhythmRemaining() {
  if (state.rhythm.type === 'free') return null;
  if (!state.sessionTimer.started || state.sessionTimer.isPaused || state.sessionTimer.ended) return null;
  if (!state.rhythm.phaseStartedAt) return null;
  const mins = state.rhythm.currentPhase === 'work'  ? state.rhythm.work
             : state.rhythm.currentPhase === 'short' ? state.rhythm.short
             : state.rhythm.long;
  const phaseMs = mins * 60 * 1000;
  const elapsed = now() - new Date(state.rhythm.phaseStartedAt).getTime();
  return phaseMs - elapsed;
}

function checkRhythmTransition() {
  const rem = computeRhythmRemaining();
  if (rem === null) return;
  if (rem <= 0 && !cycleOverlayOpen) triggerCycleTransition();
}

function triggerCycleTransition() {
  cycleOverlayOpen = true;
  const overlay = document.getElementById('cycle-overlay');
  const title = document.getElementById('cycle-title');
  const msg = document.getElementById('cycle-message');
  const accept = document.getElementById('cycle-accept');

  if (state.rhythm.logCycles) {
    state.rhythm.cycleLog.push({
      phase: state.rhythm.currentPhase,
      cycle: state.rhythm.currentCycle,
      startedAt: state.rhythm.phaseStartedAt,
      endedAt: new Date().toISOString()
    });
  }

  if (state.rhythm.currentPhase === 'work') {
    const isLong = state.rhythm.currentCycle % state.rhythm.cycles === 0;
    const nextPhase = isLong ? 'long' : 'short';
    const nextMin = isLong ? state.rhythm.long : state.rhythm.short;
    title.textContent = isLong ? 'pausa larga' : 'pausa corta';
    msg.textContent = `bloque de trabajo completado. sugiere ${nextMin} min de pausa. la tarea activa se pausará.`;
    accept.textContent = `aceptar pausa (${nextMin}m)`;
    accept.onclick = () => acceptCyclePause(nextPhase);
  } else {
    title.textContent = 'fin de pausa';
    msg.textContent = `iniciar nuevo bloque de trabajo de ${state.rhythm.work} min.`;
    accept.textContent = 'continuar trabajo';
    accept.onclick = acceptWorkResume;
  }
  document.getElementById('cycle-skip').onclick = skipCycleTransition;
  overlay.classList.add('show');
  playChime();
}

function acceptCyclePause(nextPhase) {
  if (state.activeTaskId) {
    const t = state.tasks.find(x => x.id === state.activeTaskId);
    if (t && t.intervals.length) {
      const last = t.intervals[t.intervals.length - 1];
      if (!last.end) {
        last.end = new Date().toISOString();
        t.accumulatedMs = computeTaskMs(t);
      }
    }
  }
  state.rhythm.currentPhase = nextPhase;
  state.rhythm.phaseStartedAt = new Date().toISOString();
  closeCycleOverlay();
  saveState();
  render();
}

function acceptWorkResume() {
  state.rhythm.currentCycle += 1;
  state.rhythm.currentPhase = 'work';
  state.rhythm.phaseStartedAt = new Date().toISOString();
  if (state.activeTaskId) {
    const t = state.tasks.find(x => x.id === state.activeTaskId);
    if (t) {
      const last = t.intervals[t.intervals.length - 1];
      if (last && last.end) t.intervals.push({ start: new Date().toISOString(), end: null });
    }
  }
  closeCycleOverlay();
  saveState();
  render();
}

function skipCycleTransition() {
  state.rhythm.phaseStartedAt = new Date().toISOString();
  if (state.rhythm.currentPhase === 'work') state.rhythm.currentCycle += 1;
  closeCycleOverlay();
  saveState();
  render();
}

function closeCycleOverlay() {
  cycleOverlayOpen = false;
  document.getElementById('cycle-overlay').classList.remove('show');
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.value = 660;
    g.gain.value = 0.05;
    o.start();
    setTimeout(() => { o.frequency.value = 880; }, 180);
    setTimeout(() => {
      g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
      o.stop(ctx.currentTime + 0.35);
    }, 360);
  } catch {}
}

/* ==========================================================================
   TICK
   ========================================================================== */
function startTick() {
  if (tickInterval) clearInterval(tickInterval);
  tickCount = 0;
  tickInterval = setInterval(() => {
    updateTimerDisplays();
    checkRhythmTransition();
    if (++tickCount % 10 === 0) saveState();
  }, 1000);
}

function stopTick() {
  if (tickInterval) clearInterval(tickInterval);
  tickInterval = null;
}

function updateTimerDisplays() {
  document.getElementById('session-timer').textContent = fmtTime(computeSessionMs());
  const active = state.activeTaskId ? state.tasks.find(t => t.id === state.activeTaskId) : null;
  if (active) {
    document.getElementById('task-timer').textContent = fmtTime(computeTaskMs(active));
    document.getElementById('task-name-display').textContent = active.name;
    const row = document.querySelector(`[data-task-id="${active.id}"] .task-timer`);
    if (row) row.textContent = fmtTime(computeTaskMs(active));
  } else {
    document.getElementById('task-timer').textContent = '00:00:00';
    document.getElementById('task-name-display').textContent = 'ninguna';
  }
  const rem = computeRhythmRemaining();
  if (rem !== null) {
    document.getElementById('rhythm-timer').textContent = fmtTime(Math.max(0, rem));
    const phaseName = state.rhythm.currentPhase === 'work' ? 'trabajo'
                    : state.rhythm.currentPhase === 'short' ? 'pausa corta' : 'pausa larga';
    document.getElementById('rhythm-status').textContent =
      `${phaseName} · ciclo ${state.rhythm.currentCycle}`;
  }
}

/* ==========================================================================
   RENDER
   ========================================================================== */
function render() {
  renderHeader();
  renderTimers();
  renderRhythmSection();
  renderTaskList();
  renderSessionControls();
  renderVisualization();
}

function fmtSessionTitle(iso) {
  const d = iso ? new Date(iso) : new Date();
  const weekday = d.toLocaleDateString('es-PE', { weekday: 'long' });
  const day = d.getDate();
  const month = d.toLocaleDateString('es-PE', { month: 'long' });
  return `${weekday} ${day} de ${month}`;
}

function renderHeader() {
  const titleEl = document.getElementById('session-title');
  const dateEl = document.getElementById('session-date');
  const start = state.createdAt || state.sessionTimer.startedAt;
  titleEl.textContent = fmtSessionTitle(start);
  document.title = fmtSessionTitle(start) + ' · sesión';
  if (!state.sessionTimer.started && !state.createdAt) {
    dateEl.textContent = 'sin iniciar';
  } else {
    const startDate = new Date(start);
    const timeStr = startDate.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
    let txt = `iniciada ${timeStr}`;
    if (state.sessionTimer.ended) txt += ' · terminada';
    else if (state.sessionTimer.isPaused) txt += ' · en pausa';
    dateEl.textContent = txt;
  }
}

function renderTimers() {
  const row = document.getElementById('timers-row');
  if (!state.sessionTimer.started) { row.classList.add('hidden'); return; }
  row.classList.remove('hidden');
  const sCard = document.getElementById('session-timer-card');
  sCard.classList.remove('running','paused','break');
  if (state.sessionTimer.ended) {
    sCard.classList.add('paused');
    document.getElementById('session-status').textContent = 'terminada';
  } else if (state.sessionTimer.isPaused) {
    sCard.classList.add('paused');
    document.getElementById('session-status').textContent = 'en pausa';
  } else {
    sCard.classList.add('running');
    document.getElementById('session-status').textContent = 'activa';
  }
  const tCard = document.getElementById('task-timer-card');
  tCard.classList.remove('running','paused');
  tCard.classList.add(state.activeTaskId ? 'running' : 'paused');
  const rCard = document.getElementById('rhythm-timer-card');
  rCard.classList.remove('running','paused','break');
  if (state.rhythm.type === 'free') {
    document.getElementById('rhythm-timer').textContent = '–';
    document.getElementById('rhythm-status').textContent = 'libre';
  } else if (state.rhythm.currentPhase === 'work') {
    rCard.classList.add('running');
  } else {
    rCard.classList.add('break');
  }
  updateTimerDisplays();
}

function renderRhythmSection() {
  const sec = document.getElementById('rhythm-section');
  if (state.sessionTimer.started) sec.classList.add('hidden');
  else sec.classList.remove('hidden');
}

function renderTaskList() {
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  state.tasks.sort((a,b) => a.order - b.order).forEach((task, idx) => {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.dataset.taskId = task.id;
    if (task.id === state.activeTaskId) row.classList.add('active');
    if (task.status === 'done') row.classList.add('done');
    const taskMs = computeTaskMs(task);
    if (task.estimateMin && taskMs > task.estimateMin * 60 * 1000) row.classList.add('exceeded');
    row.draggable = true;

    const handle = document.createElement('div');
    handle.className = 'drag-handle';
    handle.textContent = '⋮⋮';
    handle.title = 'arrastrar para reordenar';
    row.appendChild(handle);

    const order = document.createElement('div');
    order.className = 'task-order';
    order.textContent = String(idx + 1).padStart(2, '0');
    row.appendChild(order);

    const name = document.createElement('input');
    name.className = 'task-name';
    name.type = 'text';
    name.value = task.name;
    name.addEventListener('blur', () => {
      const v = name.value.trim();
      if (v && v !== task.name) updateTask(task.id, { name: v });
      else name.value = task.name;
    });
    name.addEventListener('keydown', e => { if (e.key === 'Enter') name.blur(); });
    row.appendChild(name);

    const est = document.createElement('input');
    est.className = 'task-estimate';
    est.type = 'number';
    est.min = '0';
    est.placeholder = 'est. min';
    est.value = task.estimateMin || '';
    est.addEventListener('change', () => {
      const v = parseInt(est.value, 10);
      updateTask(task.id, { estimateMin: isNaN(v) || v <= 0 ? null : v });
    });
    row.appendChild(est);

    const status = document.createElement('select');
    status.className = 'task-status';
    status.style.borderLeftColor = STATE_COLORS[task.status];
    Object.keys(state.stateLabels).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = state.stateLabels[key];
      if (task.status === key) opt.selected = true;
      status.appendChild(opt);
    });
    status.addEventListener('change', () => setTaskStatus(task.id, status.value));
    row.appendChild(status);

    const timer = document.createElement('div');
    timer.className = 'task-timer';
    timer.textContent = fmtTime(taskMs);
    row.appendChild(timer);

    const btn = document.createElement('button');
    btn.className = 'task-start-btn';
    const isActive = task.id === state.activeTaskId;
    btn.textContent = isActive ? 'pausar' : 'empezar';
    if (isActive) btn.classList.add('running');
    btn.disabled = !state.sessionTimer.started || state.sessionTimer.isPaused || state.sessionTimer.ended;
    btn.addEventListener('click', () => startTask(task.id));
    row.appendChild(btn);

    const noteToggle = document.createElement('div');
    noteToggle.className = 'task-note-toggle';
    noteToggle.textContent = task.note ? '●' : '○';
    noteToggle.title = 'nota / eliminar';
    if (task.note) noteToggle.classList.add('has-note');
    noteToggle.addEventListener('click', () => {
      const n = row.querySelector('.task-note');
      n.classList.toggle('show');
    });
    row.appendChild(noteToggle);

    const noteWrap = document.createElement('div');
    noteWrap.className = 'task-note';
    if (task.note) noteWrap.classList.add('show');
    const ta = document.createElement('textarea');
    ta.placeholder = 'notas, lo que faltó, contexto, informe...';
    ta.value = task.note || '';
    ta.addEventListener('blur', () => {
      if (ta.value !== task.note) updateTask(task.id, { note: ta.value });
    });
    noteWrap.appendChild(ta);
    const delRow = document.createElement('div');
    delRow.className = 'delete-row';
    const del = document.createElement('button');
    del.textContent = 'eliminar tarea';
    del.addEventListener('click', () => {
      if (confirm(`¿eliminar "${task.name}"? se perderá su log.`)) deleteTask(task.id);
    });
    delRow.appendChild(del);
    noteWrap.appendChild(delRow);
    row.appendChild(noteWrap);

    row.addEventListener('dragstart', e => {
      row.classList.add('dragging');
      e.dataTransfer.setData('text/plain', task.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      const srcId = e.dataTransfer.getData('text/plain');
      if (!srcId || srcId === task.id) return;
      const src = state.tasks.find(t => t.id === srcId);
      if (!src) return;
      const srcIdx = state.tasks.indexOf(src);
      let dstIdx = state.tasks.indexOf(task);
      state.tasks.splice(srcIdx, 1);
      if (srcIdx < dstIdx) dstIdx -= 1;
      state.tasks.splice(dstIdx, 0, src);
      reorderTasks();
      saveState();
      render();
    });

    list.appendChild(row);
  });
}

function renderSessionControls() {
  const btnStart = document.getElementById('btn-start-session');
  const btnPause = document.getElementById('btn-pause-session');
  const btnResume = document.getElementById('btn-resume-session');
  const btnEnd = document.getElementById('btn-end-session');
  [btnStart, btnPause, btnResume, btnEnd].forEach(b => b.classList.add('hidden'));
  if (!state.sessionTimer.started) {
    btnStart.classList.remove('hidden');
  } else if (state.sessionTimer.ended) {
    // ended: no active controls (reset is in header)
  } else if (state.sessionTimer.isPaused) {
    btnResume.classList.remove('hidden');
    btnEnd.classList.remove('hidden');
  } else {
    btnPause.classList.remove('hidden');
    btnEnd.classList.remove('hidden');
  }
}

/* ==========================================================================
   VISUALIZATION
   ========================================================================== */
function renderVisualization() {
  const sec = document.getElementById('viz-section');
  if (!state.sessionTimer.started) { sec.classList.add('hidden'); return; }
  sec.classList.remove('hidden');
  renderGantt();
  renderDistribution();
  renderStats();
}

function renderGantt() {
  const svg = document.getElementById('gantt-svg');
  const tasks = state.tasks;
  if (!tasks.length) { svg.innerHTML = ''; return; }

  const t0 = state.createdAt ? new Date(state.createdAt).getTime()
                             : new Date(state.sessionTimer.startedAt).getTime();
  const tEnd = state.sessionTimer.ended
    ? new Date(state.lastModified).getTime()
    : now();
  const totalMs = Math.max(1, tEnd - t0);

  const rowH = 26, gap = 4;
  const padLeft = 150, padRight = 20, padTop = 24, padBottom = 12;
  const width = Math.max(svg.parentElement.clientWidth, 600);
  const innerW = width - padLeft - padRight;
  const height = padTop + padBottom + tasks.length * (rowH + gap);

  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  let html = '';

  // Rhythm breaks behind everything
  if (state.rhythm.logCycles && state.rhythm.cycleLog.length) {
    state.rhythm.cycleLog.forEach(c => {
      if (c.phase === 'short' || c.phase === 'long') {
        const s = new Date(c.startedAt).getTime();
        const e = new Date(c.endedAt).getTime();
        const x1 = padLeft + (s - t0) / totalMs * innerW;
        const x2 = padLeft + (e - t0) / totalMs * innerW;
        const w = Math.max(1, x2 - x1);
        html += `<rect x="${x1}" y="${padTop}" width="${w}" height="${tasks.length*(rowH+gap) - gap}" fill="#c8c8c4" opacity="0.3"/>`;
      }
    });
  }

  // Time axis
  const ticks = 6;
  for (let i = 0; i <= ticks; i++) {
    const x = padLeft + (innerW * i / ticks);
    const tMs = totalMs * i / ticks;
    html += `<line x1="${x}" y1="${padTop}" x2="${x}" y2="${height - padBottom}" stroke="#ececec" stroke-width="1"/>`;
    html += `<text x="${x}" y="${padTop - 8}" font-size="9" fill="#888" font-family="monospace" text-anchor="middle">${fmtShort(tMs)}</text>`;
  }

  // Rows
  tasks.forEach((task, idx) => {
    const y = padTop + idx * (rowH + gap);
    const label = task.name.length > 20 ? task.name.slice(0, 19) + '…' : task.name;
    html += `<text x="${padLeft - 8}" y="${y + rowH/2 + 4}" font-size="11" fill="#1a1a1a" font-family="monospace" text-anchor="end">${escapeXml(label)}</text>`;
    html += `<rect x="${padLeft}" y="${y}" width="${innerW}" height="${rowH}" fill="#fafafa" stroke="#ececec"/>`;

    // Estimate: gray baseline from first start
    if (task.estimateMin && task.intervals.length) {
      const first = new Date(task.intervals[0].start).getTime();
      const estEnd = first + task.estimateMin * 60 * 1000;
      const x1 = padLeft + (first - t0) / totalMs * innerW;
      const x2 = padLeft + (estEnd - t0) / totalMs * innerW;
      if (x2 > x1) {
        html += `<rect x="${x1}" y="${y+rowH-3}" width="${Math.max(1,x2-x1)}" height="2" fill="#bcbcbc"/>`;
      }
    }

    // Intervals
    task.intervals.forEach(iv => {
      const s = new Date(iv.start).getTime();
      const e = iv.end ? new Date(iv.end).getTime() : now();
      const x1 = padLeft + (s - t0) / totalMs * innerW;
      const x2 = padLeft + (e - t0) / totalMs * innerW;
      const w = Math.max(1, x2 - x1);
      const isActive = task.id === state.activeTaskId && !iv.end;
      const color = isActive ? '#c94630' : '#1a1a1a';
      html += `<rect x="${x1}" y="${y+3}" width="${w}" height="${rowH-6}" fill="${color}" opacity="0.85"/>`;
    });
  });

  svg.innerHTML = html;
}

function renderDistribution() {
  const bar = document.getElementById('distribution-bar');
  const legend = document.getElementById('dist-legend');
  bar.innerHTML = '';
  legend.innerHTML = '';
  const total = state.tasks.reduce((a, t) => a + computeTaskMs(t), 0);
  if (total === 0) {
    bar.innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#888;font-size:11px;">sin tiempo registrado aún</div>';
    return;
  }
  const colors = ['#1a1a1a','#3a5a7a','#3a7a42','#b58b1e','#a04040','#666','#8a3a7a','#5a8a7a','#8a7a3a','#3a8a8a','#5a3a7a','#7a5a3a'];
  state.tasks.forEach((task, i) => {
    const ms = computeTaskMs(task);
    if (ms === 0) return;
    const pct = (ms / total) * 100;
    const color = colors[i % colors.length];
    const seg = document.createElement('div');
    seg.className = 'dist-segment';
    seg.style.width = pct + '%';
    seg.style.background = color;
    seg.title = `${task.name} · ${fmtShort(ms)} · ${pct.toFixed(1)}%`;
    if (pct > 8) seg.textContent = pct.toFixed(0) + '%';
    bar.appendChild(seg);

    const li = document.createElement('div');
    li.className = 'dist-legend-item';
    const sw = document.createElement('span');
    sw.className = 'dist-legend-swatch';
    sw.style.background = color;
    li.appendChild(sw);
    li.appendChild(document.createTextNode(`${task.name} · ${fmtShort(ms)}`));
    legend.appendChild(li);
  });
}

function renderStats() {
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = '';
  const sessionMs = computeSessionMs();
  const workedMs = state.tasks.reduce((a,t) => a + computeTaskMs(t), 0);
  const idle = Math.max(0, sessionMs - workedMs);
  const counts = { done: 0, advanced: 0, notDone: 0, pending: 0, inProgress: 0 };
  state.tasks.forEach(t => counts[t.status]++);
  const items = [
    ['tiempo total',  fmtTime(sessionMs)],
    ['tiempo activo', fmtTime(workedMs)],
    ['sin tarea',     fmtTime(idle)],
    ['tareas',        state.tasks.length],
    [state.stateLabels.done,     counts.done],
    [state.stateLabels.advanced, counts.advanced],
    [state.stateLabels.notDone,  counts.notDone]
  ];
  items.forEach(([label, value]) => {
    const d = document.createElement('div');
    d.className = 'stat';
    const lb = document.createElement('div');
    lb.className = 'stat-label'; lb.textContent = label;
    const vl = document.createElement('div');
    vl.className = 'stat-value'; vl.textContent = value;
    d.appendChild(lb); d.appendChild(vl);
    grid.appendChild(d);
  });
}

/* ==========================================================================
   IMPORT / EXPORT
   ========================================================================== */
function exportJSON() {
  saveState();
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  downloadBlob(blob, makeFilename('json'));
}

function exportTXT() {
  saveState();
  const lines = [];
  const start = state.createdAt || state.sessionTimer.startedAt;
  lines.push('SESIÓN DE TRABAJO');
  lines.push('=================');
  lines.push(`iniciada: ${fmtDate(start)}`);
  lines.push(`duración total: ${fmtTime(computeSessionMs())}`);
  lines.push(`modo de ritmo: ${state.rhythm.type}`);
  lines.push(`estado: ${state.sessionTimer.ended ? 'terminada' : (state.sessionTimer.isPaused ? 'en pausa' : 'en curso')}`);
  lines.push('');
  lines.push('TAREAS');
  lines.push('------');
  state.tasks.forEach((t, i) => {
    const ms = computeTaskMs(t);
    const label = state.stateLabels[t.status] || t.status;
    const est = t.estimateMin ? ` · estimado ${t.estimateMin}m` : '';
    lines.push(`${String(i+1).padStart(2,'0')}. ${t.name}`);
    lines.push(`    estado: ${label} · tiempo: ${fmtTime(ms)}${est}`);
    if (t.intervals.length) lines.push(`    intervalos: ${t.intervals.length}`);
    if (t.note && t.note.trim()) {
      lines.push('    nota:');
      t.note.split('\n').forEach(l => lines.push('      ' + l));
    }
    lines.push('');
  });
  if (state.rhythm.logCycles && state.rhythm.cycleLog.length) {
    lines.push('CICLOS DE RITMO');
    lines.push('---------------');
    state.rhythm.cycleLog.forEach(c => {
      lines.push(`${c.phase} #${c.cycle} · ${fmtDate(c.startedAt)} → ${fmtDate(c.endedAt)}`);
    });
    lines.push('');
  }
  lines.push('RESUMEN');
  lines.push('-------');
  const counts = { done: 0, advanced: 0, notDone: 0, pending: 0, inProgress: 0 };
  state.tasks.forEach(t => counts[t.status]++);
  Object.keys(counts).forEach(k => {
    if (counts[k]) lines.push(`  ${state.stateLabels[k]}: ${counts[k]}`);
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  downloadBlob(blob, makeFilename('txt'));
}

function makeFilename(ext) {
  const d = new Date(state.createdAt || now());
  const stamp = d.toISOString().slice(0,16).replace(/[:T]/g, '-');
  return `sesion-${stamp}.${ext}`;
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importJSON(fileContent) {
  try {
    const parsed = JSON.parse(fileContent);
    if (!parsed.tasks || !parsed.sessionId) {
      alert('archivo JSON no reconocido como sesión válida');
      return;
    }
    pendingImport = parsed;
    const d = new Date(parsed.createdAt || parsed.lastModified);
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    const info = document.getElementById('import-info');
    info.innerHTML =
      `fecha original: <strong>${fmtDate(parsed.createdAt || parsed.lastModified)}</strong><br>` +
      `tareas: ${parsed.tasks.length}<br>` +
      `estado: ${parsed.sessionTimer && parsed.sessionTimer.ended ? 'terminada' : 'en curso / pausada'}<br><br>` +
      (sameDay
        ? 'es del día de hoy. puedes continuarla.'
        : 'no es de hoy. puedes continuarla tal cual (se reanuda donde quedó), o usarla como plantilla para una sesión nueva.');
    document.getElementById('import-modal').classList.add('show');
  } catch (e) {
    alert('no se pudo leer el archivo: ' + e.message);
  }
}

function applyImportContinue() {
  if (!pendingImport) return;
  const p = pendingImport;
  state = { ...freshState(), ...p };
  state.sessionTimer = { ...freshState().sessionTimer, ...(p.sessionTimer || {}) };
  state.rhythm = { ...freshState().rhythm, ...(p.rhythm || {}) };
  state.stateLabels = { ...DEFAULT_STATE_LABELS, ...(p.stateLabels || {}) };
  // Always arrive paused, user decides when to resume
  if (state.sessionTimer.started && !state.sessionTimer.ended && !state.sessionTimer.isPaused) {
    if (state.activeTaskId) {
      const t = state.tasks.find(x => x.id === state.activeTaskId);
      if (t && t.intervals.length) {
        const last = t.intervals[t.intervals.length - 1];
        if (!last.end) last.end = state.lastModified;
      }
    }
    const elapsed = new Date(state.lastModified).getTime() - new Date(state.sessionTimer.startedAt).getTime();
    state.sessionTimer.accumulatedMs += Math.max(0, elapsed);
    state.sessionTimer.isPaused = true;
    state.sessionTimer.pausedAt = state.lastModified;
  }
  closeImportModal();
  saveState();
  render();
}

function applyImportTemplate() {
  if (!pendingImport) return;
  const tasks = (pendingImport.tasks || []).map((t, i) => ({
    id: crypto.randomUUID(),
    name: t.name,
    order: i,
    status: 'pending',
    estimateMin: t.estimateMin || null,
    note: '',
    accumulatedMs: 0,
    intervals: []
  }));
  state = freshState();
  state.tasks = tasks;
  state.stateLabels = { ...DEFAULT_STATE_LABELS, ...(pendingImport.stateLabels || {}) };
  closeImportModal();
  saveState();
  render();
}

function closeImportModal() {
  pendingImport = null;
  document.getElementById('import-modal').classList.remove('show');
}

/* ==========================================================================
   SETTINGS
   ========================================================================== */
function openSettings() {
  const editor = document.getElementById('states-editor');
  editor.innerHTML = '';
  Object.keys(state.stateLabels).forEach(key => {
    const row = document.createElement('div');
    row.className = 'state-edit-row';
    const label = document.createElement('label');
    label.textContent = key;
    const input = document.createElement('input');
    input.type = 'text';
    input.dataset.key = key;
    input.value = state.stateLabels[key];
    row.appendChild(label);
    row.appendChild(input);
    editor.appendChild(row);
  });
  document.getElementById('settings-modal').classList.add('show');
}

function saveSettings() {
  document.querySelectorAll('#states-editor input').forEach(input => {
    const key = input.dataset.key;
    const v = input.value.trim() || DEFAULT_STATE_LABELS[key];
    state.stateLabels[key] = v;
  });
  document.getElementById('settings-modal').classList.remove('show');
  saveState();
  render();
}

/* ==========================================================================
   WIRING
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  loadState();
  if (state.sessionTimer.started && !state.sessionTimer.ended && !state.sessionTimer.isPaused) {
    startTick();
  }

  document.getElementById('new-task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      addTask(e.target.value);
      e.target.value = '';
    }
  });

  document.getElementById('btn-start-session').addEventListener('click', startSession);
  document.getElementById('btn-pause-session').addEventListener('click', pauseSession);
  document.getElementById('btn-resume-session').addEventListener('click', () => { resumeSession(); startTick(); });
  document.getElementById('btn-end-session').addEventListener('click', endSession);
  document.getElementById('btn-reset').addEventListener('click', resetSession);

  document.getElementById('btn-export-json').addEventListener('click', exportJSON);
  document.getElementById('btn-export-txt').addEventListener('click', exportTXT);
  document.getElementById('btn-import').addEventListener('click', () =>
    document.getElementById('file-input').click()
  );
  document.getElementById('file-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => importJSON(ev.target.result);
    reader.readAsText(f);
    e.target.value = '';
  });
  document.getElementById('import-cancel').addEventListener('click', closeImportModal);
  document.getElementById('import-continue').addEventListener('click', applyImportContinue);
  document.getElementById('import-template').addEventListener('click', applyImportTemplate);

  document.getElementById('btn-settings').addEventListener('click', openSettings);
  document.getElementById('settings-cancel').addEventListener('click', () =>
    document.getElementById('settings-modal').classList.remove('show')
  );
  document.getElementById('settings-save').addEventListener('click', saveSettings);

  document.getElementById('rhythm-mode').addEventListener('change', e => {
    const custom = document.getElementById('rhythm-custom');
    if (e.target.value === 'custom') custom.classList.add('show');
    else custom.classList.remove('show');
  });

  // Pause tick when tab is hidden to reduce drift (timer still accurate via timestamps)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
    } else {
      if (state.sessionTimer.started && !state.sessionTimer.ended && !state.sessionTimer.isPaused && !tickInterval) {
        startTick();
        updateTimerDisplays();
      }
    }
  });

  window.addEventListener('beforeunload', () => { saveState(); });

  render();
});
</script>
</body>
</html>
