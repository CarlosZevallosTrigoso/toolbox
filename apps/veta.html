<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VETA</title>
<style>
/* FORJA clara. Interfaz en monoespaciada; las hojas conservan Times New Roman 12. Tres zonas: estructura, hojas, cifras. */
:root{
  --bg:#ffffff; --ink:#111111; --mute:#6b6b63; --line:#dcdcd4; --soft:#f3f3ee;
  --moss:#586a45; --moss2:#8fa676; --steel:#4f6b82; --orange:#b06a36; --err:#a02a1a;
  --r:2px; --mono:"Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --z:.75;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.45 var(--mono)}
body{display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
button,input,select{font:inherit;color:var(--ink)}
button,select,input[type=number],input[type=text]{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:3px 6px;min-width:0}
button{cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button.prim{background:var(--ink);color:#fff;border-color:var(--ink)}
button.prim:hover:not(:disabled){background:var(--moss);border-color:var(--moss)}
input::placeholder{color:#8b8b82}
input[type=checkbox],input[type=range]{accent-color:var(--moss);margin:0}
:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
input[type=number]{appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{appearance:none;-webkit-appearance:none;margin:0}

header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:15px;letter-spacing:.12em;font-weight:600;user-select:none;cursor:pointer}
header h1:hover{color:var(--moss)}
#volver{color:var(--mute);text-decoration:none}
#volver:hover{color:var(--moss)}
.sub{color:var(--mute)}
#resumen{color:var(--ink);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.grupo-btn{display:flex;gap:4px}

nav{display:none;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;padding:8px 4px;color:var(--mute);border-bottom:2px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--moss)}

.layout{display:grid;grid-template-columns:minmax(360px,430px) minmax(0,1fr) 290px;min-height:0}
body.sin-cifras .layout{grid-template-columns:minmax(360px,430px) minmax(0,1fr)}
body.sin-cifras #cifras{display:none}
#panel,#cifras{overflow-y:auto;min-height:0;padding-bottom:40px}
#panel{border-right:1px solid var(--line)}
#cifras{border-left:1px solid var(--line);padding-inline:14px}
#escena{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0;background:var(--soft)}

h2{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0;font-weight:600}
details.doc{border-bottom:1px solid var(--line);padding:0 14px}
details.doc>summary{cursor:pointer;padding:10px 0;list-style-position:inside}
details.doc>summary h2{display:inline}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding-bottom:12px}
.campo{display:grid;gap:2px;min-width:0}
.campo span{color:var(--mute);font-size:11px}
.campo input{width:100%}
.campo.todo,.nota-fija{grid-column:1/-1}
.nota-fija{color:var(--mute);font-size:11px;margin:0}
fieldset{border:0;padding:0;margin:0;grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
legend{color:var(--mute);font-size:11px;padding:0;margin-bottom:2px}

.est-cab{display:flex;align-items:center;gap:6px;padding:10px 14px;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line)}
.est-cab h2{flex:1}
.leyenda{margin:8px 14px 0;color:var(--mute);font-size:11px}
#avisoEjemplo{margin:6px 14px 0;padding:5px 8px;background:var(--soft);color:#333;font-size:11px;border-radius:var(--r)}
#arbol{padding:6px 10px 0 14px;display:grid;gap:8px}
.vacio{color:var(--mute);padding:14px 4px;margin:0}

.sec{display:grid;gap:4px;min-width:0}
.subs{display:grid;gap:8px;margin-left:8px;padding-left:8px;border-left:1px solid var(--line);margin-top:4px}
.cab{display:grid;grid-template-columns:18px auto minmax(0,1fr) auto;gap:5px;align-items:center;border-radius:var(--r)}
.cab .num{font-weight:600;font-variant-numeric:tabular-nums}
.cab .num:empty{display:none}
.cab input.tit{width:100%;font-weight:600}
.n2 .cab input.tit{font-style:italic}
.n3 .cab input.tit{font-style:italic;font-weight:400}
.plegar{border:0;padding:0;background:none;width:18px;color:var(--mute)}
.stp{display:flex;align-items:center;gap:2px}
.stp input{width:38px;text-align:center}
.stp button{width:22px;padding:3px 0}
.stp .u{color:var(--mute);margin-right:3px}
.cuerpo{display:grid;gap:4px;margin-left:23px}
.aj{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--mute);font-size:11px}
.chk{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.mini{display:inline-flex;align-items:center;gap:3px;color:var(--mute);font-size:11px}
.mini input{width:36px;text-align:right;padding:2px 4px;color:var(--ink);font-size:12px}
.por{color:var(--mute);margin-inline:-5px}
.ops{display:inline-flex;gap:1px;margin-left:auto}
.ops button{border-color:transparent;background:none;padding:1px 4px;color:var(--mute)}
.ops button:hover:not(:disabled){color:var(--ink)}
.blos{display:grid;gap:3px}
.blo{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;padding:4px 4px 4px 6px;border:1px solid var(--line);border-radius:var(--r)}
.tag{min-width:30px;font-weight:600;font-variant-numeric:tabular-nums}
.blo.p .tag{color:var(--moss)} .blo.cita .tag{color:var(--steel)} .blo.fig .tag{color:var(--orange)}
.lect{color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
input.nota{flex:1 1 100%;min-width:0;font-size:11.5px;border-color:transparent;border-bottom-color:var(--line);padding:2px 2px;border-radius:0}
input.nota:focus{border-color:var(--steel)}
.add{display:flex;flex-wrap:wrap;gap:4px}
.add button{font-size:11px;color:var(--mute);padding:2px 6px}
.add button:hover{color:var(--ink)}
.seleccion>.cab,.blo.seleccion,#fBib.seleccion{background:#eef1e8;box-shadow:0 0 0 1px var(--moss2)}
#fBib{border-top:1px solid var(--line);padding:10px 4px 4px;margin-top:4px;display:grid;gap:6px;border-radius:var(--r)}
#fBib .fila{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
#fBib input.tit{flex:1 1 150px;font-weight:600;min-width:0}
#fBib .mini input{width:48px}

.barra{display:flex;flex-wrap:wrap;align-items:center;gap:6px 7px;padding:6px 14px;background:#fff;border-bottom:1px solid var(--line)}
.barra label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
#rangoZoom{width:72px}
#salidaZoom{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
#hojasCaja{overflow:auto;min-height:0;position:relative;padding:14px 8px 40px;overscroll-behavior:contain}
#hojas{text-align:center;font-size:0}
.hoja{display:inline-block;vertical-align:top;margin:6px 8px 12px;font-size:11px;text-align:center}
.lienzo{width:calc(210mm*var(--z));height:calc(297mm*var(--z));background:#fff;box-shadow:0 1px 3px rgba(40,40,30,.28);cursor:pointer}
.lienzo svg{display:block;width:100%;height:100%}
.rotulo{color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
#estado{position:sticky;left:8px;bottom:6px;display:inline-block;font-size:11px;background:rgba(243,243,238,.94);color:var(--mute);padding:2px 6px;border-radius:var(--r);margin-top:8px}
#estado:empty{display:none}
#estado.error{color:var(--err)}

.cifra-g{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.cifra-g:last-child{border-bottom:0}
.dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0;font-variant-numeric:tabular-nums}
.dl dt{color:var(--mute)} .dl dd{margin:0;text-align:right}
.dl .fuerte{color:var(--ink);font-weight:600}
.medidor{height:6px;background:var(--soft);border-radius:var(--r);overflow:hidden}
.medidor i{display:block;height:100%;background:var(--moss)}
.medidor.exceso i{background:var(--orange)}
.meta-txt{margin:0;color:#333}
.dist{display:grid;gap:5px}
.dist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;text-align:left;border:0;background:none;padding:2px;width:100%}
.dist button:hover{background:var(--soft)}
.dist .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist .det{color:var(--mute);font-size:11px;grid-column:1/-1}
.dist .val{font-variant-numeric:tabular-nums}
.dist .pista{grid-column:1/-1;height:4px;background:var(--soft)}
.dist .pista i{display:block;height:100%;background:var(--moss2)}
.dist .niv2{padding-left:10px} .dist .niv3{padding-left:20px}
.avisos{margin:0;padding:0;list-style:none;display:grid;gap:4px;color:var(--orange);font-size:11px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1100px){.sub{display:none}}
@media (pointer:coarse){
  button,select,input[type=number],input[type=text]{min-height:32px}
  .stp button{width:30px}
  .ops button{padding:1px 8px}
}
@media (max-width:860px){
  nav{display:flex}
  .layout,body.sin-cifras .layout{display:block;overflow:hidden}
  #panel,#escena,#cifras{height:100%;border:0}
  body[data-tab=estructura] #escena,body[data-tab=estructura] #cifras,
  body[data-tab=hojas] #panel,body[data-tab=hojas] #cifras,
  body[data-tab=cifras] #panel,body[data-tab=cifras] #escena{display:none}
  body[data-tab=cifras] #cifras{display:block}
  #cifraBtn{display:none}
  header{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  #panel{padding-bottom:60px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* Impresión: cada hoja SVG ocupa una hoja A4 física, sin márgenes añadidos por el navegador. */
@page{size:A4 portrait;margin:0}
@media print{
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  body>:not(.layout),#panel,#cifras,.barra,.rotulo,#estado{display:none!important}
  .layout,body.sin-cifras .layout{display:block!important;overflow:visible}
  #escena,#hojasCaja{display:block!important;overflow:visible;padding:0;background:#fff;height:auto}
  #hojas{display:block;text-align:left}
  .hoja{display:block;margin:0;width:210mm;height:297mm;overflow:hidden;break-after:page;break-inside:avoid;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .hoja:last-child{break-after:auto}
  .lienzo{width:210mm;height:297mm;box-shadow:none}
}
</style>
<style id="estiloSel"></style>
</head>
<body data-tab="hojas">
<header>
  <a id="volver" href="../index.html" title="Volver al toolbox">← toolbox/</a>
  <h1 id="marca" title="Recargar">VETA</h1>
  <span class="sub">Visualizador Estructural de Textos Académicos</span>
  <span id="resumen" aria-live="polite"></span>
  <span class="spacer"></span>
  <span class="grupo-btn">
    <button id="deshacer" type="button" title="Deshacer" aria-label="Deshacer">↶</button>
    <button id="rehacer" type="button" title="Rehacer" aria-label="Rehacer">↷</button>
  </span>
  <button id="cifraBtn" type="button" aria-pressed="true">Cifras</button>
  <span class="grupo-btn">
    <button id="nuevo" type="button">Nuevo</button>
    <button id="abrir" type="button" title="Abrir un documento .json de VETA">Abrir</button>
    <button id="guardar" type="button" title="Descargar el documento como .json">Guardar</button>
  </span>
  <span class="grupo-btn">
    <button id="pdf" type="button" title="Descarga un PDF A4 listo para imprimir a tamaño real">PDF A4</button>
    <button id="imprimir" class="prim" type="button" title="Imprime en A4 al 100 %, sin márgenes añadidos">Imprimir</button>
  </span>
</header>
<nav role="tablist" aria-label="Vistas">
  <button role="tab" type="button" data-tab="estructura" aria-selected="false">Estructura</button>
  <button role="tab" type="button" data-tab="hojas" aria-selected="true">Hojas</button>
  <button role="tab" type="button" data-tab="cifras" aria-selected="false">Cifras</button>
</nav>
<div class="layout">
  <aside id="panel" aria-label="Estructura del documento">
    <details class="doc" id="detDoc">
      <summary><h2>Documento y cálculo</h2></summary>
      <div class="campos" id="camposDoc">
        <label class="campo todo"><span>Título del documento</span><input id="d-titulo" type="text" data-d="titulo" placeholder="Sin título"></label>
        <label class="campo"><span>Oraciones por párrafo</span><input id="d-or" type="number" inputmode="numeric" data-d="p.oraciones" data-lim="oraciones"></label>
        <label class="campo"><span>Palabras por oración</span><input id="d-po" type="number" inputmode="numeric" data-d="p.palabrasOracion" data-lim="palabrasOracion"></label>
        <label class="campo"><span>Palabras por línea</span><input id="d-pl" type="number" inputmode="decimal" step="0.1" data-d="palabrasLinea" data-lim="palabrasLinea"></label>
        <label class="campo"><span>Meta de palabras (cuerpo)</span><input id="d-meta" type="number" inputmode="numeric" data-d="meta" data-lim="meta" placeholder="sin meta"></label>
        <label class="campo"><span>Espacio entre párrafos (pt)</span><input id="d-ep" type="number" inputmode="decimal" data-d="p.espacioParrafo" data-lim="espacioParrafo"></label>
        <label class="campo"><span>Sangría de 1.ª línea (cm)</span><input id="d-sa" type="number" inputmode="decimal" step="0.01" data-d="p.sangria" data-lim="sangria"></label>
        <label class="campo"><span>Antes de título (pt)</span><input id="d-ta" type="number" inputmode="decimal" data-d="p.tituloAntes" data-lim="tituloAntes"></label>
        <label class="campo"><span>Después de título (pt)</span><input id="d-td" type="number" inputmode="decimal" data-d="p.tituloDespues" data-lim="tituloDespues"></label>
        <fieldset>
          <legend>Márgenes (cm): sup., inf., izq., der.</legend>
          <input id="d-ms" type="number" inputmode="decimal" step="0.01" aria-label="Margen superior" data-d="margenes.sup" data-lim="margen">
          <input id="d-mi" type="number" inputmode="decimal" step="0.01" aria-label="Margen inferior" data-d="margenes.inf" data-lim="margen">
          <input id="d-ml" type="number" inputmode="decimal" step="0.01" aria-label="Margen izquierdo" data-d="margenes.izq" data-lim="margen">
          <input id="d-mr" type="number" inputmode="decimal" step="0.01" aria-label="Margen derecho" data-d="margenes.der" data-lim="margen">
        </fieldset>
        <p class="nota-fija" id="notaGeo"></p>
      </div>
    </details>
    <div class="est-cab">
      <h2>Estructura</h2>
      <button id="plegarTodo" type="button">Plegar</button>
      <button id="desplegarTodo" type="button">Desplegar</button>
      <button id="agregarSec" type="button">+ Sección</button>
    </div>
    <p class="leyenda">¶ oraciones × palabras por oración. Un campo vacío hereda el valor de arriba.</p>
    <p id="avisoEjemplo" hidden>Documento de ejemplo. Edítalo o pulsa Nuevo para empezar el tuyo.</p>
    <div id="arbol"></div>
  </aside>
  <main id="escena">
    <div class="barra" role="toolbar" aria-label="Vista de las hojas">
      <span class="grupo-btn">
        <button id="zMenos" type="button" aria-label="Reducir">−</button>
        <input id="rangoZoom" type="range" min="25" max="200" step="5" aria-label="Tamaño de las hojas en porcentaje">
        <button id="zMas" type="button" aria-label="Ampliar">+</button>
      </span>
      <output id="salidaZoom" for="rangoZoom"></output>
      <span class="grupo-btn">
        <button id="zAncho" type="button" title="Ajustar al ancho de la zona">Ancho</button>
        <button id="zHoja" type="button" title="Ver una hoja completa">Hoja</button>
        <button id="z100" type="button" title="Tamaño real">100 %</button>
      </span>
      <select id="v-estilo" data-v="estilo" aria-label="Estilo de los párrafos">
        <option value="barras">Barras</option>
        <option value="lineas">Líneas</option>
      </select>
      <label><input id="v-notas" type="checkbox" data-v="notas">Notas</label>
      <label><input id="v-cortes" type="checkbox" data-v="cortes">Oraciones</label>
      <label><input id="v-marcas" type="checkbox" data-v="marcas">Marcas</label>
      <label><input id="v-pie" type="checkbox" data-v="pie">Pie</label>
    </div>
    <div id="hojasCaja" tabindex="0" aria-label="Hojas A4">
      <div id="hojas"></div>
      <div id="estado" role="status" aria-live="polite"></div>
    </div>
  </main>
  <aside id="cifras" aria-label="Cifras del documento"></aside>
</div>
<input id="archivo" class="sr" type="file" accept=".json,application/json" tabindex="-1" aria-hidden="true">

  document.querySelector('.barra').addEventListener('change', e => {
    const k = e.target.dataset.v; if (!k) return;
    doc.vista[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    recalcular(); confirmar();
  });

  // ---------- zoom ----------
  function fijarZoom(v, guardar = true) {
    z = Math.min(ZMAX, Math.max(ZMIN, v));
    document.documentElement.style.setProperty('--z', z.toFixed(4));
    $('#rangoZoom').value = Math.round(z * 100); $('#salidaZoom').textContent = Math.round(z * 100) + ' %';
    if (guardar) guardarLuego();
  }
  const paso = d => fijarZoom((Math.round(z * 20) + d) / 20);
  $('#rangoZoom').addEventListener('input', e => fijarZoom(+e.target.value / 100));
  $('#zMenos').addEventListener('click', () => paso(-1));
  $('#zMas').addEventListener('click', () => paso(1));
  $('#z100').addEventListener('click', () => fijarZoom(1));
  const ajusteAncho = () => ($('#hojasCaja').clientWidth - 16 - 16 - 2) / PX_A4;
  $('#zAncho').addEventListener('click', () => fijarZoom(ajusteAncho()));
  $('#zHoja').addEventListener('click', () => fijarZoom(($('#hojasCaja').clientHeight - 80) / PY_A4));
  $('#hojasCaja').addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault(); paso(e.deltaY > 0 ? -1 : 1);
  }, { passive: false });
  $('#hojas').addEventListener('click', e => {
    const g = e.target.closest('g[data-id]'); if (!g) return;
    const id = g.dataset.id;
    if (id === 'titulo') { $('#detDoc').open = true; $('#d-titulo').focus(); return; }
    irA(id); if (document.body.dataset.tab !== 'hojas') return;
  });
  $('#cifras').addEventListener('click', e => {
    const b = e.target.closest('[data-ir]'); if (!b) return;
    irA(b.dataset.ir, 'hoja');
  });

  // ---------- archivos e impresión ----------
  const nombre = () => (String(doc.titulo || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'documento') + '-veta';
  function descargar(partes, tipo, archivo) {
    const url = URL.createObjectURL(new Blob(partes, { type: tipo })), a = document.createElement('a');
    a.href = url; a.download = archivo; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  $('#guardar').addEventListener('click', () => { descargar([JSON.stringify(doc, null, 1)], 'application/json', nombre() + '.json'); estado('Documento descargado.'); });
  $('#abrir').addEventListener('click', () => $('#archivo').click());
  $('#archivo').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const d = C.normalizar(JSON.parse(await f.text()));
      doc = d; cerrados.clear(); sel = null; pintarTodo(); confirmar();
      estado(`Abierto: ${f.name}. Puedes deshacer para volver al anterior.`);
    } catch (err) { estado(err instanceof SyntaxError ? 'Ese archivo no es un JSON válido.' : err.message, true); }
  });
  $('#nuevo').addEventListener('click', () => {
    doc = C.docNuevo(); C.agregarSeccion(doc, null); cerrados.clear(); sel = null; pintarTodo(); confirmar();
    estado('Documento nuevo. Puedes deshacer para recuperar el anterior.');
  });
  $('#pdf').addEventListener('click', () => {
    descargarPendiente();
    try {
      const b = C.aPDF(C.dibujar(calc, doc), calc.g, String(doc.titulo || 'VETA').trim() || 'VETA');
      descargar([b], 'application/pdf', nombre() + '.pdf');
      estado(`PDF A4 descargado: ${calc.paginas.length} hojas. Imprímelo a tamaño real (100 %).`);
    } catch (err) { estado('No se pudo generar el PDF: ' + err.message, true); }
  });
  $('#imprimir').addEventListener('click', () => { descargarPendiente(); window.print(); });
  let tituloPagina = document.title;
  window.addEventListener('beforeprint', () => { descargarPendiente(); tituloPagina = document.title; document.title = String(doc.titulo || '').trim() || 'VETA'; });
  window.addEventListener('afterprint', () => { document.title = tituloPagina; });

  // ---------- generales ----------
  $('#marca').addEventListener('click', () => location.reload());
  $('#deshacer').addEventListener('click', () => viajar(-1));
  $('#rehacer').addEventListener('click', () => viajar(1));
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return; // deshacer nativo del campo
    e.preventDefault(); viajar(e.shiftKey ? 1 : -1);
  });
  document.querySelector('nav').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    document.body.dataset.tab = b.dataset.tab;
    document.querySelectorAll('nav [data-tab]').forEach(x => x.setAttribute('aria-selected', x === b));
  });
  $('#cifraBtn').addEventListener('click', e => {
    const oculto = document.body.classList.toggle('sin-cifras');
    e.target.setAttribute('aria-pressed', !oculto);
  });
  window.addEventListener('pagehide', () => {
    clearTimeout(tGuardar);
    try { localStorage.setItem(CLAVE, JSON.stringify({ doc, z })); } catch (e) { /* sin almacenamiento */ }
  });

  // ---------- arranque ----------
  function iniciar() {
    const g = leerAlmacen(); let zGuardado = null;
    try { if (g && g.doc) { doc = C.normalizar(g.doc); if (Number.isFinite(g.z)) zGuardado = g.z; } } catch (e) { doc = null; }
    if (!doc) doc = C.docEjemplo();
    if (innerWidth < 1280) { document.body.classList.add('sin-cifras'); $('#cifraBtn').setAttribute('aria-pressed', 'false'); }
    pintarTodo();
    fijarZoom(zGuardado ?? (innerWidth <= 860 ? ajusteAncho() : .75), false);
    if (zGuardado === null && innerWidth <= 860) requestAnimationFrame(() => fijarZoom(ajusteAncho(), false));
    confirmar();
  }
  iniciar();
})();

</script>
</body>
</html>
