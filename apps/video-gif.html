<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORJA · video a gif</title>
<style>
  :root{
    --bg:#16170f;
    --panel:#1f2017;
    --line:#33352a;
    --ink:#d8d6c4;
    --ink-dim:#8a8c78;
    --accent:#8fa676;
    --accent-dim:#5c6b4b;
    --warn:#c08a5a;
    --mono: ui-monospace, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--mono); font-size:12px; line-height:1.5;
    display:flex; min-height:100vh;
  }
  #stage{
    flex:1; min-width:0; display:flex; align-items:center; justify-content:center;
    padding:24px; position:relative; overflow:auto;
    background:repeating-linear-gradient(45deg, #00000000 0 12px, #ffffff05 12px 13px);
  }
  #drop{
    border:1px dashed var(--line); border-radius:2px;
    width:min(560px,90%); aspect-ratio:16/9;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--ink-dim); cursor:pointer; text-align:center; padding:24px;
    transition:border-color .15s, color .15s;
  }
  #drop.hot{border-color:var(--accent); color:var(--ink)}
  #drop b{color:var(--ink); font-weight:600; letter-spacing:.02em}
  #drop small{max-width:36ch}
  #vid, #gifimg{
    max-width:100%; max-height:calc(100vh - 48px);
    box-shadow:0 1px 0 #0006, 0 8px 30px #0008; display:none; border-radius:2px;
  }
  #busy{
    position:absolute; inset:0; display:none; flex-direction:column; gap:10px;
    align-items:center; justify-content:center;
    background:#16170fdd; color:var(--accent); letter-spacing:.08em;
    text-transform:uppercase; font-size:11px;
  }
  #busy.on{display:flex}
  #bar{width:min(300px,70%); height:2px; background:var(--line)}
  #bar i{display:block; height:100%; width:0%; background:var(--accent)}

  #panel{
    width:300px; flex:none; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; height:100vh;
  }
  #panel header{padding:14px 16px 10px; border-bottom:1px solid var(--line)}
  #panel header h1{
    margin:0; font-size:12px; font-weight:600; letter-spacing:.18em;
    color:var(--ink); cursor:pointer;
  }
  #panel header p{margin:4px 0 0; color:var(--ink-dim); font-size:11px}
  .scroll{overflow-y:auto; padding:6px 0 16px; flex:1}
  .stage-block{border-bottom:1px solid var(--line); padding:12px 16px}
  .stage-num{display:flex; align-items:baseline; gap:8px; margin-bottom:8px; color:var(--ink-dim)}
  .stage-num .n{color:var(--accent); font-weight:600}
  .stage-num .arrow{color:var(--line)}
  .stage-num .t{color:var(--ink); letter-spacing:.06em; text-transform:uppercase; font-size:10px}
  label.field{display:block; margin:8px 0}
  label.field > span{display:block; color:var(--ink-dim); margin-bottom:3px; font-size:11px}
  input[type=number]{
    width:100%; background:#12130c; color:var(--ink); border:1px solid var(--line);
    border-radius:2px; padding:6px; font-family:var(--mono); font-size:12px;
  }
  input[type=number]:focus{outline:1px solid var(--accent); border-color:var(--accent)}
  .duo{display:flex; gap:8px}
  .duo label{flex:1}
  .inline{display:flex; align-items:center; gap:8px; justify-content:space-between}
  .val{color:var(--accent); font-variant-numeric:tabular-nums; min-width:6ch; text-align:right}
  .check{display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--ink); margin:8px 0}
  .check input{accent-color:var(--accent)}
  .hint{color:var(--ink-dim); font-size:10px; margin-top:6px; line-height:1.4}
  .hint.warn{color:var(--warn)}
  #actions{padding:12px 16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
  button{
    font-family:var(--mono); font-size:12px; letter-spacing:.04em; cursor:pointer;
    border-radius:2px; padding:8px 10px; border:1px solid var(--line);
    background:#12130c; color:var(--ink); transition:border-color .12s, color .12s;
  }
  button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
  button:disabled{opacity:.4; cursor:default}
  button.primary{background:var(--accent-dim); border-color:var(--accent-dim); color:#0e0f08; font-weight:600}
  button.primary:hover:not(:disabled){background:var(--accent); border-color:var(--accent); color:#0e0f08}
  .btnrow{display:flex; gap:8px}
  .btnrow button{flex:1}
  .meta{color:var(--ink-dim); font-size:10px; text-align:center; min-height:14px}
  .hide{display:none !important}
  @media (max-width:760px){
    body{flex-direction:column}
    #panel{width:100%; height:auto; order:2; border-left:none; border-top:1px solid var(--line)}
    #stage{order:1; min-height:50vh}
  }
</style>
</head>
<body>
  <main id="stage">
    <div id="drop" tabindex="0" role="button" aria-label="Cargar video">
      <b>Suelta un video</b>
      <small>MP4 o MOV (H.264/VP9). Se convierte en tu navegador; nada sale de tu equipo.</small>
    </div>
    <video id="vid" controls muted playsinline></video>
    <img id="gifimg" alt="GIF resultante">
    <div id="busy"><span id="busy-t">capturando…</span><div id="bar"><i id="bar-i"></i></div></div>
    <input type="file" id="file" accept="video/mp4,video/quicktime,video/webm,video/*" class="hide">
  </main>

  <aside id="panel">
    <header>
      <h1 id="brand">GIF·FORJA</h1>
      <p>video convertido en gif</p>
    </header>
    <div class="scroll">

      <section class="stage-block">
        <div class="stage-num"><span class="n">01</span><span class="arrow">›</span><span class="t">Recorte · qué tramo</span></div>
        <div class="duo">
          <label class="field"><span>inicio (s)</span><input type="number" id="t0" min="0" step="0.1" value="0" inputmode="decimal"></label>
          <label class="field"><span>fin (s)</span><input type="number" id="t1" min="0" step="0.1" value="3" inputmode="decimal"></label>
        </div>
        <div class="btnrow">
          <button id="set0" disabled>⌖ inicio aquí</button>
          <button id="set1" disabled>fin aquí ⌖</button>
        </div>
        <div class="hint" id="dur-hint">Mueve el video al punto deseado con su propia barra y fija inicio/fin con los botones, o escribe los segundos.</div>
      </section>

      <section class="stage-block">
        <div class="stage-num"><span class="n">02</span><span class="arrow">›</span><span class="t">Salida · cómo sale</span></div>
        <div class="duo">
          <label class="field"><span>fps (5–30)</span><input type="number" id="fps" min="5" max="30" step="1" value="12" inputmode="numeric"></label>
          <label class="field"><span>ancho (px)</span><input type="number" id="wpx" min="80" step="10" value="480" inputmode="numeric"></label>
        </div>
        <label class="check"><input type="checkbox" id="dith" checked> dithering (suaviza degradados)</label>
        <div class="hint" id="est">—</div>
      </section>

    </div>

    <div id="actions">
      <button id="make" class="primary" disabled>generar gif</button>
      <div class="btnrow">
        <button id="dl" disabled>descargar</button>
        <button id="back" disabled>volver al video</button>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </aside>

'use strict';
// ============================================================
// GIF·FORJA — núcleo puro (sin DOM). Testeable en Node.
// ============================================================

// Matriz Bayer 4x4 normalizada a [-0.5, 0.5)
const BAYER4 = [
  [ 0,  8,  2, 10],
  [12,  4, 14,  6],
  [ 3, 11,  1,  9],
  [15,  7, 13,  5],
];

// Dither ordenado: perturba RGB antes de cuantizar. Muta una copia, no el input.
// strength en niveles de 8 bits (típico: 8–24). 0 = sin dither.
function ditherOrdered(rgba, w, h, strength) {
  const out = new Uint8ClampedArray(rgba);
  if (!strength) return out;
  for (let y = 0; y < h; y++) {
    const row = BAYER4[y & 3];
    for (let x = 0; x < w; x++) {
      const t = (row[x & 3] / 16 - 0.46875) * strength; // centrado en ~0
      const p = (y * w + x) * 4;
      out[p]     = out[p]     + t;
      out[p + 1] = out[p + 1] + t;
      out[p + 2] = out[p + 2] + t;
      // alpha intacto
    }
  }
  return out;
}

// Planifica los instantes de captura y el delay por frame.
// start/end en segundos (end exclusivo del último instante si cae fuera), fps > 0.
// Devuelve { times: number[], delayMs: number } o lanza si el rango es inválido.
function planFrames(start, end, fps, maxFrames) {
  if (!(fps > 0)) throw new Error('fps debe ser > 0');
  if (!(end > start)) throw new Error('el fin debe ser mayor que el inicio');
  const delayMs = 1000 / fps;
  const span = end - start;
  let n = Math.max(1, Math.floor(span * fps));
  if (maxFrames && n > maxFrames) n = maxFrames;
  const times = new Array(n);
  for (let i = 0; i < n; i++) times[i] = start + i / fps;
  return { times, delayMs };
}

// Dimensiones de salida: ancho objetivo, alto derivado del aspecto, ambos pares≥2.
function outDims(srcW, srcH, targetW) {
  if (!(srcW > 0 && srcH > 0)) throw new Error('dimensiones de origen inválidas');
  const w = Math.max(2, Math.min(Math.round(targetW), srcW));
  const h = Math.max(2, Math.round(w * srcH / srcW));
  return { w, h };
}

// Estimación grosera de peso final (bytes): frames * píxeles * bits LZW promedio.
// Solo orientativa; el LZW real varía con el contenido.
function estimateBytes(w, h, nFrames) {
  return Math.round(nFrames * w * h * 0.45) + 800;
}


/* ============================================================
   Hilo principal
   ============================================================ */
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const stage=$('stage'), drop=$('drop'), fileInput=$('file'), vid=$('vid'),
        gifimg=$('gifimg'), busy=$('busy'), busyT=$('busy-t'), barI=$('bar-i'),
        meta=$('meta'), est=$('est'), durHint=$('dur-hint');
  const ui = { t0:$('t0'), t1:$('t1'), fps:$('fps'), wpx:$('wpx'), dith:$('dith') };
  const MAX_FRAMES = 900;          // tope duro de memoria/tiempo
  const DITHER_STRENGTH = 12;      // niveles de 8 bits

  let srcW=0, srcH=0, duration=0, gifBlob=null, working=false;

  $('brand').addEventListener('click', ()=> location.reload());

  // ---------- utilidades UI ----------
  const fmt1 = (n)=> (Math.round(n*10)/10).toFixed(1);
  function setBusy(on, txt){ busyT.textContent = txt||'capturando…'; busy.classList.toggle('on', !!on); if(!on) barI.style.width='0%'; }
  function progress(p){ barI.style.width = Math.round(p*100)+'%'; }
  function fmtBytes(b){ return b < 1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB'; }

  // ---------- configuración autocorrectiva ----------
  // Lee los inputs, corrige silenciosamente lo inválido (vacío, fuera de rango,
  // fin<=inicio) y devuelve valores siempre usables. La exportación nunca se
  // bloquea por un valor mal escrito: se corrige y se refleja en la UI.
  const clamp = (n, lo, hi)=> Math.min(hi, Math.max(lo, n));
  function readConfig(){
    let t0 = parseFloat(ui.t0.value); if(!isFinite(t0)) t0 = 0;
    let t1 = parseFloat(ui.t1.value); if(!isFinite(t1)) t1 = duration || 3;
    let fps = parseInt(ui.fps.value, 10); if(!isFinite(fps)) fps = 12;
    let wpx = parseInt(ui.wpx.value, 10); if(!isFinite(wpx)) wpx = 480;
    if(duration){
      t0 = clamp(t0, 0, Math.max(0, duration - 0.1));
      t1 = clamp(t1, t0 + 0.1, duration);
    }else if(t1 <= t0){ t1 = t0 + 0.1; }
    fps = clamp(fps, 5, 30);
    wpx = clamp(wpx, 80, srcW || 1920);
    return { t0, t1, fps, wpx, dith: ui.dith.checked };
  }
  // vuelca la config corregida de vuelta a los inputs
  function reflect(cfg){
    ui.t0.value = fmt1(cfg.t0); ui.t1.value = fmt1(cfg.t1);
    ui.fps.value = cfg.fps; ui.wpx.value = cfg.wpx;
  }

  function updateEstimate(){
    if(!duration){ est.className='hint'; est.textContent='—'; return; }
    const cfg = readConfig();
    const { times } = planFrames(cfg.t0, cfg.t1, cfg.fps, MAX_FRAMES);
    const { w, h } = outDims(srcW, srcH, cfg.wpx);
    const bytes = estimateBytes(w, h, times.length);
    const capped = times.length===MAX_FRAMES ? ' (tope '+MAX_FRAMES+' frames)' : '';
    est.className = bytes > 30*1048576 ? 'hint warn' : 'hint';
    est.textContent = times.length+' frames · '+w+'×'+h+' px · ~'+fmtBytes(bytes)+' estimado'+capped;
  }

  [ui.t0, ui.t1, ui.fps, ui.wpx, ui.dith].forEach(el=> el.addEventListener('input', updateEstimate));

  // fijar recorte desde el punto actual del reproductor
  $('set0').addEventListener('click', ()=>{
    ui.t0.value = fmt1(vid.currentTime);
    if(parseFloat(ui.t1.value) <= vid.currentTime) ui.t1.value = fmt1(Math.min(duration, vid.currentTime + 1));
    updateEstimate();
  });
  $('set1').addEventListener('click', ()=>{
    ui.t1.value = fmt1(vid.currentTime);
    if(parseFloat(ui.t0.value) >= vid.currentTime) ui.t0.value = fmt1(Math.max(0, vid.currentTime - 1));
    updateEstimate();
  });

  // ---------- carga ----------
  function loadFile(file){
    if(!file){ return; }
    if(!/^video\//.test(file.type) && !/\.(mp4|mov|m4v|webm)$/i.test(file.name)){
      meta.textContent='Eso no parece un video.'; return;
    }
    const url = URL.createObjectURL(file);
    // loadeddata (no loadedmetadata): garantiza dimensiones y primer frame
    // decodificado; en Safari con MOV, videoWidth puede ser 0 en loadedmetadata.
    vid.onloadeddata = ()=>{
      vid.onloadeddata = null; // una sola vez por carga
      srcW = vid.videoWidth; srcH = vid.videoHeight; duration = vid.duration;
      if(!srcW || !srcH || !isFinite(duration)){
        meta.textContent = 'El navegador no puede decodificar este códec (¿ProRes?). Prueba H.264.';
        URL.revokeObjectURL(url); return;
      }
      drop.style.display='none'; gifimg.style.display='none'; vid.style.display='block';
      // valores iniciales del recorte
      ui.t0.value = '0.0'; ui.t1.value = fmt1(Math.min(duration, 3));
      ui.t0.max = ui.t1.max = fmt1(duration);
      ui.wpx.max = Math.max(80, srcW); if(parseInt(ui.wpx.value,10) > srcW) ui.wpx.value = srcW;
      durHint.textContent = 'Video: '+srcW+'×'+srcH+' px · '+fmt1(duration)+' s';
      $('set0').disabled = false; $('set1').disabled = false;
      $('make').disabled = false; $('dl').disabled = true; $('back').disabled = true;
      gifBlob = null; meta.textContent = file.name;
      updateEstimate();
    };
    vid.onerror = ()=>{ meta.textContent='No se pudo abrir el video. Códec no soportado por el navegador.'; };
    vid.src = url;
  }

  drop.addEventListener('click', ()=> fileInput.click());
  drop.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fileInput.click(); } });
  fileInput.addEventListener('change', e=> loadFile(e.target.files[0]));
  ['dragenter','dragover'].forEach(ev=> stage.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('hot'); }));
  ['dragleave','drop'].forEach(ev=> stage.addEventListener(ev, e=>{
    e.preventDefault(); drop.classList.remove('hot');
    if(ev==='drop') loadFile(e.dataTransfer.files[0]);
  }));

  // ---------- captura por seeking ----------
  function seekTo(t){
    return new Promise((resolve, reject)=>{
      let done=false;
      const ok = ()=>{ if(done) return; done=true; cleanup(); resolve(); };
      const fail = ()=>{ if(done) return; done=true; cleanup(); reject(new Error('seek falló en t='+fmt1(t))); };
      const timer = setTimeout(()=>{ ok(); }, 1500); // fallback: algunos navegadores no disparan seeked al re-buscar el mismo t
      function cleanup(){ clearTimeout(timer); vid.removeEventListener('seeked', ok); vid.removeEventListener('error', fail); }
      vid.addEventListener('seeked', ok);
      vid.addEventListener('error', fail);
      vid.currentTime = Math.min(t, Math.max(0, duration - 0.001));
    });
  }

  async function makeGif(){
    if(working || !duration) return;
    const cfg = readConfig();  // corrige lo inválido en vez de abortar
    reflect(cfg);              // y lo refleja en la UI
    const plan = planFrames(cfg.t0, cfg.t1, cfg.fps, MAX_FRAMES);
    const { w, h } = outDims(srcW, srcH, cfg.wpx);
    const dith = cfg.dith ? DITHER_STRENGTH : 0;

    working = true; vid.pause();
    $('make').disabled = true;
    setBusy(true, 'capturando 0/'+plan.times.length);

    const cap = document.createElement('canvas'); cap.width=w; cap.height=h;
    const cctx = cap.getContext('2d', { willReadFrequently:true });
    const gif = GIFENC.GIFEncoder();

    try{
      for(let i=0; i<plan.times.length; i++){
        await seekTo(plan.times[i]);
        cctx.drawImage(vid, 0, 0, w, h);
        const rgba = cctx.getImageData(0, 0, w, h).data;
        const dithered = ditherOrdered(rgba, w, h, dith);
        const palette = GIFENC.quantize(dithered, 256, { format:'rgb565' });
        const index = GIFENC.applyPalette(dithered, palette, 'rgb565');
        gif.writeFrame(index, w, h, { palette, delay: plan.delayMs, repeat: 0 });
        busyT.textContent = 'capturando '+(i+1)+'/'+plan.times.length;
        progress((i+1)/plan.times.length);
        // ceder el hilo para que la UI respire
        if((i & 3) === 3) await new Promise(r=> setTimeout(r, 0));
      }
      gif.finish();
      gifBlob = new Blob([gif.bytes()], { type:'image/gif' });
      const gurl = URL.createObjectURL(gifBlob);
      gifimg.onload = ()=> URL.revokeObjectURL(gurl);
      gifimg.src = gurl;
      vid.style.display='none'; gifimg.style.display='block';
      meta.textContent = plan.times.length+' frames · '+w+'×'+h+' · '+fmtBytes(gifBlob.size);
      $('dl').disabled = false; $('back').disabled = false;
    }catch(err){
      meta.textContent = 'Error: '+(err && err.message || err);
    }finally{
      working = false; setBusy(false); $('make').disabled = false;
    }
  }

  $('make').addEventListener('click', makeGif);

  $('dl').addEventListener('click', ()=>{
    if(!gifBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(gifBlob);
    a.download = 'forja_'+ui.fps.value+'fps_'+Date.now()+'.gif';
    a.click(); URL.revokeObjectURL(a.href);
  });

  $('back').addEventListener('click', ()=>{
    gifimg.style.display='none'; vid.style.display='block';
  });
})();
</script>
