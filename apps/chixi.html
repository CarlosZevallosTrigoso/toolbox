<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ch'ixi</title>
<style>
  :root{
    --bg:#000000;
    --panel:#070706;
    --line:rgba(216,214,196,.10);
    --ink:#d8d6c4;
    --ink-dim:#6f7062;
    --accent:#8fa676;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; overflow:hidden}
  body{background:var(--bg); color:var(--ink); font-family:ui-monospace,"SF Mono","DejaVu Sans Mono",Menlo,Consolas,monospace; font-size:12px}

  canvas{position:fixed; inset:0; display:block}

  #brand{
    position:fixed; top:16px; left:18px; z-index:3;
    color:var(--ink-dim); letter-spacing:.14em; cursor:pointer; user-select:none;
  }
  #brand:hover{color:var(--ink)}

  #bar{
    position:fixed; left:0; right:0; bottom:0; z-index:3;
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
    padding:12px 18px; border-top:1px solid var(--line);
    background:rgba(5,5,4,.82); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .ctrl{display:flex; align-items:center; gap:9px}
  .ctrl span.lbl{color:var(--ink-dim); letter-spacing:.05em; white-space:nowrap}
  .ctrl input[type=range]{width:120px; accent-color:var(--accent)}
  .ctrl span.val{color:var(--accent); font-variant-numeric:tabular-nums; min-width:9ch; text-align:right}
  #bar .spacer{flex:1; min-width:8px}

  select{
    font-family:inherit; font-size:12px; background:#0d0d0b; color:var(--ink);
    border:1px solid var(--line); border-radius:2px; padding:5px 6px;
  }
  select:focus{outline:1px solid var(--accent); border-color:var(--accent)}

  button{
    font-family:inherit; font-size:12px; letter-spacing:.04em; cursor:pointer;
    border-radius:2px; padding:7px 12px; border:1px solid var(--line);
    background:#0d0d0b; color:var(--ink); transition:border-color .12s, color .12s;
  }
  button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
  button:disabled{opacity:.35; cursor:default}

  @media (max-width:640px){
    #bar{gap:14px}
    .ctrl input[type=range]{width:88px}
  }
</style>
</head>
<body>
  <div id="brand" title="recargar">ch'ixi</div>

  <canvas id="cv"></canvas>

  <div id="bar">
    <div class="ctrl">
      <span class="lbl">patrón</span>
      <select id="mode">
        <option value="random">aleatorio</option>
        <option value="checker">simétrico</option>
      </select>
    </div>
    <div class="ctrl">
      <span class="lbl">tamaño de píxel</span>
      <input type="range" id="px" min="0" max="1000" value="780" step="1">
      <span class="val" id="px-v">— px</span>
    </div>
    <div class="spacer"></div>
    <button id="regen">nueva</button>
    <button id="export">exportar PNG</button>
  </div>

<script>
'use strict';
(function(){

  // ---------- lógica pura ----------
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // campo base a resolución nativa del navegador (1 valor por píxel físico):
  // el "hilo" más fino posible. En modo aleatorio, todo lo demás se
  // muestrea de aquí. Proporción fija 50/50.
  function buildBaseField(w, h, seed){
    const rand = mulberry32(seed);
    const m = new Uint8Array(w * h);
    for (let i = 0; i < m.length; i++) m[i] = rand() < 0.5 ? 1 : 0; // 1 = blanco
    return m;
  }

  // el mismo tamaño de celda en ambos ejes garantiza celdas cuadradas
  // (no rectángulos estirados) aunque la ventana no sea cuadrada.
  // nx/ny por floor: ninguna celda queda cortada en el borde; el
  // remanente se reparte como margen simétrico en los cuatro lados,
  // como el borde de un tejido que no llega a cubrir el marco entero.
  function pickCellGrid(stageW, stageH, cellSize){
    const nx = Math.max(1, Math.floor(stageW / cellSize));
    const ny = Math.max(1, Math.floor(stageH / cellSize));
    const offX = (stageW - nx * cellSize) / 2;
    const offY = (stageH - ny * cellSize) / 2;
    return { actualCell: cellSize, nx, ny, offX, offY };
  }

  // muestrea (modo aleatorio) o calcula (modo tablero) sobre un lienzo
  // rectangular fijo. Columnas precomputadas fuera del bucle interno
  // para que el arrastre del slider sea fluido.
  function renderField(mode, base, baseW, baseH, g){
    const { actualCell, nx, ny, offX, offY } = g;
    const innerW = nx * actualCell, innerH = ny * actualCell;

    const cxOf = new Int32Array(baseW).fill(-1);
    const baseColOf = mode === 'random' ? new Int32Array(baseW).fill(-1) : null;
    for (let px = 0; px < baseW; px++){
      const localX = px - offX;
      if (localX >= 0 && localX < innerW){
        const cx = Math.min(nx - 1, Math.floor(localX / actualCell));
        cxOf[px] = cx;
        if (baseColOf) baseColOf[px] = Math.min(baseW - 1, Math.floor(cx * actualCell));
      }
    }

    const img = new Uint8ClampedArray(baseW * baseH * 4);
    for (let py = 0; py < baseH; py++){
      const localY = py - offY;
      const inY = localY >= 0 && localY < innerH;
      const cy = inY ? Math.min(ny - 1, Math.floor(localY / actualCell)) : -1;
      const baseRow = (inY && mode === 'random') ? Math.min(baseH - 1, Math.floor(cy * actualCell)) : 0;
      const rowOff = baseRow * baseW;
      const rowBase = py * baseW;
      for (let px = 0; px < baseW; px++){
        let v = 0; // margen: negro
        const cx = cxOf[px];
        if (inY && cx >= 0){
          if (mode === 'checker') v = (cx + cy) % 2; // tablero: alternancia estricta, sin azar
          else v = base[rowOff + baseColOf[px]];
        }
        const o = (rowBase + px) * 4;
        const c = v ? 255 : 0;
        img[o] = c; img[o+1] = c; img[o+2] = c; img[o+3] = 255;
      }
    }
    return { img, nx, ny, actualCell };
  }

  // mapeo logarítmico: más resolución de control cerca del extremo fino,
  // que es donde ocurre la transición óptica hacia el gris
  function sliderToPx(sliderVal, sliderMax, minSize, maxSize){
    if (maxSize <= minSize) return maxSize;
    return minSize * Math.pow(maxSize / minSize, sliderVal / sliderMax);
  }

  // ---------- hilo principal ----------
  const $ = (id) => document.getElementById(id);
  const cv = $('cv');
  const modeIn = $('mode'), pxIn = $('px');
  const pxVal = $('px-v');
  const regenBtn = $('regen'), exportBtn = $('export'), brand = $('brand');

  // el tamaño de píxel más fino posible es 1 píxel FÍSICO del dispositivo,
  // no 1px CSS — por eso el lienzo se renderiza a resolución nativa (DPR),
  // limitado a 2x para que el arrastre del slider siga fluido.
  const DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  const PX_MAX_CSS = 80;
  const PX_MIN_CSS = 1 / DPR;

  // el lienzo ocupa toda la ventana del navegador, calculado una sola
  // vez al cargar (como el resto del tejido, no se reajusta solo).
  const STAGE_W_CSS = window.innerWidth;
  const STAGE_H_CSS = window.innerHeight;
  const RES_W = Math.round(STAGE_W_CSS * DPR);
  const RES_H = Math.round(STAGE_H_CSS * DPR);
  cv.width = RES_W; cv.height = RES_H;
  cv.style.width = STAGE_W_CSS + 'px';
  cv.style.height = STAGE_H_CSS + 'px';

  let mode = modeIn.value;
  let seed = (Math.random() * 0xffffffff) >>> 0;
  let baseField = null;
  let lastActualCellCss = null;
  const ctx = cv.getContext('2d');

  function buildBase(){ baseField = buildBaseField(RES_W, RES_H, seed); }

  function render(){
    const cellCss = sliderToPx(+pxIn.value, +pxIn.max, PX_MIN_CSS, PX_MAX_CSS);
    const cellDevice = cellCss * DPR;
    const g = pickCellGrid(RES_W, RES_H, cellDevice);
    const r = renderField(mode, baseField, RES_W, RES_H, g);
    ctx.putImageData(new ImageData(r.img, RES_W, RES_H), 0, 0);
    lastActualCellCss = r.actualCell / DPR;
    pxVal.textContent = lastActualCellCss.toFixed(2) + ' px · ' + r.nx + '×' + r.ny;
  }

  function regenerateAll(){ buildBase(); render(); }

  function syncModeUI(){
    regenBtn.disabled = mode === 'checker'; // el tablero es determinista: no hay nada que "renovar"
  }

  // rAF throttling para arrastre fluido de sliders
  let rafRender = null;
  function scheduleRender(){ if (rafRender) return; rafRender = requestAnimationFrame(()=>{ rafRender=null; render(); }); }

  modeIn.addEventListener('change', ()=>{ mode = modeIn.value; syncModeUI(); scheduleRender(); });
  pxIn.addEventListener('input', scheduleRender);

  regenBtn.addEventListener('click', ()=>{ if (mode==='checker') return; seed = (Math.random() * 0xffffffff) >>> 0; regenerateAll(); });
  exportBtn.addEventListener('click', ()=>{
    cv.toBlob((blob)=>{
      const a = document.createElement('a');
      const tag = mode === 'checker' ? 'tablero' : 'aleatorio';
      a.href = URL.createObjectURL(blob);
      a.download = 'chixi_' + tag + '_' + lastActualCellCss.toFixed(2) + 'px_' + Date.now() + '.png';
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  });

  brand.addEventListener('click', ()=> location.reload());

  syncModeUI();
  regenerateAll();
})();
</script>
</body>
</html>
